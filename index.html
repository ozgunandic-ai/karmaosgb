<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>KARMA OSGB Doküman Yönetimi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>

/* KARMA OSGB — Doküman Yönetimi */
:root{
  --red:#BD1F2E; --red-d:#8E1421; --red-l:#F7DDE0;
  --ink:#16181D; --ink-2:#262A32; --ink-3:#3A3F4A;
  --paper:#FFFFFF; --surface:#F4F5F7; --surface-2:#EAECF0;
  --line:#DBDFE6; --line-s:#EDEFF3;
  --muted:#6B7280; --muted-2:#8A909B;
  --ok:#1C7A46; --ok-bg:#E6F4EC;
  --warn:#9A5B00; --warn-bg:#FCF2E2;
  --radius:7px;
  --shadow:0 12px 34px rgba(16,18,24,.16);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
html,body{height:100%}
body{
  margin:0;background:var(--surface);color:var(--ink);
  font-family:'Archivo','Segoe UI',system-ui,-apple-system,sans-serif;
  font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--red);text-decoration:none}
h1,h2,h3,h4{margin:0;font-weight:600;letter-spacing:-.011em}
:focus-visible{outline:2px solid var(--red);outline-offset:2px;border-radius:3px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- giriş ---------- */
.gate{min-height:100%;display:flex;align-items:center;justify-content:center;padding:32px 18px;
  background:
    radial-gradient(1100px 520px at 50% -15%, #23262E 0%, #16181D 62%, #101216 100%);}
.gate-card{width:100%;max-width:392px;background:var(--paper);border-radius:10px;padding:30px 30px 26px;
  box-shadow:0 26px 70px rgba(0,0,0,.42)}
.gate-logo{display:block;width:170px;margin:0 auto 20px}
.gate h1{font-size:17px;text-align:center;margin-bottom:4px}
.gate .sub{text-align:center;color:var(--muted);font-size:12.5px;margin-bottom:22px}
.gate .field{margin-bottom:13px}
.gate .foot{margin-top:18px;text-align:center;font-size:11.5px;color:var(--muted-2);line-height:1.6}

/* ---------- form öğeleri ---------- */
.field{display:block}
.field>label,.lbl{display:block;font-size:12px;font-weight:600;color:var(--ink-3);margin-bottom:5px}
.hint{font-size:12px;color:var(--muted);margin-top:5px;line-height:1.5}
input[type=text],input[type=password],input[type=number],input[type=date],select,textarea{
  width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:var(--radius);
  background:var(--paper);transition:border-color .12s,box-shadow .12s}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--ink-3);box-shadow:0 0 0 3px rgba(22,24,29,.07)}
input:disabled,select:disabled{background:var(--surface-2);color:var(--muted);cursor:not-allowed}
select{appearance:none;background-image:url("data:image/svg+xml;charset=utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='11' height='7' viewBox='0 0 11 7'%3E%3Cpath d='M1 1l4.5 4.5L10 1' fill='none' stroke='%236B7280' stroke-width='1.6'/%3E%3C/svg%3E");
  background-repeat:no-repeat;background-position:right 11px center;padding-right:30px}
textarea{resize:vertical;min-height:70px}

.btn{display:inline-flex;align-items:center;gap:7px;padding:9px 15px;border-radius:var(--radius);
  border:1px solid transparent;font-weight:600;font-size:13px;white-space:nowrap;transition:background .12s,border-color .12s}
.btn-primary{background:var(--red);color:#fff}
.btn-primary:hover{background:var(--red-d)}
.btn-dark{background:var(--ink);color:#fff}
.btn-dark:hover{background:var(--ink-2)}
.btn-ghost{background:var(--paper);border-color:var(--line);color:var(--ink)}
.btn-ghost:hover{border-color:var(--ink-3);background:var(--surface)}
.btn-quiet{background:transparent;color:var(--muted);padding:6px 9px}
.btn-quiet:hover{color:var(--ink);background:var(--surface-2)}
.btn-danger{background:transparent;border-color:var(--line);color:var(--red)}
.btn-danger:hover{background:var(--red-l);border-color:var(--red)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn-sm{padding:6px 11px;font-size:12.5px}
.btn-block{width:100%;justify-content:center;padding:11px}

/* segment seçici */
.seg{display:inline-flex;flex-wrap:wrap;gap:6px}
.seg button{padding:7px 13px;border:1px solid var(--line);background:var(--paper);border-radius:99px;
  font-size:12.5px;font-weight:500;color:var(--ink-3);transition:all .12s}
.seg button:hover{border-color:var(--ink-3)}
.seg button[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:#fff}
.seg.seg-red button[aria-pressed=true]{background:var(--red);border-color:var(--red)}

/* ---------- uygulama kabuğu ---------- */
.shell{display:flex;flex-direction:column;min-height:100%}
.topbar{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:14px;
  background:var(--ink);color:#fff;padding:0 18px;padding-top:env(safe-area-inset-top,0px);height:calc(54px + env(safe-area-inset-top,0px))}
.topbar img{height:26px;display:block}
.topbar .tsep{width:1px;height:20px;background:rgba(255,255,255,.22)}
.topbar .tname{font-size:13.5px;font-weight:600;letter-spacing:.01em;white-space:nowrap}
.topbar .tspace{flex:1}
.topbar .tuser{display:flex;align-items:center;gap:9px;font-size:12.5px;color:rgba(255,255,255,.82)}
.avatar{width:27px;height:27px;border-radius:50%;background:var(--red);color:#fff;display:grid;place-items:center;
  font-size:11.5px;font-weight:700}
.topbar .btn-quiet{color:rgba(255,255,255,.72)}
.topbar .btn-quiet:hover{color:#fff;background:rgba(255,255,255,.1)}
.burger{display:none}

.body{display:flex;flex:1;min-height:0}
.nav{width:212px;flex:0 0 212px;background:var(--paper);border-right:1px solid var(--line);padding:14px 10px}
.nav-group{font-size:10.5px;font-weight:700;letter-spacing:.09em;color:var(--muted-2);padding:12px 10px 6px}
.nav a{display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:var(--radius);
  color:var(--ink-3);font-size:13.5px;font-weight:500;border-left:3px solid transparent;margin-bottom:2px}
.nav a:hover{background:var(--surface)}
.nav a.on{background:var(--surface);color:var(--ink);font-weight:600;border-left-color:var(--red)}
.nav svg{width:16px;height:16px;flex:0 0 16px;stroke:currentColor;fill:none;stroke-width:1.7}
.main{flex:1;min-width:0;padding:24px 26px 90px}
.wrap{max-width:1160px;margin:0 auto}

/* ---------- sayfa başlıkları ---------- */
.phead{display:flex;align-items:flex-start;gap:16px;margin-bottom:20px;flex-wrap:wrap}
.phead h1{font-size:22px}
.phead .psub{color:var(--muted);font-size:13px;margin-top:3px}
.phead .pact{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.crumb{font-size:12px;color:var(--muted);margin-bottom:6px}
.crumb button{background:none;border:none;color:var(--muted);padding:0;font-size:12px}
.crumb button:hover{color:var(--red)}

/* ---------- kartlar & tablolar ---------- */
.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);margin-bottom:16px}
.card-h{display:flex;align-items:center;gap:11px;padding:14px 18px;border-bottom:1px solid var(--line-s)}
.card-h h2{font-size:15px}
.card-h .ch-sub{font-size:12px;color:var(--muted)}
.card-b{padding:18px}
.card-b.tight{padding:0;overflow-x:auto}

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
@media(max-width:760px){.grid2,.grid3{grid-template-columns:1fr}}

table.tbl{width:100%;border-collapse:collapse;font-size:13.5px;min-width:560px}
table.tbl th{text-align:left;font-size:11px;letter-spacing:.06em;font-weight:700;color:var(--muted);
  padding:10px 16px;border-bottom:1px solid var(--line);background:var(--surface)}
table.tbl td{padding:12px 16px;border-bottom:1px solid var(--line-s);vertical-align:middle}
table.tbl tr:last-child td{border-bottom:none}
table.tbl tbody tr:hover{background:#FCFCFD}
.row-link{font-weight:600;color:var(--ink)}
.row-link:hover{color:var(--red)}
.cell-act{text-align:right;white-space:nowrap}

.tag{display:inline-block;padding:2px 8px;border-radius:99px;font-size:11.5px;font-weight:600;
  background:var(--surface-2);color:var(--ink-3)}
.tag-red{background:var(--red-l);color:var(--red-d)}
.tag-ok{background:var(--ok-bg);color:var(--ok)}
.tag-warn{background:var(--warn-bg);color:var(--warn)}

.empty{text-align:center;padding:52px 24px;color:var(--muted)}
.empty h3{font-size:15px;color:var(--ink);margin-bottom:6px}
.empty p{margin:0 0 16px;font-size:13px}

/* ---------- plan editörü ---------- */
.plan{display:flex;gap:22px;align-items:flex-start}
.plan-idx{position:sticky;top:78px;width:210px;flex:0 0 210px;background:var(--paper);
  border:1px solid var(--line);border-radius:var(--radius);padding:8px;max-height:calc(100vh - 120px);overflow:auto}
.plan-idx button{display:flex;gap:9px;width:100%;text-align:left;background:none;border:none;
  padding:7px 9px;border-radius:5px;font-size:12.5px;color:var(--ink-3);line-height:1.35}
.plan-idx button:hover{background:var(--surface)}
.plan-idx button.on{background:var(--ink);color:#fff;font-weight:600}
.plan-idx .n{color:var(--muted-2);font-variant-numeric:tabular-nums;flex:0 0 22px}
.plan-idx button.on .n{color:rgba(255,255,255,.6)}
.plan-body{flex:1;min-width:0}
@media(max-width:980px){.plan{flex-direction:column}.plan-idx{position:static;width:100%;flex:none;display:flex;gap:4px;overflow-x:auto}
  .plan-idx button{white-space:nowrap;width:auto}}

.sect{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);margin-bottom:14px;overflow:hidden}
.sect-h{display:flex;align-items:center;gap:12px;padding:13px 17px;background:var(--surface);
  border-bottom:1px solid var(--line)}
.sect-n{font-size:12px;font-weight:700;color:var(--red);font-variant-numeric:tabular-nums;flex:0 0 auto}
.sect-h h3{font-size:14.5px}
.act{padding:16px 17px;border-bottom:1px solid var(--line-s)}
.act:last-child{border-bottom:none}
.act-h{display:flex;align-items:baseline;gap:10px;margin-bottom:11px;flex-wrap:wrap}
.act-n{font-size:12px;font-weight:700;color:var(--muted-2);font-variant-numeric:tabular-nums}
.act-h strong{font-size:13.5px;font-weight:600}
.q{margin-bottom:12px}
.q:last-child{margin-bottom:0}
.q .qt{font-size:12.5px;color:var(--ink-3);margin-bottom:7px;font-weight:500}
.inline{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap}
.inline .field{min-width:150px}
.notebox{background:var(--surface);border-left:3px solid var(--ink-3);padding:10px 13px;border-radius:0 5px 5px 0;
  font-size:12.5px;color:var(--ink-3);line-height:1.55}
.notebox.ok{background:var(--ok-bg);border-left-color:var(--ok);color:#146035}
.notebox.warn{background:var(--warn-bg);border-left-color:var(--warn);color:#7A4800}

/* 12 ay × 4 hafta ızgarası */
.g48{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px;user-select:none}
.g48 .gm{flex:1 1 auto;min-width:0}
.g48 .gml{display:block;font-size:9.5px;font-weight:700;letter-spacing:.05em;color:var(--muted-2);
  text-align:center;margin-bottom:3px}
.g48 .gw{display:flex;gap:2px}
.g48 .gw button{width:15px;height:24px;flex:1 1 0;min-width:13px;border:1px solid var(--line);background:var(--paper);
  border-radius:2px;padding:0;font-size:0;transition:background .1s}
.g48 .gw button:hover{border-color:var(--ink-3)}
.g48 .gw button[aria-pressed=true]{background:var(--red);border-color:var(--red-d)}
.g48.ro .gw button{cursor:default}
.gtools{display:flex;gap:6px;align-items:center;margin-top:9px;flex-wrap:wrap}
.gcount{font-size:11.5px;color:var(--muted)}

.savebar{position:fixed;left:0;right:0;bottom:0;z-index:35;background:rgba(255,255,255,.96);
  backdrop-filter:blur(8px);border-top:1px solid var(--line);
  padding:11px 26px;padding-bottom:calc(11px + env(safe-area-inset-bottom,0px));
  display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.savebar .sb-info{font-size:12.5px;color:var(--muted)}
.savebar .sb-space{flex:1}

/* ---------- modal ---------- */
.mask{position:fixed;inset:0;z-index:60;background:rgba(16,18,24,.5);display:flex;align-items:flex-start;
  justify-content:center;padding:6vh 18px 40px;overflow:auto}
.modal{background:var(--paper);border-radius:9px;width:100%;max-width:560px;box-shadow:var(--shadow)}
.modal.wide{max-width:760px}
.modal-h{display:flex;align-items:center;padding:16px 20px;border-bottom:1px solid var(--line-s)}
.modal-h h2{font-size:15.5px}
.modal-h .x{margin-left:auto}
.modal-b{padding:20px;max-height:66vh;overflow:auto}
.modal-f{display:flex;gap:9px;justify-content:flex-end;padding:14px 20px;border-top:1px solid var(--line-s);
  background:var(--surface);border-radius:0 0 9px 9px;flex-wrap:wrap}

/* ---------- bildirim ---------- */
#toast{position:fixed;z-index:80;left:50%;transform:translateX(-50%);
  bottom:calc(76px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:8px;align-items:center;
  pointer-events:none;width:calc(100% - 36px);max-width:440px}
.toast{background:var(--ink);color:#fff;padding:10px 16px;border-radius:7px;font-size:13px;
  box-shadow:var(--shadow);display:flex;gap:10px;align-items:center;pointer-events:auto}
.toast.err{background:var(--red-d)}
.toast.ok{background:#146035}
.toast-eylem{flex:0 0 auto;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.35);
  color:#fff;padding:4px 10px;border-radius:5px;font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap}
.toast-eylem:hover{background:rgba(255,255,255,.3)}

.err-txt{color:var(--red-d);font-size:12.5px;margin-top:9px;font-weight:500;min-height:17px}
.spin{width:15px;height:15px;border:2px solid rgba(255,255,255,.35);border-top-color:#fff;border-radius:50%;
  animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.boot{min-height:100%;display:grid;place-items:center;color:var(--muted);font-size:13px;gap:12px}

.memberrow{display:flex;gap:8px;margin-bottom:8px;align-items:center}
.memberrow input:first-child{flex:0 0 40%}

@media(max-width:860px){
  .nav{position:fixed;top:calc(54px + env(safe-area-inset-top,0px));bottom:0;left:0;z-index:38;transform:translateX(-100%);
    transition:transform .2s;box-shadow:var(--shadow)}
  .nav.open{transform:none}
  .main{padding:18px 16px 92px}
  .burger{display:inline-flex}
  .savebar{padding-left:16px;padding-right:16px}
}

/* ---------- koyu tema ---------- */
@media (prefers-color-scheme:dark){
  :root:not([data-theme=light]){
    --paper:#1C1F25; --surface:#15171C; --surface-2:#272B33;
    --ink:#E9EBEF; --ink-2:#D3D7DE; --ink-3:#BFC4CD;
    --line:#333842; --line-s:#282C34;
    --muted:#98A0AD; --muted-2:#7C8492;
    --red-l:#3A1A1F; --ok-bg:#122A1E; --warn-bg:#2C2113;
    --shadow:0 12px 34px rgba(0,0,0,.5);
  }
  :root:not([data-theme=light]) .topbar{background:#0F1115}
  :root:not([data-theme=light]) .nav{background:var(--paper)}
  :root:not([data-theme=light]) table.tbl tbody tr:hover{background:#21252C}
  :root:not([data-theme=light]) .savebar{background:rgba(28,31,37,.96)}
  :root:not([data-theme=light]) .gate-card{background:var(--paper)}
  :root:not([data-theme=light]) select{background-image:url("data:image/svg+xml;charset=utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='11' height='7' viewBox='0 0 11 7'%3E%3Cpath d='M1 1l4.5 4.5L10 1' fill='none' stroke='%2398A0AD' stroke-width='1.6'/%3E%3C/svg%3E")}
}
:root[data-theme=dark]{
  --paper:#1C1F25; --surface:#15171C; --surface-2:#272B33;
  --ink:#E9EBEF; --ink-2:#D3D7DE; --ink-3:#BFC4CD;
  --line:#333842; --line-s:#282C34;
  --muted:#98A0AD; --muted-2:#7C8492;
  --red-l:#3A1A1F; --ok-bg:#122A1E; --warn-bg:#2C2113;
}
:root[data-theme=dark] .topbar{background:#0F1115}
:root[data-theme=dark] .nav{background:var(--paper)}
:root[data-theme=dark] .savebar{background:rgba(28,31,37,.96)}

@media(max-width:700px){
  .topbar .tname,.topbar .tsep{display:none}
  .topbar .uname{display:none}
  table.tbl th.opt,table.tbl td.opt{display:none}
  table.tbl{min-width:0}
  .phead h1{font-size:19px}
  .memberrow{flex-wrap:wrap}
  .memberrow input:first-child{flex:1 1 100%}
}

/* ---------- gün/ay/yıl tarih seçici ---------- */
.tarih3{display:inline-flex;gap:6px;flex-wrap:wrap}
.tarih3 select{padding:9px 26px 9px 10px}
.tarih3 select[data-td="g"]{width:72px}
.tarih3 select[data-td="a"]{width:118px}
.tarih3 select[data-td="y"]{width:88px}

/* ---------- hızlı ön izleme: tam ekran overlay ---------- */
.hizli-btn{background:var(--ink)!important;color:#fff!important;font-weight:700;margin-bottom:8px;
  border-radius:5px!important;justify-content:flex-start;width:100%}
.hizli-btn .n{color:var(--red)!important;font-size:13px}
.hizli-btn:hover{background:var(--ink-2)!important}

.hz-overlay{position:fixed;inset:0;z-index:70;background:var(--paper);display:flex;flex-direction:column;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.hz-ovh{display:flex;align-items:flex-start;gap:14px;padding:16px 22px;border-bottom:1px solid var(--line);
  background:var(--surface);flex:0 0 auto}
.hz-ovh h2{font-size:17px}
.hz-ovh .hint{display:block;margin-top:2px}
.hz-ovh .btn{margin-left:auto}
.hz-ovb{flex:1;min-height:0;overflow:auto;padding:14px 22px 22px}

.hz-scroll{width:100%}
table.hz-tbl{border-collapse:collapse;font-size:11px;width:100%;table-layout:fixed}
table.hz-tbl th,table.hz-tbl td{border:1px solid var(--line-s)}
th.hz-grup-h,th.hz-faaliyet-h{background:var(--ink);color:#fff;padding:8px 8px;text-align:left;
  font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
th.hz-ay{background:var(--ink);color:#fff;padding:5px 1px;font-size:10px;text-align:center}
th.hz-hafta-h{background:var(--surface-2);color:var(--muted);font-size:8.5px;font-weight:600;
  padding:3px 0;text-align:center}
td.hz-grup{background:var(--surface);font-weight:700;padding:7px 8px;font-size:11px;
  vertical-align:top;overflow:hidden;text-overflow:ellipsis}
td.hz-faaliyet{padding:6px 8px;font-size:11px;background:var(--paper);overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
td.hz-faaliyet .hz-no{color:var(--muted);font-variant-numeric:tabular-nums;margin-right:4px}
td.hz-faaliyet .tag{font-size:9.5px;padding:1px 5px;margin-left:5px}
.hz-git{background:none;border:none;color:var(--red);font-size:10px;font-weight:600;
  padding:0;margin-left:6px;cursor:pointer;white-space:nowrap}
.hz-git:hover{text-decoration:underline}
td.hz-hafta{height:23px;padding:0}
td.hz-hafta.ed{cursor:pointer;background:var(--paper)}
td.hz-hafta.ed:hover{background:var(--surface-2)}
td.hz-hafta.ro{background:var(--surface)}
td.hz-hafta.on{background:var(--red)}
td.hz-hafta.ro.on{background:var(--red);opacity:.6}
td.hz-not{padding:6px 10px;font-size:11px;color:var(--ink-3);background:var(--surface);text-align:left}

/* dar ekranlarda tablo küçük hücrelere sıkışmak yerine yatay kaydırmaya döner */
@media(max-width:820px){
  table.hz-tbl{table-layout:auto;min-width:1400px}
  .hz-ovb{overflow-x:auto}
  th.hz-grup-h,td.hz-grup{width:100px;max-width:100px}
  th.hz-faaliyet-h,td.hz-faaliyet{width:200px;min-width:200px;white-space:nowrap}
  td.hz-hafta{width:16px}
}
@media(max-width:700px){
  .hz-ovh{flex-direction:column;gap:8px}
  .hz-ovh .btn{margin-left:0}
}

/* hızlı tabloda ay sınırlarını belirginleştir */
table.hz-tbl th.ay-sinir,
table.hz-tbl td.ay-sinir{border-left:2px solid var(--ink-3)}
table.hz-tbl th.hz-ay.ay-sinir{border-left:2px solid #fff}

/* ---------- firma ziyaret takibi takvimi ---------- */
.zv-takvim{width:100%;overflow-x:auto}
.zv-baslikSatir{display:grid;grid-template-columns:repeat(7,minmax(150px,1fr));background:var(--ink);min-width:1050px}
.zv-baslik{padding:9px 8px;text-align:center;font-size:11px;font-weight:700;color:#fff}
.zv-govde{display:grid;grid-template-columns:repeat(7,minmax(150px,1fr));min-width:1050px}
.zv-hucre{border:1px solid var(--line-s);min-height:170px;padding:7px;display:flex;flex-direction:column;gap:5px}
.zv-bos{background:var(--surface)}
.zv-haftasonu{background:var(--surface)}
.zv-bugun{box-shadow:inset 0 0 0 2px var(--red)}
.zv-gun-no{font-size:12px;font-weight:700;color:var(--muted);margin-bottom:2px}
.zv-zaman{margin-bottom:2px}
.zv-zaman-l{font-size:8.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted-2);margin-bottom:3px;font-weight:700}
.zv-cip{display:flex;align-items:center;justify-content:space-between;gap:4px;padding:3px 5px;border-radius:4px;
  font-size:10.5px;margin-bottom:2px;background:var(--surface-2)}
.zv-cip.zv-ok{background:var(--ok-bg);color:var(--ok)}
.zv-cip.zv-kotu{background:var(--red-l);color:var(--red-d)}
.zv-cip.zv-bekliyor{background:var(--surface-2);color:var(--ink-3)}
.zv-cip-ad{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:88px;font-weight:600}
.zv-cip-eylem{display:flex;gap:3px;flex:0 0 auto}
.zv-cip-eylem button{border:none;background:none;cursor:pointer;font-size:10.5px;padding:1px 2px;line-height:1;
  opacity:.65;border-radius:3px}
.zv-cip-eylem button:hover{opacity:1;background:rgba(0,0,0,.08)}
.zv-ekle{background:none;border:1px dashed var(--line);border-radius:4px;font-size:10px;color:var(--muted);
  padding:3px 5px;cursor:pointer;width:100%;text-align:left;margin-top:1px}
.zv-ekle:hover{border-color:var(--red);color:var(--red)}

.zv-cip-durum{flex:0 0 auto;font-size:11px;font-weight:700;opacity:.85}

/* ziyaret takibi başlığındaki seçiciler yan yana dursun */
.pact select{width:auto;min-width:120px}


/* ---------- eğitim kayıtları: konu listesi ---------- */
.ck-bolum{margin-bottom:14px}
.ck-baslik{font-size:12px;font-weight:700;letter-spacing:.02em;margin:0 0 7px;color:var(--ink)}
.ck-satir{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:5px 0;border-bottom:1px solid var(--line-s)}
.ck{display:flex;align-items:flex-start;gap:8px;flex:1;min-width:0;font-size:13px;cursor:pointer}
.ck input[type=checkbox]{margin-top:3px;flex:0 0 auto;width:16px;height:16px;accent-color:var(--red)}
.ck-ad{width:100%;padding:5px 8px}
.ck-dk{display:flex;align-items:center;gap:5px;flex:0 0 auto;font-size:12px;color:var(--muted)}
.ck-dk input{width:64px;padding:5px 7px}
.ck-toplam{padding:9px 12px;border-radius:6px;font-size:13px;font-weight:600}
.ck-toplam.ok{background:var(--ok-bg);color:var(--ok)}
.ck-toplam.uyari{background:var(--warn-bg);color:var(--warn)}

</style>
</head>

(function (root) {

  var CRC_TABLE = (function () {

      dv.setUint32(0, 0x04034b50, true);
      dv.setUint16(4, 20, true);
      dv.setUint16(6, 0x0800, true);   // UTF-8 bayrağı

      dv.setUint16(12, 0x21, true);

      dv.setUint32(18, data.length, true);
      dv.setUint32(22, data.length, true);
      dv.setUint16(26, name.length, true);
      dv.setUint16(28, 0, true);

      parts.push(lh, data);

      var ch = new Uint8Array(46 + name.length);
      var cv = new DataView(ch.buffer);
      cv.setUint32(0, 0x02014b50, true);
      cv.setUint16(4, 20, true);
      cv.setUint16(6, 20, true);
      cv.setUint16(8, 0x0800, true);
      cv.setUint16(10, 0, true);
      cv.setUint16(12, 0, true);
      cv.setUint16(14, 0x21, true);

      cv.setUint32(20, data.length, true);
      cv.setUint32(24, data.length, true);
      cv.setUint16(28, name.length, true);
      cv.setUint32(42, offset, true);

    for (i = 0; i < central.length; i++) cdSize += central[i].length;

    ev.setUint16(8, files.length, true);
    ev.setUint16(10, files.length, true);

      if (cs.length && cs[cs.length - 1] > maxC) maxC = cs[cs.length - 1];
      var cells = cs.map(function (c) {
        var cell = this.rows[r][c], ref = colName(c) + r;
        if (cell.v === '' || cell.v === null || cell.v === undefined)
          return '<c r="' + ref + '" s="' + cell.s + '"/>';
        if (cell.n) return '<c r="' + ref + '" s="' + cell.s + '"><v>' + cell.v + '</v></c>';
        return '<c r="' + ref + '" s="' + cell.s + '" t="inlineStr"><is><t xml:space="preserve">' + esc(cell.v) + '</t></is></c>';
      }, this).join('');
      var ht = this.heights[r] ? ' ht="' + this.heights[r] + '" customHeight="1"' : '';
      out.push('<row r="' + r + '"' + ht + '>' + cells + '</row>');
    }, this);

    var colXml = cols.map(function (c) {
      return '<col min="' + c.min + '" max="' + c.max + '" width="' + c.w + '" customWidth="1"/>';
    }).join('');

    var pane = freeze ? '<pane xSplit="2" ySplit="' + freeze + '" topLeftCell="C' + (freeze + 1) + '" activePane="bottomRight" state="frozen"/>' : '';
    var mergeXml = this.merges.length
      ? '<mergeCells count="' + this.merges.length + '">' + this.merges.map(function (m) { return '<mergeCell ref="' + m + '"/>'; }).join('') + '</mergeCells>'
      : '';

    return '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
      '<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships">' +
      '<sheetPr><pageSetUpPr fitToPage="1"/></sheetPr>' +
      '<dimension ref="A1:' + colName(maxC) + (rowNums.length ? rowNums[rowNums.length - 1] : 1) + '"/>' +
      '<sheetViews><sheetView tabSelected="1" showGridLines="0" workbookViewId="0" zoomScale="85">' + pane + '</sheetView></sheetViews>' +
      '<sheetFormatPr defaultRowHeight="15"/>' +
      '<cols>' + colXml + '</cols>' +
      '<sheetData>' + out.join('') + '</sheetData>' +
      mergeXml +
      '<pageMargins left="0.25" right="0.25" top="0.4" bottom="0.4" header="0.3" footer="0.3"/>' +
      '<pageSetup paperSize="9" orientation="landscape" fitToWidth="1" fitToHeight="0"/>' +
      '</worksheet>';
  }

  function packXlsx(sheetXml, sheetName) {

      '<Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>' +

      '<sheets><sheet name="' + esc(sheetName) + '" sheetId="1" r:id="rId1"/></sheets></workbook>';

  /* ---- Yıllık İSG Planı çalışma kitabı --------------------------------
     plan = {
       yil, firma:{unvan,faaliyet,tehlike,uzman,hekim,sgk},
       formNo, revTarihi,
       gruplar:[ {ad, faaliyetler:[ {ad, not:'', hafta:[48 bool]} ]} ]
     }
  --------------------------------------------------------------------- */
  function buildPlanXlsx(plan) {
    var sh = new Sheet();
    var C0 = 1, C1 = 2, W0 = 3, W1 = 50;   // A grup, B faaliyet, C..AX haftalar
    var r = 1;

    // Başlık
    sh.set(r, C0, plan.yil + ' YILI İŞ SAĞLIĞI VE GÜVENLİĞİ YILLIK ÇALIŞMA PLANI', S.TITLE);
    sh.blank(r, C0, W1, S.TITLE); sh.merge(r, C0, r, W1); sh.h(r, 34); r++;

    sh.set(r, C0, 'Form No: ' + (plan.formNo || 'İSG.PLN.01') + '   ·   Revizyon Tarihi: ' + (plan.revTarihi || '-') + '   ·   Düzenleyen: KARMA İş Sağlığı Güvenliği', S.FORM);
    sh.blank(r, C0, W1, S.FORM); sh.merge(r, C0, r, W1); sh.h(r, 16); r++;
    r++;

    function meta(lblL, valL, lblR, valR) {
      sh.set(r, C0, lblL + '  ' + (valL || '-'), S.META_L);
      sh.blank(r, C0, 22, S.META_L); sh.merge(r, C0, r, 22);
      sh.set(r, 23, lblR + '  ' + (valR || '-'), S.META_L);
      sh.blank(r, 23, W1, S.META_L); sh.merge(r, 23, r, W1);
      sh.h(r, 18); r++;
    }
    var f = plan.firma || {};
    meta('İŞYERİNİN ÜNVANI:', f.unvan, 'SGK SİCİL NO:', f.sgk);
    meta('FAALİYET KONUSU:', f.faaliyet, 'TEHLİKE SINIFI:', f.tehlike);
    meta('İŞ GÜVENLİĞİ UZMANI:', f.uzman, 'İŞYERİ HEKİMİ:', f.hekim);
    r++;

    // Tablo başlığı
    var hr = r;
    sh.set(hr, C0, 'ANA FAALİYETLER', S.HEAD); sh.merge(hr, C0, hr + 1, C0);
    sh.set(hr + 1, C0, '', S.HEAD);
    sh.set(hr, C1, 'FAALİYETLER', S.HEAD); sh.merge(hr, C1, hr + 1, C1);
    sh.set(hr + 1, C1, '', S.HEAD);
    for (var m = 0; m < 12; m++) {
      var c = W0 + m * 4;
      sh.set(hr, c, AYLAR[m], S.MONTH);
      sh.blank(hr, c, c + 3, S.MONTH);
      sh.merge(hr, c, hr, c + 3);
      for (var w = 0; w < 4; w++) sh.set(hr + 1, c + w, w + 1, S.WEEK, true);
    }
    sh.h(hr, 20); sh.h(hr + 1, 15);
    r = hr + 2;

    // Satırlar
    (plan.gruplar || []).forEach(function (g) {
      var start = r;
      g.faaliyetler.forEach(function (a) {
        sh.set(r, C1, a.ad, S.ACT);
        if (a.not) {
          sh.set(r, W0, a.not, S.NOTE);
          sh.blank(r, W0, W1, S.NOTE);
          sh.merge(r, W0, r, W1);
          sh.h(r, Math.max(22, Math.ceil(String(a.not).length / 120) * 16));
        } else {
          for (var i = 0; i < 48; i++) {
            var marked = a.hafta && a.hafta[i];
            sh.set(r, W0 + i, marked ? '' : '', marked ? S.MARK : S.CELL);
          }
          sh.h(r, 18);
        }
        r++;
      });
      sh.set(start, C0, g.ad, S.GROUP);
      for (var k = start + 1; k < r; k++) sh.set(k, C0, '', S.GROUP);
      if (r - 1 > start) sh.merge(start, C0, r - 1, C0);
    });

    r += 2;
    sh.set(r, 2, 'İş Güvenliği Uzmanı', S.SIGN); sh.blank(r, 2, 10, S.SIGN); sh.merge(r, 2, r, 10);
    sh.set(r, 14, 'İşveren / İşveren Vekili', S.SIGN); sh.blank(r, 14, 24, S.SIGN); sh.merge(r, 14, r, 24);
    sh.set(r, 28, 'İşyeri Hekimi', S.SIGN); sh.blank(r, 28, 38, S.SIGN); sh.merge(r, 28, r, 38);
    sh.h(r, 40);
    r += 2;
    sh.set(r, 1, 'Bu plan KARMA OSGB Doküman Yönetimi ile ' + (plan.olusturma || '') + ' tarihinde üretilmiştir.', S.FORM);
    sh.blank(r, 1, W1, S.FORM); sh.merge(r, 1, r, W1);

    var cols = [{ min: 1, max: 1, w: 24 }, { min: 2, max: 2, w: 42 }, { min: 3, max: 50, w: 3.1 }];
    return packXlsx(sh.xml(cols, hr + 1), plan.yil + ' İSG Planı');
  }

  /* ======================================================================

  function p(text, o) {
    o = o || {};
    var rPr = '<w:rPr>' + (o.b ? '<w:b/>' : '') + (o.i ? '<w:i/>' : '') +
      (o.color ? '<w:color w:val="' + o.color + '"/>' : '') +
      '<w:rFonts w:ascii="' + (o.font || 'Calibri') + '" w:hAnsi="' + (o.font || 'Calibri') + '" w:cs="' + (o.font || 'Calibri') + '"/>' +
      '<w:sz w:val="' + (o.size || 22) + '"/></w:rPr>';
    var pPr = '<w:pPr>' +
      '<w:spacing w:before="' + (o.before || 0) + '" w:after="' + (o.after === undefined ? 120 : o.after) + '" w:line="' + (o.line || 276) + '" w:lineRule="auto"/>' +
      (o.align ? '<w:jc w:val="' + o.align + '"/>' : '') +
      (o.ind ? '<w:ind w:left="' + o.ind + '"/>' : '') +
      '</w:pPr>';
    var runs = String(text === undefined || text === null ? '' : text).split('\n').map(function (line, i) {
      return (i ? '<w:r>' + rPr + '<w:br/></w:r>' : '') +
        '<w:r>' + rPr + '<w:t xml:space="preserve">' + esc(line) + '</w:t></w:r>';
    }).join('');
    return '<w:p>' + pPr + runs + '</w:p>';
  }

  function tc(content, o) {
    o = o || {};
    return '<w:tc><w:tcPr><w:tcW w:w="' + (o.w || 2000) + '" w:type="dxa"/>' +
      (o.span ? '<w:gridSpan w:val="' + o.span + '"/>' : '') +
      (o.fill ? '<w:shd w:val="clear" w:color="auto" w:fill="' + o.fill + '"/>' : '') +
      '<w:vAlign w:val="' + (o.vtop ? 'top' : 'center') + '"/></w:tcPr>' + content + '</w:tc>';
  }

  function tbl(rowsXml, widths, sinirsiz, kompakt) {
    return '<w:tbl><w:tblPr><w:tblW w:w="0" w:type="auto"/>' +
      '<w:tblBorders>' +
      ['top', 'left', 'bottom', 'right', 'insideH', 'insideV'].map(function (s) {
        return sinirsiz ? ('<w:' + s + ' w:val="none" w:sz="0" w:space="0"/>') : ('<w:' + s + ' w:val="single" w:sz="6" w:space="0" w:color="8A8F99"/>');
      }).join('') +

      '</w:tblPr><w:tblGrid>' + widths.map(function (w) { return '<w:gridCol w:w="' + w + '"/>'; }).join('') + '</w:tblGrid>' +
      rowsXml + '</w:tbl>';
  }

  function slug(s) {

  var SUB = (window.crypto && window.crypto.subtle) ? window.crypto.subtle : null;
  function rnd(n) { var a = new Uint8Array(n); (window.crypto || {}).getRandomValues ? crypto.getRandomValues(a) : a.forEach(function (_, i) { a[i] = Math.floor(Math.random() * 256); }); return a; }
  function hex(buf) { return Array.prototype.map.call(new Uint8Array(buf), function (b) { return ('0' + b.toString(16)).slice(-2); }).join(''); }
  function hashSifre(sifre, saltHex) {
    var salt = saltHex || hex(rnd(16));
    if (!SUB) { // yedek: basit toplam (yalnızca güvenli bağlam yoksa)
      var h = 0, s = salt + '|' + sifre;
      for (var i = 0; i < s.length; i++) { h = ((h << 5) - h + s.charCodeAt(i)) | 0; }
      return Promise.resolve({ salt: salt, hash: 'w' + (h >>> 0).toString(16) });
    }
    var kb = new TextEncoder().encode(sifre);
    return SUB.importKey('raw', kb, 'PBKDF2', false, ['deriveBits']).then(function (key) {

  }

  function encYol(p) { return p.split('/').map(encodeURIComponent).join('/'); }

  function ghHata(status, mesaj) {
    var m;
    if (status === 401) m = 'Kimlik doğrulama başarısız: erişim anahtarı geçersiz veya süresi dolmuş.';
    else if (status === 403 && /rate limit/i.test(mesaj || '')) m = 'GitHub API istek sınırına ulaşıldı; birkaç dakika sonra tekrar deneyin.';
    else if (status === 403) m = 'Bu depoya yazma izniniz yok. Erişim anahtarının "Contents: Read and write" iznine sahip olduğundan emin olun.';
    else if (status === 404) m = 'Depo veya dosya bulunamadı. Kullanıcı adı / depo adı / dal bilgisini kontrol edin.';
    else if (status === 409 || status === 422) m = 'Kayıt çakışması oluştu, lütfen tekrar deneyin. (' + (mesaj || '') + ')';
    else m = mesaj || ('GitHub API hatası (' + status + ')');
    var e = new Error(m); e.status = status; return e;
  }

  function ghApi(method, apiPath, gizliGH, gövde) {
    var cfg = gizliGH || GH;
    // cache:'no-store': bazı tarayıcılar Authorization başlıklı GET isteklerini
    // bile kısa süreliğine önbelleğe alabiliyor; bu da "sha" tabanlı yazma
    // öncesi okumanın eski bir sonuç döndürmesine yol açabiliyordu. Bu, saf
    // bir fetch seçeneğidir (başlık olarak gönderilmez), bu yüzden CORS'u
    // etkilemez. NOT: buraya 'Cache-Control'/'Pragma' gibi ekstra İSTEK
    // BAŞLIKLARI eklenmemeli — GitHub'ın CORS izin listesinde olmadıkları
    // için tarayıcı isteği tamamen reddedip "ulaşılamadı" hatası verir.
    return fetch('https://api.github.com' + apiPath, {
      method: method,
      cache: 'no-store',
      headers: {
        'Accept': 'application/vnd.github+json',
        'X-GitHub-Api-Version': '2022-11-28',
        'Authorization': 'Bearer ' + cfg.token,
        'Content-Type': 'application/json'
      },
      body: gövde ? JSON.stringify(gövde) : undefined
    }).then(function (r) {
      return r.text().then(function (t) {
        var j = null; try { j = t ? JSON.parse(t) : null; } catch (e) { }
        if (!r.ok) throw ghHata(r.status, j && j.message);
        return j;
      });
    }).catch(function (e) {
      if (e instanceof TypeError) throw new Error('GitHub API’sine ulaşılamadı. İnternet bağlantınızı kontrol edin.');
      throw e;
    });
  }

  function ghDosyaYolu(path) { return 'data/' + path + '.json'; }

  function ghDocAl(path, gizliGH) {
    var cfg = gizliGH || GH;
    var p = ghDosyaYolu(path);
    return ghApi('GET', '/repos/' + cfg.owner + '/' + cfg.repo + '/contents/' + encYol(p) + '?ref=' + encodeURIComponent(cfg.branch), cfg)
      .then(function (j) {
        if (!j || j.type !== 'file') return null;
        return { sha: j.sha, veri: JSON.parse(b64Coz(j.content)) };
      })
      .catch(function (e) { if (e.status === 404) return null; throw e; });
  }

  function bekle(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }

  function ghDocYaz(path, veri, gizliGH) {
    var cfg = gizliGH || GH;
    var p = ghDosyaYolu(path);
    var gövdeMetin = JSON.stringify(veri);
    var GECIKMELER = [250, 600, 1200, 2200, 3500]; // her denemede biraz daha bekle (GitHub'ın okuma gecikmesine karşı)
    function dene(sha, deneme) {
      return ghApi('PUT', '/repos/' + cfg.owner + '/' + cfg.repo + '/contents/' + encYol(p), cfg, {
        message: 'KARMA OSGB: ' + path + ' güncellendi',
        content: b64Kodla(gövdeMetin),
        branch: cfg.branch,
        sha: sha || undefined
      }).catch(function (e) {
        if ((e.status === 409 || e.status === 422) && deneme < GECIKMELER.length) {
          return bekle(GECIKMELER[deneme]).then(function () {
            return ghDocAl(path, cfg).then(function (mevcut) { return dene(mevcut ? mevcut.sha : undefined, deneme + 1); });
          });
        }
        throw e;
      });
    }
    return ghDocAl(path, cfg).then(function (mevcut) { return dene(mevcut ? mevcut.sha : undefined, 0); });
  }

  function ghDocSil(path, gizliGH) {
    var cfg = gizliGH || GH;
    var p = ghDosyaYolu(path);
    return ghDocAl(path, cfg).then(function (mevcut) {
      if (!mevcut) return;
      return ghApi('DELETE', '/repos/' + cfg.owner + '/' + cfg.repo + '/contents/' + encYol(p), cfg,
        { message: 'KARMA OSGB: ' + path + ' silindi', sha: mevcut.sha, branch: cfg.branch });
    });
  }

  function ghListele(coll, gizliGH) {
    var cfg = gizliGH || GH;
    var p = 'data/' + coll;
    return ghApi('GET', '/repos/' + cfg.owner + '/' + cfg.repo + '/contents/' + encYol(p) + '?ref=' + encodeURIComponent(cfg.branch), cfg)

      .then(function (arr) {

  }

  }

  var Store = {
    mode: 'local', db: null,
    // mode: 'db' (Claude barındırmalı önizleme) | 'github' (kendi deponuz) | 'local' (yalnız bu tarayıcı) | 'setup_needed'
    init: function () {
      var self = this;
      if (window.claude && typeof window.claude.use === 'function') {
        var timeout = new Promise(function (res) { setTimeout(function () { res(null); }, 12000); });
        return Promise.race([window.claude.use('db'), timeout]).then(function (db) {
          if (db) { self.db = db; self.mode = 'db'; return; }
          self._yereldenYukle();
        }).catch(function () { self._yereldenYukle(); });
      }
      self._yereldenYukle();
      return Promise.resolve();
    },
    _yereldenYukle: function () {
      var raw = null;
      try { raw = localStorage.getItem(GH_LS); } catch (e) { }
      if (raw) {
        try { GH = JSON.parse(raw); this.mode = 'github'; return; } catch (e) { }
      }
      var yerelOk = null;
      try { yerelOk = localStorage.getItem(LOCAL_LS); } catch (e) { }
      this.mode = yerelOk ? 'local' : 'setup_needed';
    },
    _lkey: function (p) { return 'karma_osgb:' + p; },
    get: function (path) {
      if (this.mode === 'db') {
        return this.db.doc(path).get().then(function (s) {
          return s.exists ? JSON.parse(JSON.stringify(s.data())) : null;
        });
      }
      if (this.mode === 'github') {
        return ghDocAl(path).then(function (d) { return d ? d.veri : null; });
      }
      try { var v = localStorage.getItem(this._lkey(path)); return Promise.resolve(v ? JSON.parse(v) : null); }
      catch (e) { return Promise.resolve(null); }
    },
    set: function (path, data) {
      var temiz = JSON.parse(JSON.stringify(data));
      delete temiz._id;
      if (this.mode === 'db') return this.db.doc(path).set(temiz);
      if (this.mode === 'github') return ghDocYaz(path, temiz);
      try { localStorage.setItem(this._lkey(path), JSON.stringify(temiz)); } catch (e) { return Promise.reject(e); }
      return Promise.resolve();
    },
    del: function (path) {
      if (this.mode === 'db') return this.db.doc(path).delete();
      if (this.mode === 'github') return ghDocSil(path);
      try { localStorage.removeItem(this._lkey(path)); } catch (e) { }
      return Promise.resolve();
    },
    list: function (coll) {
      if (this.mode === 'db') {
        return this.db.collection(coll).get().then(function (q) {
          return q.docs.map(function (d) {
            var o = JSON.parse(JSON.stringify(d.data() || {}));
            o._id = d.id; return o;
          });
        });
      }
      if (this.mode === 'github') return ghListele(coll);
      var out = [], pre = this._lkey(coll + '/');
      try {
        for (var i = 0; i < localStorage.length; i++) {
          var k = localStorage.key(i);
          if (k && k.indexOf(pre) === 0) {
            var o = JSON.parse(localStorage.getItem(k)) || {};
            o._id = k.slice(pre.length); out.push(o);
          }
        }
      } catch (e) { }
      return Promise.resolve(out);
    }
  };

  function yeniPlan(firmaId, yil) {
    var f = {};
    KATALOG.forEach(function (g) {
      g.faaliyetler.forEach(function (a) {
        if (a.tip === 'periyodik') {
          f[a.id] = { periyot: a.on || 'yok', baslangicAy: 0, hafta: 1, secili: bos48(), tarih: '' };
        } else if (a.tip === 'mevzuat' || a.tip === 'secim') {
          f[a.id] = { gecerli: '', tarih: '', planTarih: '', secili: bos48() };
        } else if (a.tip === 'atama') {
          f[a.id] = { buYil: '', ay: 0, hafta: 1, disTarih: '', secili: bos48() };
        }
      });
    });
    Object.keys(f).forEach(function (k) { if (f[k].periyot) periyotUygula(f[k]); });

  function planTamamla(p) {
    if (!p.faaliyetler) p.faaliyetler = {};
    var t = yeniPlan(p.firmaId, p.yil);
    Object.keys(t.faaliyetler).forEach(function (k) {
      if (!p.faaliyetler[k]) p.faaliyetler[k] = t.faaliyetler[k];
      else Object.keys(t.faaliyetler[k]).forEach(function (alan) {
        if (p.faaliyetler[k][alan] === undefined) p.faaliyetler[k][alan] = t.faaliyetler[k][alan];
      });
      if (!p.faaliyetler[k].secili || p.faaliyetler[k].secili.length !== 48) p.faaliyetler[k].secili = bos48();
    });
    if (!p.kurulUyeleri) p.kurulUyeleri = t.kurulUyeleri;
    if (!p.formNo) p.formNo = t.formNo;
    return p;
  }

      for (var m = (+st.baslangicAy || 0); m < 12; m += step) sec[m * 4 + (h - 1)] = true;
    }
    st.secili = sec;
  }
  function tarihIsaretle(sec, iso) {
    if (!iso) return;
    var m = ayOf(iso), h = haftaOf(iso);
    if (m >= 0 && m < 12) sec[m * 4 + (h - 1)] = true;
  }

    var n = 0; for (var i = 0; i < 48; i++) if (sec[i]) n++;

            '<input type="file" accept="application/pdf" style="display:none" data-pdfyukle="' + p._id + '"></label> ' +
            '<button class="btn btn-ghost btn-sm" data-plan="' + p._id + '">Aç</button> ' +
            '<button class="btn btn-danger btn-sm" data-plansil="' + p._id + '">Sil</button></td></tr>';

      '<div class="card"><div class="card-h"><h2>Eğitim planları</h2></div>' +
      (egitimPlanlari.length ?
        '<div class="card-b tight"><table class="tbl"><thead><tr><th>Yıl</th><th class="opt">Eğitim sayısı</th><th class="opt">Son güncelleme</th><th></th></tr></thead><tbody>' +

            '<td class="opt">' + esc(trTarih((p.guncelleme || '').slice(0, 10))) + '</td>' +
            '<td class="cell-act"><button class="btn btn-ghost btn-sm" data-egitim="' + p._id + '">Aç</button> ' +
            '<button class="btn btn-danger btn-sm" data-egitimsil="' + p._id + '">Sil</button></td></tr>';
        }).join('') + '</tbody></table></div>'
        : '<div class="empty"><h3>Bu firma için eğitim planı yok</h3><p>Yıllık eğitim planını hangi yıl için hazırlayacağınızı seçerek başlayın.</p>' +
        '<button class="btn btn-ghost" id="egitimEkle2">Eğitim planı oluştur</button></div>') +

  function bindFirma() {
    var id = App.route.id;
    var f = App.firmalar.find(function (x) { return x._id === id; });
    var d = $('#duzenle'); if (d) d.addEventListener('click', function () { firmaModal(f); });
    ['#planEkle', '#planEkle2'].forEach(function (s) {
      var b = $(s); if (b) b.addEventListener('click', function () { yilSor(id); });
    });
    ['#egitimEkle', '#egitimEkle2'].forEach(function (s) {
      var b = $(s); if (b) b.addEventListener('click', function () { egitimYilSor(id); });
    });
    $$('[data-pdfyukle]').forEach(function (inp) {
      inp.addEventListener('change', function () {
        var dosya = inp.files[0]; if (!dosya) return;
        var planId = inp.getAttribute('data-pdfyukle');
        imzaliPlanYukle(planId, dosya, function () { render(); });
      });
    });
  }

  function yilSor(firmaId) {
    var y = new Date().getFullYear(), yillar = [y - 1, y, y + 1, y + 2];
    modal({
      baslik: 'Plan hangi yıl için hazırlanacak?',
      govde: '<div class="field"><label for="p_yil">Plan yılı</label><select id="p_yil">' +
        yillar.map(function (v) { return '<option value="' + v + '"' + (v === y ? ' selected' : '') + '>' + v + '</option>'; }).join('') +
        '</select><p class="hint">Plandaki 12 ay ve 4 haftalık sütunlar bu yıla göre düzenlenir.</p></div>' +
        '<div class="err-txt" id="p_err"></div>',
      onay: 'Planı oluştur',
      kaydet: function (kapat) {
        var yil = +$('#p_yil').value;
        if (App.planlar.some(function (p) { return p.firmaId === firmaId && +p.yil === yil; })) {
          $('#p_err').textContent = 'Bu firma için ' + yil + ' yılı planı zaten var.'; return;
        }
        var p = yeniPlan(firmaId, yil);
        var fm = App.firmalar.find(function (x) { return x._id === firmaId; }) || {};
        if (fm.calisan) { p.calisanSayisi = fm.calisan; p.altmis = (+fm.calisan < 50) ? 'evet' : 'hayir'; }
        p.kurulUyeleri[0].ad = fm.isveren || '';
        p.kurulUyeleri[1].ad = fm.uzman || '';
        p.kurulUyeleri[2].ad = fm.hekim || '';
        p.kurulUyeleri[3].ad = fm.ik || '';
        p.kurulUyeleri[4].ad = fm.temsilci || '';
        Store.set('planlar/' + p.id, p).then(function () {
          p._id = p.id; App.planlar.push(p); kapat();
          git({ ad: 'plan', id: p.id });
        }).catch(function (e) { $('#p_err').textContent = 'Oluşturulamadı: ' + (e && e.message || e); });
      }
    });
  }

  /* ==========================================================================
     EĞİTİM PLANI
     ========================================================================== */
  function yeniEgitimPlani(firmaId, yil) {
    return {
      id: uid('egt'), firmaId: firmaId, yil: yil,
      olusturma: new Date().toISOString(), guncelleme: new Date().toISOString(),
      formNo: 'İSG.PLN.EGT', revTarihi: trTarih(bugun()),
      egitimler: []
    };
  }
  function egitimPlaniTamamla(p) { if (!p.egitimler) p.egitimler = []; return p; }

  function egitimYilSor(firmaId) {
    var y = new Date().getFullYear(), yillar = [y - 1, y, y + 1, y + 2];
    modal({
      baslik: 'Eğitim planı hangi yıl için hazırlanacak?',
      govde: '<div class="field"><label for="e_yil">Plan yılı</label><select id="e_yil">' +
        yillar.map(function (v) { return '<option value="' + v + '"' + (v === y ? ' selected' : '') + '>' + v + '</option>'; }).join('') +
        '</select></div><div class="err-txt" id="e_err"></div>',
      onay: 'Planı oluştur',
      kaydet: function (kapat) {
        var yil = +$('#e_yil').value;
        if (App.egitimPlanlari.some(function (p) { return p.firmaId === firmaId && +p.yil === yil; })) {
          $('#e_err').textContent = 'Bu firma için ' + yil + ' yılı eğitim planı zaten var.'; return;
        }
        var p = yeniEgitimPlani(firmaId, yil);
        Store.set('egitimplani/' + p.id, p).then(function () {
          p._id = p.id; App.egitimPlanlari.push(p); kapat();
          git({ ad: 'egitim', id: p.id });
        }).catch(function (e) { $('#e_err').textContent = 'Oluşturulamadı: ' + (e && e.message || e); });
      }
    });
  }

  function viewEgitimler() {
    var izinliIdler = benimFirmalarim().map(function (f) { return f._id; });
    var list = App.egitimPlanlari.filter(function (p) { return izinliIdler.indexOf(p.firmaId) >= 0; })
      .slice().sort(function (a, b) { return (b.yil - a.yil) || 0; });
    var h = '<div class="phead"><div><h1>Eğitim planları</h1>' +
      '<p class="psub">' + (yonetimiMi() ? 'Tüm firmalar için hazırlanan yıllık eğitim planları.' : 'Size atanan firmalar için hazırlanan yıllık eğitim planları.') + '</p></div></div>';
    if (!list.length) {
      return h + '<div class="card"><div class="empty"><h3>Henüz eğitim planı yok</h3>' +
        '<p>Bir firma açıp o firma için yıllık eğitim planını oluşturun.</p>' +
        '<button class="btn btn-primary" data-goto="firmalar">Firmalara git</button></div></div>';
    }
    h += '<div class="card"><div class="card-b tight"><table class="tbl"><thead><tr>' +
      '<th>Yıl</th><th>İşyeri</th><th class="opt">Eğitim sayısı</th><th class="opt">Son güncelleme</th><th></th></tr></thead><tbody>' +
      list.map(function (p) {
        var f = App.firmalar.find(function (x) { return x._id === p.firmaId; }) || {};
        return '<tr><td><strong>' + esc(p.yil) + '</strong></td>' +
          '<td><button class="row-link" data-egitim="' + p._id + '" style="background:none;border:none;padding:0;text-align:left">' + esc(f.unvan || '(silinmiş firma)') + '</button></td>' +
          '<td class="opt">' + (p.egitimler || []).length + ' eğitim</td>' +
          '<td class="opt">' + esc(trTarih((p.guncelleme || '').slice(0, 10))) + '</td>' +
          '<td class="cell-act"><button class="btn btn-ghost btn-sm" data-egitim="' + p._id + '">Aç</button></td></tr>';
      }).join('') + '</tbody></table></div></div>';
    return h;
  }

  var egitimKaydetSirasi = Promise.resolve();
  function egitimKaydet(bildir) {
    var sonuc = egitimKaydetSirasi.then(function () { return egitimKaydetGercek(bildir); });
    egitimKaydetSirasi = sonuc.catch(function () { });
    return sonuc;
  }
  function egitimKaydetGercek(bildir) {
    var p = App.egitim;
    p.guncelleme = new Date().toISOString();
    var btnler = ['#eBtnKaydet', '#eBtnWord'].map(function (s) { return $(s); });
    btnler.forEach(function (b) { if (b) b.disabled = true; });
    var s = $('#eSbInfo'); if (s) { s.textContent = 'Kaydediliyor…'; s.style.color = ''; }
    return Store.set('egitimplani/' + p.id, p).then(function () {
      var i = App.egitimPlanlari.findIndex(function (x) { return x._id === p.id; });
      var kopya = JSON.parse(JSON.stringify(p)); kopya._id = p.id;
      if (i >= 0) App.egitimPlanlari[i] = kopya; else App.egitimPlanlari.push(kopya);
      App.kirli = false;
      if (s) { s.textContent = 'Kaydedildi · ' + new Date().toLocaleTimeString('tr-TR').slice(0, 5); s.style.color = ''; }
      if (bildir) toast('Eğitim planı kaydedildi', 'ok');
    }).catch(function (e) {
      toast('Kaydedilemedi (verileriniz ekranda duruyor, kaybolmadı): ' + (e && e.message || e), 'err', {
        etiket: 'Tekrar dene', tikla: function () { egitimKaydet(bildir); }
      });
      throw e;
    }).then(function (v) { btnler.forEach(function (b) { if (b) b.disabled = false; }); return v; },
      function (e) { btnler.forEach(function (b) { if (b) b.disabled = false; }); throw e; });
  }

  function egitimTarihMetni(satir) {
    if (satir.tarihTipi === 'tarih') return satir.tarihISO ? trTarih(satir.tarihISO) : '—';
    return AYLAR[satir.ay || 0] + ' ' + (satir.yilSec || '');
  }

  function renderEgitim() {
    var p = App.egitim;
    if (!p || p.id !== App.route.id) {
      p = App.egitimPlanlari.find(function (x) { return x._id === App.route.id; });
      if (!p) { git({ ad: 'egitimler' }); return; }
      if (!firmayaErisimVarMi(p.firmaId)) {
        App.egitim = null;
        renderKabuk('<div class="card"><div class="empty"><h3>Bu plana erişiminiz yok</h3>' +
          '<p>Bu işyerini görüntülemek için bir yönetici tarafından atanmanız gerekiyor.</p>' +
          '<button class="btn btn-primary" data-goto="egitimler">Eğitim planlarına dön</button></div></div>');
        return;
      }
      App.egitim = p = egitimPlaniTamamla(JSON.parse(JSON.stringify(p)));
      App.kirli = false;
    }
    App.egitimFirma = App.firmalar.find(function (x) { return x._id === p.firmaId; }) || {};
    var f = App.egitimFirma;

    var satirlar = p.egitimler.map(function (s, i) {
      return '<tr><td style="font-weight:600">' + esc(s.ad) + '</td>' +
        '<td class="opt" style="max-width:260px">' + esc(s.katilimci || '—') + '</td>' +
        '<td class="opt">' + esc(s.sureSaat ? s.sureSaat + ' saat' : '—') + '</td>' +
        '<td>' + esc(egitimTarihMetni(s)) + '</td>' +
        '<td class="cell-act"><button class="btn btn-ghost btn-sm" data-esduzenle="' + i + '">Düzenle</button> ' +
        '<button class="btn btn-danger btn-sm" data-essil="' + i + '">Sil</button></td></tr>';
    }).join('');

    var html = '<div class="crumb"><button data-goto="firmalar">Firmalar</button> › ' +
      '<button data-goto="firma" data-id="' + esc(p.firmaId) + '">' + esc(f.unvan || 'Firma') + '</button> › ' + esc(p.yil) + ' eğitim planı</div>' +
      '<div class="phead"><div><h1>' + esc(p.yil) + ' Yıllık Eğitim Planı</h1>' +
      '<p class="psub">' + esc(f.unvan || '') + '</p></div>' +
      '<div class="pact"><button class="btn btn-primary" id="esEkle">+ Eğitim ekle</button></div></div>' +

      '<div class="card"><div class="card-b tight">' +
      (satirlar
        ? '<table class="tbl"><thead><tr><th>Eğitim</th><th class="opt">Hedeflenen katılımcı</th><th class="opt">Süre</th><th>Planlanan tarih</th><th></th></tr></thead><tbody>' + satirlar + '</tbody></table>'
        : '<div class="empty"><h3>Henüz eğitim eklenmedi</h3><p>"+ Eğitim ekle" ile listeden bir modül seçerek başlayın.</p></div>') +
      '</div></div>' +

      '<div class="savebar"><span class="sb-info" id="eSbInfo">Tüm değişiklikler kaydedilmeye hazır</span>' +
      '<span class="sb-space"></span>' +
      '<button class="btn btn-dark" id="eBtnKaydet">Kaydet</button>' +
      '<button class="btn btn-primary" id="eBtnWord">Word planını indir</button></div>';

    renderKabuk(html);
    bindEgitim();
  }

  function bindEgitim() {
    var p = App.egitim;
    $('#esEkle').addEventListener('click', function () { egitimSatirModal(null); });
    $$('[data-esduzenle]').forEach(function (b) {
      b.addEventListener('click', function () { egitimSatirModal(+b.getAttribute('data-esduzenle')); });
    });
    $$('[data-essil]').forEach(function (b) {
      b.addEventListener('click', function () {
        if (!confirm('Bu eğitim kaldırılsın mı?')) return;
        p.egitimler.splice(+b.getAttribute('data-essil'), 1);
        kirlet(); renderEgitim();
      });
    });
    $('#eBtnKaydet').addEventListener('click', function () { egitimKaydet(true); });
    $('#eBtnWord').addEventListener('click', function () {
      egitimWordIndir();
      egitimKaydet(false).catch(function () { });
    });
  }

  function egitimTarihAlanHtml(tip, satir) {
    var simdikiYil = new Date().getFullYear();
    if (tip === 'tarih') {
      return '<div class="field"><label>Tarih</label>' + tarihGirisHtml('es_tarihISO', satir && satir.tarihTipi === 'tarih' ? satir.tarihISO : '') + '</div>';
    }
    var ay = (satir && satir.tarihTipi !== 'tarih' && satir.ay !== undefined) ? satir.ay : new Date().getMonth();
    var yil = (satir && satir.tarihTipi !== 'tarih' && satir.yilSec) ? satir.yilSec : simdikiYil;
    return '<div class="inline"><div class="field" style="max-width:170px"><label for="es_ay">Ay</label><select id="es_ay">' +
      AYLAR.map(function (a, i) { return '<option value="' + i + '"' + (i === ay ? ' selected' : '') + '>' + a + '</option>'; }).join('') +
      '</select></div><div class="field" style="max-width:130px"><label for="es_yilsec">Yıl</label><select id="es_yilsec">' +
      [simdikiYil - 1, simdikiYil, simdikiYil + 1, simdikiYil + 2].map(function (y) { return '<option value="' + y + '"' + (y === yil ? ' selected' : '') + '>' + y + '</option>'; }).join('') +
      '</select></div></div>';
  }

  function egitimSatirModal(duzenleIndex) {
    var p = App.egitim;
    var mevcut = (duzenleIndex !== null && duzenleIndex !== undefined) ? p.egitimler[duzenleIndex] : null;
    var baslangicTip = mevcut ? (mevcut.tarihTipi || 'ayyil') : 'ayyil';

    modal({
      baslik: (mevcut ? 'Eğitimi düzenle' : 'Eğitim ekle'),
      wide: true,
      govde:
        '<div class="field"><label for="es_katalog">Eğitim modülü</label><select id="es_katalog">' +
        '<option value="">— listeden seçin veya elle girin —</option>' +
        EGITIM_KATALOGU.map(function (k) { return '<option value="' + k.no + '">' + k.no + '. ' + esc(k.ad) + '</option>'; }).join('') +
        '</select><p class="hint">Bir modül seçtiğinizde aşağıdaki alanlar otomatik doldurulur; isterseniz düzenleyebilirsiniz.</p></div>' +
        '<div class="field"><label for="es_ad">Eğitimin adı</label><input id="es_ad" type="text" value="' + esc(mevcut ? mevcut.ad : '') + '"></div>' +
        '<div class="field"><label for="es_konu">Eğitimin konusu</label><textarea id="es_konu">' + esc(mevcut ? mevcut.konu : '') + '</textarea></div>' +
        '<div class="field"><label for="es_hedef">Eğitimin hedefi ve amacı</label><textarea id="es_hedef">' + esc(mevcut ? mevcut.hedef : '') + '</textarea></div>' +
        '<div class="field"><label for="es_katilimci">Hedeflenen katılımcı</label><input id="es_katilimci" type="text" value="' + esc(mevcut ? mevcut.katilimci : '') + '"></div>' +
        '<div class="grid2"><div class="field"><label for="es_sure">Eğitimin süresi (saat)</label><input id="es_sure" type="number" min="0" step="0.5" value="' + esc(mevcut ? mevcut.sureSaat : '') + '"></div>' +
        '<div class="field"><label class="lbl">Planlanan tarih</label>' +
        segHtml('es_tarihTip', [{ v: 'ayyil', l: 'Ay / Yıl' }, { v: 'tarih', l: 'Kesin tarih' }], baslangicTip, true) + '</div></div>' +
        '<div id="es_tarihAlan">' + egitimTarihAlanHtml(baslangicTip, mevcut) + '</div>' +
        '<div class="err-txt" id="es_err"></div>',
      onay: (mevcut ? 'Kaydet' : 'Ekle'),
      kaydet: function (kapat) {
        var ad = $('#es_ad').value.trim();
        if (!ad) { $('#es_err').textContent = 'Eğitim adı gerekli.'; return; }
        var tip = App._esTarihTip || baslangicTip;
        var satir = {
          id: mevcut ? mevcut.id : uid('egt'),
          ad: ad, konu: $('#es_konu').value.trim(), hedef: $('#es_hedef').value.trim(),
          katilimci: $('#es_katilimci').value.trim(), sureSaat: $('#es_sure').value.trim(),
          tarihTipi: tip
        };
        if (tip === 'tarih') {
          var tIn = $('[data-inp="es_tarihISO"]'); var iso = tIn ? tIn.value : '';
          if (!iso) { $('#es_err').textContent = 'Lütfen tarihi (gün/ay/yıl) seçin.'; return; }
          satir.tarihISO = iso;
        } else {
          satir.ay = +$('#es_ay').value; satir.yilSec = +$('#es_yilsec').value;
        }
        if (duzenleIndex !== null && duzenleIndex !== undefined) p.egitimler[duzenleIndex] = satir;
        else p.egitimler.push(satir);
        kapat(); kirlet(); renderEgitim();
      }
    });

    App._esTarihTip = baslangicTip;
    if (baslangicTip === 'tarih') tarih3Bagla($('[data-hedef="es_tarihISO"]'));

    $('#es_katalog').addEventListener('change', function () {
      var no = +this.value; if (!no) return;
      var k = EGITIM_KATALOGU.find(function (x) { return x.no === no; });
      if (!k) return;
      $('#es_ad').value = k.ad; $('#es_konu').value = k.konu;
      $('#es_hedef').value = k.hedef; $('#es_katilimci').value = k.katilimci;
    });

    var seg = $('[data-seg="es_tarihTip"]');
    seg.addEventListener('click', function (e) {
      var b = e.target.closest('button[data-v]'); if (!b) return;
      App._esTarihTip = b.getAttribute('data-v');
      $('#es_tarihAlan').innerHTML = egitimTarihAlanHtml(App._esTarihTip, mevcut);
      if (App._esTarihTip === 'tarih') tarih3Bagla($('[data-hedef="es_tarihISO"]'));
    });
  }

  function egitimWordIndir() {
    var p = App.egitim, f = App.egitimFirma;
    if (!p.egitimler.length) { toast('Önce en az bir eğitim ekleyin', 'err'); return; }
    var satirlar = p.egitimler.map(function (s) {
      return { ad: s.ad, konu: s.konu, hedef: s.hedef, katilimci: s.katilimci, sure: s.sureSaat ? (s.sureSaat + ' saat') : '', tarihMetni: egitimTarihMetni(s) };
    });
    var bytes = window.KarmaGen.buildEgitimPlaniDocx({
      yil: p.yil, firmaUnvan: f.unvan, formNo: p.formNo, revTarihi: p.revTarihi, satirlar: satirlar
    });
    dosyaVer(p.yil + '_' + slug(f.unvan) + '_Egitim_Plani.docx', bytes);
  }

  /* ==========================================================================
     EĞİTİM KAYITLARI (Katılım Tutanağı + Temel Eğitim Belgesi)
     ========================================================================== */
  function ozguVarsayilan(tikli) {
    return TEMEL_KONULAR.ozgu.map(function (ad) { return { ad: ad, dk: '', tikli: tikli, ozel: false }; });
  }
  function oturumKonulariHazirla() {
    function kopya(liste) { return liste.map(function (k) { return { ad: k.ad, dk: k.dk, tikli: true }; }); }
    return {
      genel: kopya(TEMEL_KONULAR.genel), saglik: kopya(TEMEL_KONULAR.saglik), teknik: kopya(TEMEL_KONULAR.teknik),
      ozguA: ozguVarsayilan(true), ozguB: ozguVarsayilan(false)
    };
  }

  function yeniOturum() {
    return {
      id: uid('otr'), olusturma: new Date().toISOString(), guncelleme: new Date().toISOString(),
      olusturan: App.kullanici.kullanici,
      firmaId: '', digerFirmaAdi: '', firmaKisaAd: '', digerTehlike: 'Az Tehlikeli',
      uzmanAdi: '', uzmanUnvan: '', hekimAdi: '', hekimUnvan: '',
      egitimTuru: 'temel', digerEgitimAdi: '',
      tarih1: '', tarih2: '', ikinciTarih: false,
      egitimSuresi: '', egitimYeri: '',
      turu: 'ilk', sekli: 'yuzyuze',
      belgeTarihi: '', belgeElle: false,
      konular: oturumKonulariHazirla(), ozguGrup: 'A',
      katilimcilar: [{ adSoyad: '', gorev: '' }]
    };
  }

  function oturumTamamla(o) {
    var t = yeniOturum();
    Object.keys(t).forEach(function (k) { if (o[k] === undefined) o[k] = t[k]; });
    // eski kayıt biçimi (tek "ozgu" listesi) -> A/B ayrı listeler
    if (o.konular && o.konular.ozgu && !o.konular.ozguA) {
      var azMi = oturumTehlike(o) === 'Az Tehlikeli';
      o.konular.ozguA = azMi ? ozguVarsayilan(false) : o.konular.ozgu;
      o.konular.ozguB = azMi ? o.konular.ozgu : ozguVarsayilan(false);
      o.ozguGrup = azMi ? 'B' : 'A';
      delete o.konular.ozgu;
    }
    if (o.konular && !o.konular.ozguA) o.konular.ozguA = ozguVarsayilan(true);
    if (o.konular && !o.konular.ozguB) o.konular.ozguB = ozguVarsayilan(false);
    return o;
  }

  /* firma sınıfına göre hangi liste varsayılan olarak tikli olsun (A: tehlikeli/çok tehlikeli, B: az tehlikeli) */
  function oturumGrup(o) { return oturumTehlike(o) === 'Az Tehlikeli' ? 'B' : 'A'; }
  function oturumGrupGuncelle(o) {
    var g = oturumGrup(o);
    if (o.ozguGrup === g) return;
    o.ozguGrup = g;
    o.konular.ozguA.forEach(function (k) { if (!k.ozel) k.tikli = (g === 'A'); });
    o.konular.ozguB.forEach(function (k) { if (!k.ozel) k.tikli = (g === 'B'); });
  }

  function oturumFirmalari() {
    return benimFirmalarim().filter(function (f) { return f.uzmanKullanici || f.hekimKullanici; })
      .slice().sort(function (a, b) { return (a.unvan || '').localeCompare(b.unvan || '', 'tr'); });
  }
  function oturumFirma(o) { return App.firmalar.find(function (f) { return f._id === o.firmaId; }) || null; }
  function oturumDiger(o) { return o.firmaId === '__diger__'; }
  function oturumTehlike(o) {
    if (oturumDiger(o)) return o.digerTehlike || 'Az Tehlikeli';
    var f = oturumFirma(o); return (f && f.tehlike) || 'Az Tehlikeli';
  }
  function oturumFirmaUnvan(o) { if (oturumDiger(o)) return o.digerFirmaAdi || ''; var f = oturumFirma(o); return f ? f.unvan : ''; }
  function oturumFirmaKisa(o) { return (o.firmaKisaAd && o.firmaKisaAd.trim()) || oturumFirmaUnvan(o); }
  function oturumSonTarih(o) { return (o.ikinciTarih && o.tarih2) ? o.tarih2 : o.tarih1; }

  function uzunTarih(iso) {
    var p = String(iso).split('-'); return (+p[2]) + ' ' + AY_ADLARI[(+p[1]) - 1] + ' ' + p[0];
  }
  function oturumTarihMetni(o) {
    if (!o.tarih1) return '';
    if (o.ikinciTarih && o.tarih2) return trTarih(o.tarih1) + ' ve ' + trTarih(o.tarih2);
    return trTarih(o.tarih1);
  }
  function oturumTarihCumlesi(o) {
    if (!o.tarih1) return 'XX/XX/XXXX tarihinde';
    if (o.ikinciTarih && o.tarih2) return uzunTarih(o.tarih1) + ' ve ' + uzunTarih(o.tarih2) + ' tarihlerinde';
    return uzunTarih(o.tarih1) + ' tarihinde';
  }
  function oturumBelgeTarihiGuncelle(o) { if (!o.belgeElle) o.belgeTarihi = oturumSonTarih(o) || ''; }

  function oturumOzguToplam(o) {
    function top(l) { return l.reduce(function (t, k) { return t + (k.tikli ? (+k.dk || 0) : 0); }, 0); }
    return top(o.konular.ozguA) + top(o.konular.ozguB);
  }

  function oturumFirmaSecildi(o) {
    if (oturumDiger(o) || !o.firmaId) return;
    var f = oturumFirma(o); if (!f) return;
    var uzUye = App.kullanicilar.find(function (u) { return u.kullanici === f.uzmanKullanici; });
    var hekUye = App.kullanicilar.find(function (u) { return u.kullanici === f.hekimKullanici; });
    o.uzmanAdi = f.uzman || (uzUye ? uzUye.adSoyad : '');
    o.uzmanUnvan = (uzUye && uzUye.unvan && uzUye.unvan !== 'İşyeri Hekimi') ? uzUye.unvan : '';
    o.hekimAdi = f.hekim || (hekUye ? hekUye.adSoyad : '');
    o.hekimUnvan = 'İşyeri Hekimi';
  }

  /* ---- liste ---- */
  function oturumGorunur(o) { return yonetimiMi() || o.olusturan === App.kullanici.kullanici; }

  function viewOturumlar() {
    var liste = App.oturumlar.filter(oturumGorunur).slice().sort(function (a, b) { return (b.olusturma || '').localeCompare(a.olusturma || ''); });
    var h = '<div class="phead"><div><h1>Eğitim kayıtları</h1>' +
      '<p class="psub">Verilen eğitimler için Eğitim Katılım Tutanağı ve Temel Eğitim Belgesi hazırlayın.</p></div>' +
      '<div class="pact"><button class="btn btn-primary" id="oturumYeni">+ Yeni eğitim kaydı</button></div></div>';
    if (!liste.length) {
      return h + '<div class="card"><div class="empty"><h3>Henüz eğitim kaydı yok</h3><p>"Yeni eğitim kaydı" ile ilk kaydı oluşturun.</p></div></div>';
    }
    h += '<div class="card"><div class="card-b tight"><table class="tbl"><thead><tr><th>Firma</th><th class="opt">Eğitim</th><th>Tarih</th><th class="opt">Katılımcı</th><th></th></tr></thead><tbody>' +
      liste.map(function (o) {
        var ad = o.egitimTuru === 'diger' ? (o.digerEgitimAdi || 'Diğer eğitim') : 'Temel İSG Eğitimi';
        return '<tr><td><button class="row-link" data-oturum="' + o.id + '" style="background:none;border:none;padding:0;text-align:left">' + esc(oturumFirmaUnvan(o) || '(firma seçilmedi)') + '</button></td>' +
          '<td class="opt">' + esc(ad) + '</td><td>' + esc(oturumTarihMetni(o) || '—') + '</td>' +
          '<td class="opt">' + o.katilimcilar.filter(function (k) { return k.adSoyad; }).length + ' kişi</td>' +
          '<td class="cell-act"><button class="btn btn-ghost btn-sm" data-oturum="' + o.id + '">Aç</button> ' +
          '<button class="btn btn-danger btn-sm" data-oturumsil="' + o.id + '">Sil</button></td></tr>';
      }).join('') + '</tbody></table></div></div>';
    return h;
  }

  /* ---- kaydetme ---- */
  var oturumKaydetSirasi = Promise.resolve();
  function oturumKaydet(bildir) {
    var sonuc = oturumKaydetSirasi.then(function () { return oturumKaydetGercek(bildir); });
    oturumKaydetSirasi = sonuc.catch(function () { });
    return sonuc;
  }
  function oturumKaydetGercek(bildir) {
    var o = App.oturum;
    o.guncelleme = new Date().toISOString();
    var s = $('#oSbInfo'); if (s) { s.textContent = 'Kaydediliyor…'; s.style.color = ''; }
    return Store.set('egitimoturum/' + o.id, o).then(function () {
      var i = App.oturumlar.findIndex(function (x) { return x._id === o.id; });
      var k = JSON.parse(JSON.stringify(o)); k._id = o.id;
      if (i >= 0) App.oturumlar[i] = k; else App.oturumlar.push(k);
      App.kirli = false;
      if (s) { s.textContent = 'Kaydedildi · ' + new Date().toLocaleTimeString('tr-TR').slice(0, 5); s.style.color = ''; }
      if (bildir) toast('Eğitim kaydı kaydedildi', 'ok');
    }).catch(function (e) {
      toast('Kaydedilemedi (verileriniz ekranda duruyor): ' + (e && e.message || e), 'err', { etiket: 'Tekrar dene', tikla: function () { oturumKaydet(bildir); } });
      throw e;
    });
  }

  /* ---- editör ---- */
  function renderOturum() {
    var o = App.oturum;
    if (!o || o.id !== App.route.id) {
      var bulunan = App.oturumlar.find(function (x) { return x._id === App.route.id; });
      if (!bulunan) { git({ ad: 'oturumlar' }); return; }
      App.oturum = o = oturumTamamla(JSON.parse(JSON.stringify(bulunan)));
      App.kirli = false;
    }
    var y = window.scrollY;
    renderKabuk(viewOturum());
    bindOturum();
    window.scrollTo(0, y);
  }

  function oturumSeg(ad, secenekler, deger) {
    return segHtml('o:' + ad, secenekler, deger, true);
  }

  function oturumKonuBolumu(anahtar, baslik) {
    var o = App.oturum;
    return '<div class="ck-bolum"><div class="ck-baslik">' + baslik + '</div>' +
      o.konular[anahtar].map(function (k, i) {
        return '<div class="ck-satir"><label class="ck"><input type="checkbox" data-ck="' + anahtar + ':' + i + '"' + (k.tikli ? ' checked' : '') + '><span>' + esc(k.ad) + '</span></label>' +

      }).join('') + '</div>';

  function oturumOzguListesi(anahtar, baslik, uygun) {
    var o = App.oturum;
    return '<div class="ck-bolum"><div class="ck-baslik">' + baslik +
      (uygun ? ' <span class="tag tag-ok" style="margin-left:6px">firma sınıfına uygun</span>' : '') + '</div>' +
      o.konular[anahtar].map(function (k, i) {
        var kimlik = anahtar + ':' + i;

          (k.ozel ? '<input type="text" class="ck-ad" data-ozguad="' + kimlik + '" value="' + esc(k.ad) + '" placeholder="Konu adı">' : '<span>' + esc(k.ad) + '</span>') + '</label>' +
          '<span class="ck-dk"><input type="number" min="0" data-dk="' + kimlik + '" value="' + esc(k.dk) + '"> dk' +
          (k.ozel ? ' <button type="button" class="btn btn-quiet btn-sm" data-ozgusil="' + kimlik + '" aria-label="Sil">✕</button>' : '') + '</span></div>';
      }).join('') +
      '<div style="margin:8px 0 14px"><button type="button" class="btn btn-ghost btn-sm" data-ozguekle="' + anahtar + '">+ Başka eğitim konusu ekle</button></div></div>';
  }

  function oturumOzguBolumu() {
    var o = App.oturum, g = oturumGrup(o);
    return '<div class="ck-baslik" style="font-size:12.5px;margin-bottom:10px">4. İŞE VE İŞYERİNE ÖZGÜ RİSKLER VE RİSK DEĞERLENDİRMESİNE DAYALI KONULAR</div>' +
      oturumOzguListesi('ozguA', 'A) (TEHLİKELİ VEYA ÇOK TEHLİKELİ SINIF)', g === 'A') +
      oturumOzguListesi('ozguB', 'B) FAALİYETİN GENEL TEHLİKE VE RİSKLERİ (AZ TEHLİKELİ SINIF)', g === 'B') +
      '<div class="ck-toplam" id="ozguToplam"></div>';
  }

  function viewOturum() {
    var o = App.oturum, firmalar = oturumFirmalari();
    var diger = oturumDiger(o), th = oturumTehlike(o), temel = o.egitimTuru === 'temel';

    var firmaOpts = '<option value="">— firma seçin —</option>' +
      firmalar.map(function (f) { return '<option value="' + esc(f._id) + '"' + (o.firmaId === f._id ? ' selected' : '') + '>' + esc(f.unvan) + '</option>'; }).join('') +
      '<option value="__diger__"' + (diger ? ' selected' : '') + '>Diğer Firma (elle gir)</option>';

    var h = '<div class="crumb"><button data-goto="oturumlar">Eğitim kayıtları</button> › ' + esc(oturumFirmaUnvan(o) || 'Yeni kayıt') + '</div>' +
      '<div class="phead"><div><h1>Eğitim kaydı</h1><p class="psub">Bilgileri girin; ardından tutanağı ve belgeyi Word olarak kaydedin.</p></div></div>';

    // 1) Firma
    h += '<div class="card"><div class="card-h"><h2>1. Firma</h2></div><div class="card-b">' +
      '<div class="field"><label for="o_firma">Eğitim verilen firma</label><select id="o_firma">' + firmaOpts + '</select>' +
      '<p class="hint">Yalnızca İş Güvenliği Uzmanı veya İşyeri Hekimi görevlendirmesi yapılmış firmalar listelenir.</p></div>';
    if (diger) {
      h += '<div class="grid2"><div class="field"><label for="o_digerAd">Firma adı</label><input id="o_digerAd" data-o="digerFirmaAdi" type="text" value="' + esc(o.digerFirmaAdi) + '"></div>' +
        '<div class="field"><label class="lbl">Tehlike sınıfı</label>' + oturumSeg('digerTehlike', [{ v: 'Az Tehlikeli', l: 'Az tehlikeli' }, { v: 'Tehlikeli', l: 'Tehlikeli' }, { v: 'Çok Tehlikeli', l: 'Çok tehlikeli' }], o.digerTehlike) + '</div></div>';
    } else if (o.firmaId) {
      h += '<div class="grid2"><div class="field"><label for="o_kisa">Firma adı kısaltması</label><input id="o_kisa" data-o="firmaKisaAd" type="text" value="' + esc(o.firmaKisaAd) + '">' +
        '<p class="hint">(Eğitim Katılım Tutanağı’nda kısa isim yazılacaksa)</p></div>' +
        '<div class="field"><label class="lbl">Tehlike sınıfı</label><div><span class="tag ' + (th === 'Çok Tehlikeli' ? 'tag-red' : th === 'Tehlikeli' ? 'tag-warn' : 'tag-ok') + '">' + esc(th) + '</span> <span class="hint">firma kaydından otomatik</span></div></div></div>';
    }
    h += '</div></div>';

    // 2) Eğitmenler
    h += '<div class="card"><div class="card-h"><h2>2. Eğitmenler</h2><span class="ch-sub">Otomatik gelir; değiştirebilir veya boş bırakabilirsiniz</span></div><div class="card-b"><div class="grid2">' +
      '<div class="field"><label for="o_uzAd">İş güvenliği uzmanı — adı soyadı</label><input id="o_uzAd" data-o="uzmanAdi" type="text" value="' + esc(o.uzmanAdi) + '"></div>' +
      '<div class="field"><label for="o_uzUn">Unvanı</label><input id="o_uzUn" data-o="uzmanUnvan" type="text" placeholder="ör. A Sınıfı İş Güvenliği Uzmanı" value="' + esc(o.uzmanUnvan) + '"></div>' +
      '<div class="field"><label for="o_hkAd">İşyeri hekimi — adı soyadı</label><input id="o_hkAd" data-o="hekimAdi" type="text" value="' + esc(o.hekimAdi) + '"></div>' +
      '<div class="field"><label for="o_hkUn">Unvanı</label><input id="o_hkUn" data-o="hekimUnvan" type="text" value="' + esc(o.hekimUnvan) + '"></div>' +
      '</div></div></div>';

    // 3) Eğitim bilgileri
    h += '<div class="card"><div class="card-h"><h2>3. Eğitim bilgileri</h2></div><div class="card-b">' +
      '<div class="q"><div class="qt">Eğitim adı</div>' + oturumSeg('egitimTuru', [{ v: 'temel', l: 'Temel İş Sağlığı ve Güvenliği Eğitimi' }, { v: 'diger', l: 'Diğer eğitim' }], o.egitimTuru) + '</div>';
    if (!temel) h += '<div class="field" style="max-width:420px"><label for="o_digerEg">Eğitimin adı</label><input id="o_digerEg" data-o="digerEgitimAdi" type="text" value="' + esc(o.digerEgitimAdi) + '"></div>';
    h += '<div class="q"><div class="qt">Eğitim tarihi</div><div class="inline">' +
      '<div class="field"><label>1. gün</label>' + tarihGirisHtml('o_tarih1', o.tarih1) + '</div>' +
      (o.ikinciTarih ? '<div class="field"><label>2. gün</label>' + tarihGirisHtml('o_tarih2', o.tarih2) + '</div>' : '') +
      '<div class="field"><button type="button" class="btn btn-ghost btn-sm" id="oIkinci">' + (o.ikinciTarih ? '2. tarihi kaldır' : '+ 2. tarih ekle') + '</button></div></div>' +
      '<p class="hint">8 saatten fazla olan eğitimler için 2. eğitim tarihini de giriniz.</p></div>' +

      '<div class="q"><div class="qt">Eğitimin şekli</div>' + oturumSeg('sekli', [{ v: 'yuzyuze', l: 'Yüz yüze' }, { v: 'uzaktan', l: 'Uzaktan' }], o.sekli) + '</div></div>';
    if (temel) {
      h += '<div class="field" style="margin-top:6px"><label>Belge düzenleme tarihi</label>' + tarihGirisHtml('o_belge', o.belgeTarihi) +

      o.katilimcilar.map(function (k, i) {
        return '<div class="memberrow"><span class="hint" style="min-width:26px">' + (i + 1) + '.</span>' +
          '<input type="text" data-k="' + i + ':adSoyad" value="' + esc(k.adSoyad) + '" placeholder="Adı soyadı" style="flex:0 0 40%">' +
          '<input type="text" data-k="' + i + ':gorev" value="' + esc(k.gorev) + '" placeholder="Görevi">' +

          '<button class="btn btn-quiet" data-ksil="' + i + '" aria-label="Sil">✕</button></div>';

      (temel ? '<p class="hint" style="margin-top:8px">“Eğitim Belgesi Bas”: her katılımcı için ayrı, 2 sayfalık (belge + eğitim konuları) Word dosyası hazırlanır; birden çok kişi varsa dosyalar tek bir ZIP içinde iner. Satırdaki “Belge” düğmesi yalnızca o kişi içindir.</p>' : '') + '</div></div>';

  function oturumToplamGuncelle() {
    var el = $('#ozguToplam'); if (!el) return;
    var o = App.oturum, th = oturumTehlike(o), hedef = OZGU_HEDEF_DK[th], top = oturumOzguToplam(o);
    var tamam = top === hedef;
    el.className = 'ck-toplam ' + (tamam ? 'ok' : 'uyari');
    el.textContent = '4. bölüm toplamı (A + B): ' + top + ' dk / Hedef: ' + hedef + ' dk (' + th + ')' + (tamam ? ' ✓' : (top < hedef ? ' — ' + (hedef - top) + ' dk eksik' : ' — ' + (top - hedef) + ' dk fazla'));
  }

  function bindOturum() {
    var o = App.oturum, kok = $('#wrap');
    function yeniden() { renderOturum(); }

    $('#o_firma').addEventListener('change', function () {
      o.firmaId = this.value; o.firmaKisaAd = '';
      if (o.firmaId && o.firmaId !== '__diger__') oturumFirmaSecildi(o);
      oturumGrupGuncelle(o);
      kirlet(); yeniden();
    });

    $$('[data-o]', kok).forEach(function (el) {
      el.addEventListener('input', function () { o[el.getAttribute('data-o')] = el.value; kirlet(); });
    });

    $$('[data-seg^="o:"]', kok).forEach(function (seg) {
      seg.addEventListener('click', function (e) {
        var b = e.target.closest('button[data-v]'); if (!b) return;
        var alan = seg.getAttribute('data-seg').slice(2); o[alan] = b.getAttribute('data-v');
        if (alan === 'digerTehlike') oturumGrupGuncelle(o);
        kirlet(); yeniden();
      });

    // tarihler
    $$('.tarih3', kok).forEach(tarih3Bagla);
    [['o_tarih1', 'tarih1'], ['o_tarih2', 'tarih2'], ['o_belge', 'belgeTarihi']].forEach(function (c) {
      var el = $('[data-inp="' + c[0] + '"]', kok); if (!el) return;
      el.addEventListener('change', function () {
        o[c[1]] = el.value;
        if (c[1] === 'belgeTarihi') o.belgeElle = true; else oturumBelgeTarihiGuncelle(o);
        kirlet(); yeniden();
      });
    });
    $('#oIkinci').addEventListener('click', function () {
      o.ikinciTarih = !o.ikinciTarih; if (!o.ikinciTarih) o.tarih2 = '';
      oturumBelgeTarihiGuncelle(o); kirlet(); yeniden();
    });

    // konular
    $$('[data-ck]', kok).forEach(function (el) {
      el.addEventListener('change', function () {
        var p = el.getAttribute('data-ck').split(':'); o.konular[p[0]][+p[1]].tikli = el.checked; kirlet(); oturumToplamGuncelle();
      });
    });
    $$('[data-dk]', kok).forEach(function (el) {
      el.addEventListener('input', function () {
        var p = el.getAttribute('data-dk').split(':'); o.konular[p[0]][+p[1]].dk = el.value === '' ? '' : +el.value; kirlet(); oturumToplamGuncelle();
      });
    });
    $$('[data-ozguad]', kok).forEach(function (el) {
      el.addEventListener('input', function () { var p = el.getAttribute('data-ozguad').split(':'); o.konular[p[0]][+p[1]].ad = el.value; kirlet(); });
    });
    $$('[data-ozgusil]', kok).forEach(function (el) {
      el.addEventListener('click', function () { var p = el.getAttribute('data-ozgusil').split(':'); o.konular[p[0]].splice(+p[1], 1); kirlet(); yeniden(); });
    });
    $$('[data-ozguekle]', kok).forEach(function (el) {
      el.addEventListener('click', function () { o.konular[el.getAttribute('data-ozguekle')].push({ ad: '', dk: '', tikli: true, ozel: true }); kirlet(); yeniden(); });
    });
    oturumToplamGuncelle();

    // katılımcılar
    $$('[data-k]', kok).forEach(function (el) {
      el.addEventListener('input', function () {
        var p = el.getAttribute('data-k').split(':'); o.katilimcilar[+p[0]][p[1]] = el.value; kirlet();
      });
    });
    $$('[data-ksil]', kok).forEach(function (el) {
      el.addEventListener('click', function () {
        o.katilimcilar.splice(+el.getAttribute('data-ksil'), 1);
        if (!o.katilimcilar.length) o.katilimcilar.push({ adSoyad: '', gorev: '' });
        kirlet(); yeniden();
      });

      el.addEventListener('click', function () { oturumBelgeIndir(+el.getAttribute('data-kbelge')); });
