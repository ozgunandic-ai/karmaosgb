<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>KARMA OSGB Doküman Yönetimi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* KARMA OSGB — Doküman Yönetimi */
:root{
  --red:#BD1F2E; --red-d:#8E1421; --red-l:#F7DDE0;
  --ink:#16181D; --ink-2:#262A32; --ink-3:#3A3F4A;
  --paper:#FFFFFF; --surface:#F4F5F7; --surface-2:#EAECF0;
  --line:#DBDFE6; --line-s:#EDEFF3;
  --muted:#6B7280; --muted-2:#8A909B;
  --ok:#1C7A46; --ok-bg:#E6F4EC;
  --warn:#9A5B00; --warn-bg:#FCF2E2;
  --radius:7px;
  --shadow:0 12px 34px rgba(16,18,24,.16);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
html,body{height:100%}
body{
  margin:0;background:var(--surface);color:var(--ink);
  font-family:'Archivo','Segoe UI',system-ui,-apple-system,sans-serif;
  font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--red);text-decoration:none}
h1,h2,h3,h4{margin:0;font-weight:600;letter-spacing:-.011em}
:focus-visible{outline:2px solid var(--red);outline-offset:2px;border-radius:3px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- giriş ---------- */
.gate{min-height:100%;display:flex;align-items:center;justify-content:center;padding:32px 18px;
  background:
    radial-gradient(1100px 520px at 50% -15%, #23262E 0%, #16181D 62%, #101216 100%);}
.gate-card{width:100%;max-width:392px;background:var(--paper);border-radius:10px;padding:30px 30px 26px;
  box-shadow:0 26px 70px rgba(0,0,0,.42)}
.gate-logo{display:block;width:170px;margin:0 auto 20px}
.gate h1{font-size:17px;text-align:center;margin-bottom:4px}
.gate .sub{text-align:center;color:var(--muted);font-size:12.5px;margin-bottom:22px}
.gate .field{margin-bottom:13px}
.gate .foot{margin-top:18px;text-align:center;font-size:11.5px;color:var(--muted-2);line-height:1.6}

/* ---------- form öğeleri ---------- */
.field{display:block}
.field>label,.lbl{display:block;font-size:12px;font-weight:600;color:var(--ink-3);margin-bottom:5px}
.hint{font-size:12px;color:var(--muted);margin-top:5px;line-height:1.5}
input[type=text],input[type=password],input[type=number],input[type=date],select,textarea{
  width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:var(--radius);
  background:var(--paper);transition:border-color .12s,box-shadow .12s}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--ink-3);box-shadow:0 0 0 3px rgba(22,24,29,.07)}
input:disabled,select:disabled{background:var(--surface-2);color:var(--muted);cursor:not-allowed}
select{appearance:none;background-image:url("data:image/svg+xml;charset=utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='11' height='7' viewBox='0 0 11 7'%3E%3Cpath d='M1 1l4.5 4.5L10 1' fill='none' stroke='%236B7280' stroke-width='1.6'/%3E%3C/svg%3E");
  background-repeat:no-repeat;background-position:right 11px center;padding-right:30px}
textarea{resize:vertical;min-height:70px}

.btn{display:inline-flex;align-items:center;gap:7px;padding:9px 15px;border-radius:var(--radius);
  border:1px solid transparent;font-weight:600;font-size:13px;white-space:nowrap;transition:background .12s,border-color .12s}
.btn-primary{background:var(--red);color:#fff}
.btn-primary:hover{background:var(--red-d)}
.btn-dark{background:var(--ink);color:#fff}
.btn-dark:hover{background:var(--ink-2)}
.btn-ghost{background:var(--paper);border-color:var(--line);color:var(--ink)}
.btn-ghost:hover{border-color:var(--ink-3);background:var(--surface)}
.btn-quiet{background:transparent;color:var(--muted);padding:6px 9px}
.btn-quiet:hover{color:var(--ink);background:var(--surface-2)}
.btn-danger{background:transparent;border-color:var(--line);color:var(--red)}
.btn-danger:hover{background:var(--red-l);border-color:var(--red)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn-sm{padding:6px 11px;font-size:12.5px}
.btn-block{width:100%;justify-content:center;padding:11px}

/* segment seçici */
.seg{display:inline-flex;flex-wrap:wrap;gap:6px}
.seg button{padding:7px 13px;border:1px solid var(--line);background:var(--paper);border-radius:99px;
  font-size:12.5px;font-weight:500;color:var(--ink-3);transition:all .12s}
.seg button:hover{border-color:var(--ink-3)}
.seg button[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:#fff}
.seg.seg-red button[aria-pressed=true]{background:var(--red);border-color:var(--red)}

/* ---------- uygulama kabuğu ---------- */
.shell{display:flex;flex-direction:column;min-height:100%}
.topbar{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:14px;
  background:var(--ink);color:#fff;padding:0 18px;padding-top:env(safe-area-inset-top,0px);height:calc(54px + env(safe-area-inset-top,0px))}
.topbar img{height:26px;display:block}
.topbar .tsep{width:1px;height:20px;background:rgba(255,255,255,.22)}
.topbar .tname{font-size:13.5px;font-weight:600;letter-spacing:.01em;white-space:nowrap}
.topbar .tspace{flex:1}
.topbar .tuser{display:flex;align-items:center;gap:9px;font-size:12.5px;color:rgba(255,255,255,.82)}
.avatar{width:27px;height:27px;border-radius:50%;background:var(--red);color:#fff;display:grid;place-items:center;
  font-size:11.5px;font-weight:700}
.topbar .btn-quiet{color:rgba(255,255,255,.72)}
.topbar .btn-quiet:hover{color:#fff;background:rgba(255,255,255,.1)}
.burger{display:none}

.body{display:flex;flex:1;min-height:0}
.nav{width:212px;flex:0 0 212px;background:var(--paper);border-right:1px solid var(--line);padding:14px 10px}
.nav-group{font-size:10.5px;font-weight:700;letter-spacing:.09em;color:var(--muted-2);padding:12px 10px 6px}
.nav a{display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:var(--radius);
  color:var(--ink-3);font-size:13.5px;font-weight:500;border-left:3px solid transparent;margin-bottom:2px}
.nav a:hover{background:var(--surface)}
.nav a.on{background:var(--surface);color:var(--ink);font-weight:600;border-left-color:var(--red)}
.nav svg{width:16px;height:16px;flex:0 0 16px;stroke:currentColor;fill:none;stroke-width:1.7}
.main{flex:1;min-width:0;padding:24px 26px 90px}
.wrap{max-width:1160px;margin:0 auto}

/* ---------- sayfa başlıkları ---------- */
.phead{display:flex;align-items:flex-start;gap:16px;margin-bottom:20px;flex-wrap:wrap}
.phead h1{font-size:22px}
.phead .psub{color:var(--muted);font-size:13px;margin-top:3px}
.phead .pact{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.crumb{font-size:12px;color:var(--muted);margin-bottom:6px}
.crumb button{background:none;border:none;color:var(--muted);padding:0;font-size:12px}
.crumb button:hover{color:var(--red)}

/* ---------- kartlar & tablolar ---------- */
.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);margin-bottom:16px}
.card-h{display:flex;align-items:center;gap:11px;padding:14px 18px;border-bottom:1px solid var(--line-s)}
.card-h h2{font-size:15px}
.card-h .ch-sub{font-size:12px;color:var(--muted)}
.card-b{padding:18px}
.card-b.tight{padding:0;overflow-x:auto}

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
@media(max-width:760px){.grid2,.grid3{grid-template-columns:1fr}}

table.tbl{width:100%;border-collapse:collapse;font-size:13.5px;min-width:560px}
table.tbl th{text-align:left;font-size:11px;letter-spacing:.06em;font-weight:700;color:var(--muted);
  padding:10px 16px;border-bottom:1px solid var(--line);background:var(--surface)}
table.tbl td{padding:12px 16px;border-bottom:1px solid var(--line-s);vertical-align:middle}
table.tbl tr:last-child td{border-bottom:none}
table.tbl tbody tr:hover{background:#FCFCFD}
.row-link{font-weight:600;color:var(--ink)}
.row-link:hover{color:var(--red)}
.cell-act{text-align:right;white-space:nowrap}

.tag{display:inline-block;padding:2px 8px;border-radius:99px;font-size:11.5px;font-weight:600;
  background:var(--surface-2);color:var(--ink-3)}
.tag-red{background:var(--red-l);color:var(--red-d)}
.tag-ok{background:var(--ok-bg);color:var(--ok)}
.tag-warn{background:var(--warn-bg);color:var(--warn)}

.empty{text-align:center;padding:52px 24px;color:var(--muted)}
.empty h3{font-size:15px;color:var(--ink);margin-bottom:6px}
.empty p{margin:0 0 16px;font-size:13px}

/* ---------- plan editörü ---------- */
.plan{display:flex;gap:22px;align-items:flex-start}
.plan-idx{position:sticky;top:78px;width:210px;flex:0 0 210px;background:var(--paper);
  border:1px solid var(--line);border-radius:var(--radius);padding:8px;max-height:calc(100vh - 120px);overflow:auto}
.plan-idx button{display:flex;gap:9px;width:100%;text-align:left;background:none;border:none;
  padding:7px 9px;border-radius:5px;font-size:12.5px;color:var(--ink-3);line-height:1.35}
.plan-idx button:hover{background:var(--surface)}
.plan-idx button.on{background:var(--ink);color:#fff;font-weight:600}
.plan-idx .n{color:var(--muted-2);font-variant-numeric:tabular-nums;flex:0 0 22px}
.plan-idx button.on .n{color:rgba(255,255,255,.6)}
.plan-body{flex:1;min-width:0}
@media(max-width:980px){.plan{flex-direction:column}.plan-idx{position:static;width:100%;flex:none;display:flex;gap:4px;overflow-x:auto}
  .plan-idx button{white-space:nowrap;width:auto}}

.sect{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);margin-bottom:14px;overflow:hidden}
.sect-h{display:flex;align-items:center;gap:12px;padding:13px 17px;background:var(--surface);
  border-bottom:1px solid var(--line)}
.sect-n{font-size:12px;font-weight:700;color:var(--red);font-variant-numeric:tabular-nums;flex:0 0 auto}
.sect-h h3{font-size:14.5px}
.act{padding:16px 17px;border-bottom:1px solid var(--line-s)}
.act:last-child{border-bottom:none}
.act-h{display:flex;align-items:baseline;gap:10px;margin-bottom:11px;flex-wrap:wrap}
.act-n{font-size:12px;font-weight:700;color:var(--muted-2);font-variant-numeric:tabular-nums}
.act-h strong{font-size:13.5px;font-weight:600}
.q{margin-bottom:12px}
.q:last-child{margin-bottom:0}
.q .qt{font-size:12.5px;color:var(--ink-3);margin-bottom:7px;font-weight:500}
.inline{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap}
.inline .field{min-width:150px}
.notebox{background:var(--surface);border-left:3px solid var(--ink-3);padding:10px 13px;border-radius:0 5px 5px 0;
  font-size:12.5px;color:var(--ink-3);line-height:1.55}
.notebox.ok{background:var(--ok-bg);border-left-color:var(--ok);color:#146035}
.notebox.warn{background:var(--warn-bg);border-left-color:var(--warn);color:#7A4800}

/* 12 ay × 4 hafta ızgarası */
.g48{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px;user-select:none}
.g48 .gm{flex:1 1 auto;min-width:0}
.g48 .gml{display:block;font-size:9.5px;font-weight:700;letter-spacing:.05em;color:var(--muted-2);
  text-align:center;margin-bottom:3px}
.g48 .gw{display:flex;gap:2px}
.g48 .gw button{width:15px;height:24px;flex:1 1 0;min-width:13px;border:1px solid var(--line);background:var(--paper);
  border-radius:2px;padding:0;font-size:0;transition:background .1s}
.g48 .gw button:hover{border-color:var(--ink-3)}
.g48 .gw button[aria-pressed=true]{background:var(--red);border-color:var(--red-d)}
.g48.ro .gw button{cursor:default}
.gtools{display:flex;gap:6px;align-items:center;margin-top:9px;flex-wrap:wrap}
.gcount{font-size:11.5px;color:var(--muted)}

.savebar{position:fixed;left:0;right:0;bottom:0;z-index:35;background:rgba(255,255,255,.96);
  backdrop-filter:blur(8px);border-top:1px solid var(--line);
  padding:11px 26px;padding-bottom:calc(11px + env(safe-area-inset-bottom,0px));
  display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.savebar .sb-info{font-size:12.5px;color:var(--muted)}
.savebar .sb-space{flex:1}

/* ---------- modal ---------- */
.mask{position:fixed;inset:0;z-index:60;background:rgba(16,18,24,.5);display:flex;align-items:flex-start;
  justify-content:center;padding:6vh 18px 40px;overflow:auto}
.modal{background:var(--paper);border-radius:9px;width:100%;max-width:560px;box-shadow:var(--shadow)}
.modal.wide{max-width:760px}
.modal-h{display:flex;align-items:center;padding:16px 20px;border-bottom:1px solid var(--line-s)}
.modal-h h2{font-size:15.5px}
.modal-h .x{margin-left:auto}
.modal-b{padding:20px;max-height:66vh;overflow:auto}
.modal-f{display:flex;gap:9px;justify-content:flex-end;padding:14px 20px;border-top:1px solid var(--line-s);
  background:var(--surface);border-radius:0 0 9px 9px;flex-wrap:wrap}

/* ---------- bildirim ---------- */
#toast{position:fixed;z-index:80;left:50%;transform:translateX(-50%);
  bottom:calc(76px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:8px;align-items:center;
  pointer-events:none;width:calc(100% - 36px);max-width:440px}
.toast{background:var(--ink);color:#fff;padding:10px 16px;border-radius:7px;font-size:13px;
  box-shadow:var(--shadow);display:flex;gap:9px;align-items:center}
.toast.err{background:var(--red-d)}
.toast.ok{background:#146035}

.err-txt{color:var(--red-d);font-size:12.5px;margin-top:9px;font-weight:500;min-height:17px}
.spin{width:15px;height:15px;border:2px solid rgba(255,255,255,.35);border-top-color:#fff;border-radius:50%;
  animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.boot{min-height:100%;display:grid;place-items:center;color:var(--muted);font-size:13px;gap:12px}

.memberrow{display:flex;gap:8px;margin-bottom:8px;align-items:center}
.memberrow input:first-child{flex:0 0 40%}

@media(max-width:860px){
  .nav{position:fixed;top:calc(54px + env(safe-area-inset-top,0px));bottom:0;left:0;z-index:38;transform:translateX(-100%);
    transition:transform .2s;box-shadow:var(--shadow)}
  .nav.open{transform:none}
  .main{padding:18px 16px 92px}
  .burger{display:inline-flex}
  .savebar{padding-left:16px;padding-right:16px}
}

/* ---------- koyu tema ---------- */
@media (prefers-color-scheme:dark){
  :root:not([data-theme=light]){
    --paper:#1C1F25; --surface:#15171C; --surface-2:#272B33;
    --ink:#E9EBEF; --ink-2:#D3D7DE; --ink-3:#BFC4CD;
    --line:#333842; --line-s:#282C34;
    --muted:#98A0AD; --muted-2:#7C8492;
    --red-l:#3A1A1F; --ok-bg:#122A1E; --warn-bg:#2C2113;
    --shadow:0 12px 34px rgba(0,0,0,.5);
  }
  :root:not([data-theme=light]) .topbar{background:#0F1115}
  :root:not([data-theme=light]) .nav{background:var(--paper)}
  :root:not([data-theme=light]) table.tbl tbody tr:hover{background:#21252C}
  :root:not([data-theme=light]) .savebar{background:rgba(28,31,37,.96)}
  :root:not([data-theme=light]) .gate-card{background:var(--paper)}
  :root:not([data-theme=light]) select{background-image:url("data:image/svg+xml;charset=utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='11' height='7' viewBox='0 0 11 7'%3E%3Cpath d='M1 1l4.5 4.5L10 1' fill='none' stroke='%2398A0AD' stroke-width='1.6'/%3E%3C/svg%3E")}
}
:root[data-theme=dark]{
  --paper:#1C1F25; --surface:#15171C; --surface-2:#272B33;
  --ink:#E9EBEF; --ink-2:#D3D7DE; --ink-3:#BFC4CD;
  --line:#333842; --line-s:#282C34;
  --muted:#98A0AD; --muted-2:#7C8492;
  --red-l:#3A1A1F; --ok-bg:#122A1E; --warn-bg:#2C2113;
}
:root[data-theme=dark] .topbar{background:#0F1115}
:root[data-theme=dark] .nav{background:var(--paper)}
:root[data-theme=dark] .savebar{background:rgba(28,31,37,.96)}

@media(max-width:700px){
  .topbar .tname,.topbar .tsep{display:none}
  .topbar .uname{display:none}
  table.tbl th.opt,table.tbl td.opt{display:none}
  table.tbl{min-width:0}
  .phead h1{font-size:19px}
  .memberrow{flex-wrap:wrap}
  .memberrow input:first-child{flex:1 1 100%}
}

/* ---------- gün/ay/yıl tarih seçici ---------- */
.tarih3{display:inline-flex;gap:6px;flex-wrap:wrap}
.tarih3 select{padding:9px 26px 9px 10px}
.tarih3 select[data-td="g"]{width:72px}
.tarih3 select[data-td="a"]{width:118px}
.tarih3 select[data-td="y"]{width:88px}

/* ---------- hızlı ön izleme: tam ekran overlay ---------- */
.hizli-btn{background:var(--ink)!important;color:#fff!important;font-weight:700;margin-bottom:8px;
  border-radius:5px!important;justify-content:flex-start;width:100%}
.hizli-btn .n{color:var(--red)!important;font-size:13px}
.hizli-btn:hover{background:var(--ink-2)!important}

.hz-overlay{position:fixed;inset:0;z-index:70;background:var(--paper);display:flex;flex-direction:column;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.hz-ovh{display:flex;align-items:flex-start;gap:14px;padding:16px 22px;border-bottom:1px solid var(--line);
  background:var(--surface);flex:0 0 auto}
.hz-ovh h2{font-size:17px}
.hz-ovh .hint{display:block;margin-top:2px}
.hz-ovh .btn{margin-left:auto}
.hz-ovb{flex:1;min-height:0;overflow:auto;padding:14px 22px 22px}

.hz-scroll{width:100%}
table.hz-tbl{border-collapse:collapse;font-size:11px;width:100%;table-layout:fixed}
table.hz-tbl th,table.hz-tbl td{border:1px solid var(--line-s)}
th.hz-grup-h,th.hz-faaliyet-h{background:var(--ink);color:#fff;padding:8px 8px;text-align:left;
  font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
th.hz-ay{background:var(--ink);color:#fff;padding:5px 1px;font-size:10px;text-align:center}
th.hz-hafta-h{background:var(--surface-2);color:var(--muted);font-size:8.5px;font-weight:600;
  padding:3px 0;text-align:center}
td.hz-grup{background:var(--surface);font-weight:700;padding:7px 8px;font-size:11px;
  vertical-align:top;overflow:hidden;text-overflow:ellipsis}
td.hz-faaliyet{padding:6px 8px;font-size:11px;background:var(--paper);overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
td.hz-faaliyet .hz-no{color:var(--muted);font-variant-numeric:tabular-nums;margin-right:4px}
td.hz-faaliyet .tag{font-size:9.5px;padding:1px 5px;margin-left:5px}
.hz-git{background:none;border:none;color:var(--red);font-size:10px;font-weight:600;
  padding:0;margin-left:6px;cursor:pointer;white-space:nowrap}
.hz-git:hover{text-decoration:underline}
td.hz-hafta{height:23px;padding:0}
td.hz-hafta.ed{cursor:pointer;background:var(--paper)}
td.hz-hafta.ed:hover{background:var(--surface-2)}
td.hz-hafta.ro{background:var(--surface)}
td.hz-hafta.on{background:var(--red)}
td.hz-hafta.ro.on{background:var(--red);opacity:.6}
td.hz-not{padding:6px 10px;font-size:11px;color:var(--ink-3);background:var(--surface);text-align:left}

/* dar ekranlarda tablo küçük hücrelere sıkışmak yerine yatay kaydırmaya döner */
@media(max-width:820px){
  table.hz-tbl{table-layout:auto;min-width:1400px}
  .hz-ovb{overflow-x:auto}
  th.hz-grup-h,td.hz-grup{width:100px;max-width:100px}
  th.hz-faaliyet-h,td.hz-faaliyet{width:200px;min-width:200px;white-space:nowrap}
  td.hz-hafta{width:16px}
}
@media(max-width:700px){
  .hz-ovh{flex-direction:column;gap:8px}
  .hz-ovh .btn{margin-left:0}
}

    GROUP: 7, ACT: 8, CELL: 9, MARK: 10, NOTE: 11, SIGN: 12, FORM: 13, MARK2: 14
  };

  function stylesXml() {
    var fonts = [
      '<font><sz val="10"/><name val="Calibri"/></font>',                                  //0
      '<font><b/><sz val="18"/><color rgb="FFFFFFFF"/><name val="Calibri"/></font>',       //1
      '<font><sz val="10"/><color rgb="FF1A1C22"/><name val="Calibri"/></font>',           //2
      '<font><b/><sz val="10"/><color rgb="FFFFFFFF"/><name val="Calibri"/></font>',       //3
      '<font><b/><sz val="9"/><color rgb="FF1A1C22"/><name val="Calibri"/></font>',        //4
      '<font><sz val="9"/><color rgb="FF1A1C22"/><name val="Calibri"/></font>',            //5
      '<font><b/><sz val="10"/><color rgb="FFBD1F2E"/><name val="Calibri"/></font>',       //6
      '<font><sz val="8"/><color rgb="FF5C5C5C"/><name val="Calibri"/></font>',            //7
      '<font><b/><sz val="10"/><color rgb="FF1A1C22"/><name val="Calibri"/></font>'        //8
    ].join('');

    var fills = [
      '<fill><patternFill patternType="none"/></fill>',
      '<fill><patternFill patternType="gray125"/></fill>',
      '<fill><patternFill patternType="solid"><fgColor rgb="FFBD1F2E"/><bgColor indexed="64"/></patternFill></fill>', //2 kırmızı
      '<fill><patternFill patternType="solid"><fgColor rgb="FF1A1C22"/><bgColor indexed="64"/></patternFill></fill>', //3 koyu
      '<fill><patternFill patternType="solid"><fgColor rgb="FFEDEEF1"/><bgColor indexed="64"/></patternFill></fill>', //4 açık gri
      '<fill><patternFill patternType="solid"><fgColor rgb="FFF7DDE0"/><bgColor indexed="64"/></patternFill></fill>', //5 pembe
      '<fill><patternFill patternType="solid"><fgColor rgb="FFFAFAFB"/><bgColor indexed="64"/></patternFill></fill>'  //6 kırık beyaz
    ].join('');

    var thin = '<left style="thin"><color rgb="FFB9BDC6"/></left><right style="thin"><color rgb="FFB9BDC6"/></right><top style="thin"><color rgb="FFB9BDC6"/></top><bottom style="thin"><color rgb="FFB9BDC6"/></bottom>';
    var borders = [
      '<border><left/><right/><top/><bottom/><diagonal/></border>',              //0 yok
      '<border>' + thin + '<diagonal/></border>',                                 //1 ince
      '<border><left/><right/><top/><bottom style="medium"><color rgb="FF1A1C22"/></bottom><diagonal/></border>' //2 alt çizgi
    ].join('');

    function xf(f, fi, b, al) { return '<xf numFmtId="0" fontId="' + f + '" fillId="' + fi + '" borderId="' + b + '" xfId="0" applyFont="1" applyFill="1" applyBorder="1" applyAlignment="1">' + (al || '') + '</xf>'; }
    var C = '<alignment horizontal="center" vertical="center" wrapText="1"/>';
    var L = '<alignment horizontal="left" vertical="center" wrapText="1"/>';
    var R = '<alignment horizontal="right" vertical="center" wrapText="1"/>';

    var xfs = [
      xf(0, 0, 0, L),          // 0 NORMAL
      xf(1, 2, 0, C),          // 1 TITLE
      xf(2, 0, 0, L),          // 2 META_L
      xf(2, 0, 0, R),          // 3 META_R
      xf(3, 3, 1, C),          // 4 HEAD
      xf(3, 3, 1, C),          // 5 MONTH
      xf(4, 4, 1, C),          // 6 WEEK
      xf(4, 4, 1, C),          // 7 GROUP
      xf(5, 6, 1, L),          // 8 ACT
      xf(5, 0, 1, C),          // 9 CELL
      xf(6, 2, 1, C),          // 10 MARK  (dolu kırmızı)
      xf(5, 0, 1, L),          // 11 NOTE
      xf(8, 0, 2, C),          // 12 SIGN
      xf(7, 0, 0, R),          // 13 FORM
      xf(6, 5, 1, C)           // 14 MARK2 (açık pembe)
    ].join('');

    return '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
      '<styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">' +
      '<fonts count="9">' + fonts + '</fonts>' +
      '<fills count="7">' + fills + '</fills>' +
      '<borders count="3">' + borders + '</borders>' +
      '<cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs>' +
      '<cellXfs count="15">' + xfs + '</cellXfs>' +
      '<cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles>' +
      '</styleSheet>';
  }

  /* Sayfa oluşturucu -------------------------------------------------- */
  function Sheet() {
    this.rows = {};       // r -> { c -> {v, t, s} }
    this.merges = [];
    this.heights = {};
  }
  Sheet.prototype.set = function (r, c, v, s, isNum) {
    if (!this.rows[r]) this.rows[r] = {};
    this.rows[r][c] = { v: v, s: s || 0, n: !!isNum };
    return this;
  };
  Sheet.prototype.blank = function (r, c1, c2, s) {
    for (var c = c1; c <= c2; c++) if (!(this.rows[r] && this.rows[r][c])) this.set(r, c, '', s);
    return this;
  };
  Sheet.prototype.merge = function (r1, c1, r2, c2) {
    this.merges.push(colName(c1) + r1 + ':' + colName(c2) + r2); return this;
  };
  Sheet.prototype.h = function (r, v) { this.heights[r] = v; return this; };

  Sheet.prototype.xml = function (cols, freeze) {
    var rowNums = Object.keys(this.rows).map(Number).sort(function (a, b) { return a - b; });
    var maxC = 1, out = [];
    rowNums.forEach(function (r) {
      var cs = Object.keys(this.rows[r]).map(Number).sort(function (a, b) { return a - b; });
      if (cs.length && cs[cs.length - 1] > maxC) maxC = cs[cs.length - 1];
      var cells = cs.map(function (c) {
        var cell = this.rows[r][c], ref = colName(c) + r;
        if (cell.v === '' || cell.v === null || cell.v === undefined)
          return '<c r="' + ref + '" s="' + cell.s + '"/>';
        if (cell.n) return '<c r="' + ref + '" s="' + cell.s + '"><v>' + cell.v + '</v></c>';
        return '<c r="' + ref + '" s="' + cell.s + '" t="inlineStr"><is><t xml:space="preserve">' + esc(cell.v) + '</t></is></c>';
      }, this).join('');
      var ht = this.heights[r] ? ' ht="' + this.heights[r] + '" customHeight="1"' : '';
      out.push('<row r="' + r + '"' + ht + '>' + cells + '</row>');
    }, this);

    var colXml = cols.map(function (c) {
      return '<col min="' + c.min + '" max="' + c.max + '" width="' + c.w + '" customWidth="1"/>';
    }).join('');

    var pane = freeze ? '<pane xSplit="2" ySplit="' + freeze + '" topLeftCell="C' + (freeze + 1) + '" activePane="bottomRight" state="frozen"/>' : '';
    var mergeXml = this.merges.length
      ? '<mergeCells count="' + this.merges.length + '">' + this.merges.map(function (m) { return '<mergeCell ref="' + m + '"/>'; }).join('') + '</mergeCells>'
      : '';

    return '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
      '<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships">' +
      '<sheetPr><pageSetUpPr fitToPage="1"/></sheetPr>' +
      '<dimension ref="A1:' + colName(maxC) + (rowNums.length ? rowNums[rowNums.length - 1] : 1) + '"/>' +
      '<sheetViews><sheetView tabSelected="1" showGridLines="0" workbookViewId="0" zoomScale="85">' + pane + '</sheetView></sheetViews>' +
      '<sheetFormatPr defaultRowHeight="15"/>' +
      '<cols>' + colXml + '</cols>' +
      '<sheetData>' + out.join('') + '</sheetData>' +
      mergeXml +
      '<pageMargins left="0.25" right="0.25" top="0.4" bottom="0.4" header="0.3" footer="0.3"/>' +
      '<pageSetup paperSize="9" orientation="landscape" fitToWidth="1" fitToHeight="0"/>' +
      '</worksheet>';
  }

  function packXlsx(sheetXml, sheetName) {
    var ct = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
      '<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">' +
      '<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>' +
      '<Default Extension="xml" ContentType="application/xml"/>' +
      '<Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>' +
      '<Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>' +
      '<Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>' +
      '</Types>';
    var rels = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
      '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">' +
      '<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/>' +
      '</Relationships>';
    var wb = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
      '<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships">' +
      '<sheets><sheet name="' + esc(sheetName) + '" sheetId="1" r:id="rId1"/></sheets></workbook>';
    var wbRels = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
      '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">' +
      '<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet1.xml"/>' +
      '<Relationship Id="rId2" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/>' +
      '</Relationships>';
    return zipStore([
      { name: '[Content_Types].xml', data: ct },
      { name: '_rels/.rels', data: rels },
      { name: 'xl/workbook.xml', data: wb },
      { name: 'xl/_rels/workbook.xml.rels', data: wbRels },
      { name: 'xl/styles.xml', data: stylesXml() },
      { name: 'xl/worksheets/sheet1.xml', data: sheetXml }
    ]);
  }

  /* ---- Yıllık İSG Planı çalışma kitabı --------------------------------
     plan = {
       yil, firma:{unvan,faaliyet,tehlike,uzman,hekim,sgk},
       formNo, revTarihi,
       gruplar:[ {ad, faaliyetler:[ {ad, not:'', hafta:[48 bool]} ]} ]
     }
  --------------------------------------------------------------------- */
  function buildPlanXlsx(plan) {
    var sh = new Sheet();
    var C0 = 1, C1 = 2, W0 = 3, W1 = 50;   // A grup, B faaliyet, C..AX haftalar
    var r = 1;

    // Başlık
    sh.set(r, C0, plan.yil + ' YILI İŞ SAĞLIĞI VE GÜVENLİĞİ YILLIK ÇALIŞMA PLANI', S.TITLE);
    sh.blank(r, C0, W1, S.TITLE); sh.merge(r, C0, r, W1); sh.h(r, 34); r++;

    sh.set(r, C0, 'Form No: ' + (plan.formNo || 'İSG.PLN.01') + '   ·   Revizyon Tarihi: ' + (plan.revTarihi || '-') + '   ·   Düzenleyen: KARMA İş Sağlığı Güvenliği', S.FORM);
    sh.blank(r, C0, W1, S.FORM); sh.merge(r, C0, r, W1); sh.h(r, 16); r++;
    r++;

    function meta(lblL, valL, lblR, valR) {
      sh.set(r, C0, lblL + '  ' + (valL || '-'), S.META_L);
      sh.blank(r, C0, 22, S.META_L); sh.merge(r, C0, r, 22);
      sh.set(r, 23, lblR + '  ' + (valR || '-'), S.META_L);
      sh.blank(r, 23, W1, S.META_L); sh.merge(r, 23, r, W1);
      sh.h(r, 18); r++;
    }
    var f = plan.firma || {};
    meta('İŞYERİNİN ÜNVANI:', f.unvan, 'SGK SİCİL NO:', f.sgk);
    meta('FAALİYET KONUSU:', f.faaliyet, 'TEHLİKE SINIFI:', f.tehlike);
    meta('İŞ GÜVENLİĞİ UZMANI:', f.uzman, 'İŞYERİ HEKİMİ:', f.hekim);
    r++;

    // Tablo başlığı
    var hr = r;
    sh.set(hr, C0, 'ANA FAALİYETLER', S.HEAD); sh.merge(hr, C0, hr + 1, C0);
    sh.set(hr + 1, C0, '', S.HEAD);
    sh.set(hr, C1, 'FAALİYETLER', S.HEAD); sh.merge(hr, C1, hr + 1, C1);
    sh.set(hr + 1, C1, '', S.HEAD);
    for (var m = 0; m < 12; m++) {
      var c = W0 + m * 4;
      sh.set(hr, c, AYLAR[m], S.MONTH);
      sh.blank(hr, c, c + 3, S.MONTH);
      sh.merge(hr, c, hr, c + 3);
      for (var w = 0; w < 4; w++) sh.set(hr + 1, c + w, w + 1, S.WEEK, true);
    }
    sh.h(hr, 20); sh.h(hr + 1, 15);
    r = hr + 2;

    // Satırlar
    (plan.gruplar || []).forEach(function (g) {
      var start = r;
      g.faaliyetler.forEach(function (a) {
        sh.set(r, C1, a.ad, S.ACT);
        if (a.not) {
          sh.set(r, W0, a.not, S.NOTE);
          sh.blank(r, W0, W1, S.NOTE);
          sh.merge(r, W0, r, W1);
          sh.h(r, Math.max(22, Math.ceil(String(a.not).length / 120) * 16));
        } else {
          for (var i = 0; i < 48; i++) {
            var marked = a.hafta && a.hafta[i];
            sh.set(r, W0 + i, marked ? '' : '', marked ? S.MARK : S.CELL);
          }
          sh.h(r, 18);
        }
        r++;
      });
      sh.set(start, C0, g.ad, S.GROUP);
      for (var k = start + 1; k < r; k++) sh.set(k, C0, '', S.GROUP);
      if (r - 1 > start) sh.merge(start, C0, r - 1, C0);
    });

    r += 2;
    sh.set(r, 2, 'İş Güvenliği Uzmanı', S.SIGN); sh.blank(r, 2, 10, S.SIGN); sh.merge(r, 2, r, 10);
    sh.set(r, 14, 'İşveren / İşveren Vekili', S.SIGN); sh.blank(r, 14, 24, S.SIGN); sh.merge(r, 14, r, 24);
    sh.set(r, 28, 'İşyeri Hekimi', S.SIGN); sh.blank(r, 28, 38, S.SIGN); sh.merge(r, 28, r, 38);
    sh.h(r, 40);
    r += 2;
    sh.set(r, 1, 'Bu plan KARMA OSGB Doküman Yönetimi ile ' + (plan.olusturma || '') + ' tarihinde üretilmiştir.', S.FORM);
    sh.blank(r, 1, W1, S.FORM); sh.merge(r, 1, r, W1);

    var cols = [{ min: 1, max: 1, w: 24 }, { min: 2, max: 2, w: 42 }, { min: 3, max: 50, w: 3.1 }];
    return packXlsx(sh.xml(cols, hr + 1), plan.yil + ' İSG Planı');
  }

  /* ======================================================================
     DOCX
     ====================================================================== */
  function p(text, o) {
    o = o || {};
    var rPr = '<w:rPr>' + (o.b ? '<w:b/>' : '') + (o.i ? '<w:i/>' : '') +
      (o.color ? '<w:color w:val="' + o.color + '"/>' : '') +
      '<w:rFonts w:ascii="Calibri" w:hAnsi="Calibri"/>' +
      '<w:sz w:val="' + (o.size || 22) + '"/></w:rPr>';
    var pPr = '<w:pPr>' +
      '<w:spacing w:before="' + (o.before || 0) + '" w:after="' + (o.after === undefined ? 120 : o.after) + '" w:line="' + (o.line || 276) + '" w:lineRule="auto"/>' +
      (o.align ? '<w:jc w:val="' + o.align + '"/>' : '') +
      (o.ind ? '<w:ind w:left="' + o.ind + '"/>' : '') +
      '</w:pPr>';
    var runs = String(text === undefined || text === null ? '' : text).split('\n').map(function (line, i) {
      return (i ? '<w:r>' + rPr + '<w:br/></w:r>' : '') +
        '<w:r>' + rPr + '<w:t xml:space="preserve">' + esc(line) + '</w:t></w:r>';
    }).join('');
    return '<w:p>' + pPr + runs + '</w:p>';
  }

  function tc(content, o) {
    o = o || {};
    return '<w:tc><w:tcPr><w:tcW w:w="' + (o.w || 2000) + '" w:type="dxa"/>' +
      (o.span ? '<w:gridSpan w:val="' + o.span + '"/>' : '') +
      (o.fill ? '<w:shd w:val="clear" w:color="auto" w:fill="' + o.fill + '"/>' : '') +
      '<w:vAlign w:val="center"/></w:tcPr>' + content + '</w:tc>';
  }

  function tbl(rowsXml, widths) {
    return '<w:tbl><w:tblPr><w:tblW w:w="0" w:type="auto"/>' +
      '<w:tblBorders>' +
      ['top', 'left', 'bottom', 'right', 'insideH', 'insideV'].map(function (s) {
        return '<w:' + s + ' w:val="single" w:sz="6" w:space="0" w:color="8A8F99"/>';
      }).join('') +
      '</w:tblBorders>' +
      '<w:tblCellMar><w:top w:w="80" w:type="dxa"/><w:left w:w="100" w:type="dxa"/><w:bottom w:w="80" w:type="dxa"/><w:right w:w="100" w:type="dxa"/></w:tblCellMar>' +
      '</w:tblPr><w:tblGrid>' + widths.map(function (w) { return '<w:gridCol w:w="' + w + '"/>'; }).join('') + '</w:tblGrid>' +
      rowsXml + '</w:tbl>';
  }

  function imgPara(cx, cy) {
    return '<w:p><w:pPr><w:jc w:val="center"/><w:spacing w:after="0"/></w:pPr><w:r><w:drawing>' +
      '<wp:inline distT="0" distB="0" distL="0" distR="0">' +
      '<wp:extent cx="' + cx + '" cy="' + cy + '"/><wp:docPr id="1" name="Logo"/>' +
      '<a:graphic xmlns:a="http://schemas.openxmlformats.org/drawingml/2006/main">' +
      '<a:graphicData uri="http://schemas.openxmlformats.org/drawingml/2006/picture">' +
      '<pic:pic xmlns:pic="http://schemas.openxmlformats.org/drawingml/2006/picture">' +
      '<pic:nvPicPr><pic:cNvPr id="1" name="Logo"/><pic:cNvPicPr/></pic:nvPicPr>' +
      '<pic:blipFill><a:blip r:embed="rId10"/><a:stretch><a:fillRect/></a:stretch></pic:blipFill>' +
      '<pic:spPr><a:xfrm><a:off x="0" y="0"/><a:ext cx="' + cx + '" cy="' + cy + '"/></a:xfrm>' +
      '<a:prstGeom prst="rect"><a:avLst/></a:prstGeom></pic:spPr>' +
      '</pic:pic></a:graphicData></a:graphic></wp:inline></w:drawing></w:r></w:p>';
  }

  function packDocx(bodyXml, logoBytes) {
    var hasLogo = !!logoBytes;
    var ct = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
      '<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">' +
      '<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>' +
      '<Default Extension="xml" ContentType="application/xml"/>' +
      (hasLogo ? '<Default Extension="jpeg" ContentType="image/jpeg"/>' : '') +
      '<Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/>' +
      '<Override PartName="/word/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.styles+xml"/>' +
      '</Types>';
    var rels = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
      '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">' +
      '<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/>' +
      '</Relationships>';
    var docRels = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
      '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">' +
      '<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/>' +
      (hasLogo ? '<Relationship Id="rId10" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/image" Target="media/logo.jpeg"/>' : '') +
      '</Relationships>';
    var styles = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
      '<w:styles xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main">' +
      '<w:docDefaults><w:rPrDefault><w:rPr><w:rFonts w:ascii="Calibri" w:hAnsi="Calibri"/><w:sz w:val="22"/><w:lang w:val="tr-TR"/></w:rPr></w:rPrDefault></w:docDefaults>' +
      '<w:style w:type="paragraph" w:default="1" w:styleId="Normal"><w:name w:val="Normal"/></w:style>' +
      '</w:styles>';
    var doc = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
      '<w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main" ' +
      'xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships" ' +
      'xmlns:wp="http://schemas.openxmlformats.org/drawingml/2006/wordprocessingDrawing" ' +
      'xmlns:a="http://schemas.openxmlformats.org/drawingml/2006/main" ' +
      'xmlns:pic="http://schemas.openxmlformats.org/drawingml/2006/picture">' +
      '<w:body>' + bodyXml +
      '<w:sectPr><w:pgSz w:w="11906" w:h="16838"/>' +
      '<w:pgMar w:top="1134" w:right="1134" w:bottom="1134" w:left="1134" w:header="567" w:footer="567" w:gutter="0"/>' +
      '</w:sectPr></w:body></w:document>';

    var files = [
      { name: '[Content_Types].xml', data: ct },
      { name: '_rels/.rels', data: rels },
      { name: 'word/document.xml', data: doc },
      { name: 'word/_rels/document.xml.rels', data: docRels },
      { name: 'word/styles.xml', data: styles }
    ];
    if (hasLogo) files.push({ name: 'word/media/logo.jpeg', data: logoBytes });
    return zipStore(files);
  }

  /* ---- Kurul Atama Yazısı -------------------------------------------- */
  function buildKurulAtamaDocx(d, logoBytes) {
    var baslik = (d.unvan || '..........') + ' İŞ SAĞLIĞI VE GÜVENLİĞİ KURULU ÜYE ATAMA YAZISI';

    var headRow = '<w:tr>' +
      tc(logoBytes ? imgPara(1200000, 872000) : p('LOGO', { align: 'center', b: true }), { w: 2200 }) +

  var PERIYOTLAR = [

  ];
  function periyotAdi(v) { for (var i = 0; i < PERIYOTLAR.length; i++) if (PERIYOTLAR[i].v === v) return PERIYOTLAR[i].l; return '-'; }
  function periyotStep(v) { for (var i = 0; i < PERIYOTLAR.length; i++) if (PERIYOTLAR[i].v === v) return PERIYOTLAR[i].step; return 0; }

  var VARSAYILAN_UYELER = [
    'İşveren veya İşveren Vekili (Kurul Başkanı)',

  };

  function yeniPlan(firmaId, yil) {
    var f = {};
    KATALOG.forEach(function (g) {
      g.faaliyetler.forEach(function (a) {
        if (a.tip === 'periyodik') {
          f[a.id] = { periyot: a.on || 'yok', baslangicAy: 0, hafta: 1, secili: bos48(), tarih: '' };
        } else if (a.tip === 'mevzuat' || a.tip === 'secim') {
          f[a.id] = { gecerli: '', tarih: '', planTarih: '', secili: bos48() };
        } else if (a.tip === 'atama') {
          f[a.id] = { buYil: '', ay: 0, hafta: 1, disTarih: '', secili: bos48() };
        }
      });
    });
    Object.keys(f).forEach(function (k) { if (f[k].periyot) periyotUygula(f[k]); });
    return {
      id: uid('plan'), firmaId: firmaId, yil: yil,
      olusturma: new Date().toISOString(), guncelleme: new Date().toISOString(),
      formNo: 'İSG.PLN.01', revTarihi: trTarih(bugun()),
      calisanSayisi: '', altmis: 'evet',          // altmis: '50 kişinin altında mı' → evet/hayır
      kurulPeriyot: '3aylik', kurulHafta: 1,
      kurulIlkKez: '', kurulAtamaTarihi: '',
      kurulUyeleri: VARSAYILAN_UYELER.map(function (r) { return { rol: r, ad: '' }; }),
      kurulEgitim: '', kurulEgitimAy: 0, kurulEgitimHafta: 1,
      faaliyetler: f
    };
  }

  // eski planlara yeni alanları ekle
  function planTamamla(p) {
    if (!p.faaliyetler) p.faaliyetler = {};
    var t = yeniPlan(p.firmaId, p.yil);
    Object.keys(t.faaliyetler).forEach(function (k) {
      if (!p.faaliyetler[k]) p.faaliyetler[k] = t.faaliyetler[k];
      else Object.keys(t.faaliyetler[k]).forEach(function (alan) {
        if (p.faaliyetler[k][alan] === undefined) p.faaliyetler[k][alan] = t.faaliyetler[k][alan];
      });
      if (!p.faaliyetler[k].secili || p.faaliyetler[k].secili.length !== 48) p.faaliyetler[k].secili = bos48();
    });
    if (!p.kurulUyeleri) p.kurulUyeleri = t.kurulUyeleri;
    if (!p.formNo) p.formNo = t.formNo;
    return p;
  }

  /* ---------------- hafta hesapları ---------------- */
  function periyotUygula(st) {
    var step = periyotStep(st.periyot), sec = bos48();
    if (step > 0) {
      var h = Math.min(4, Math.max(1, +st.hafta || 1));
      for (var m = (+st.baslangicAy || 0); m < 12; m += step) sec[m * 4 + (h - 1)] = true;
    }
    st.secili = sec;
  }
  function tarihIsaretle(sec, iso) {
    if (!iso) return;
    var m = ayOf(iso), h = haftaOf(iso);
    if (m >= 0 && m < 12) sec[m * 4 + (h - 1)] = true;
  }
  function sayacText(sec) {
    var n = 0; for (var i = 0; i < 48; i++) if (sec[i]) n++;
    return n ? n + ' hafta işaretli' : 'Hiç hafta işaretlenmedi';
  }

  function yilSor(firmaId) {
    var y = new Date().getFullYear(), yillar = [y - 1, y, y + 1, y + 2];

      govde: '<div class="field"><label for="p_yil">Plan yılı</label><select id="p_yil">' +
        yillar.map(function (v) { return '<option value="' + v + '"' + (v === y ? ' selected' : '') + '>' + v + '</option>'; }).join('') +
        '</select><p class="hint">Plandaki 12 ay ve 4 haftalık sütunlar bu yıla göre düzenlenir.</p></div>' +
        '<div class="err-txt" id="p_err"></div>',
      onay: 'Planı oluştur',
      kaydet: function (kapat) {
        var yil = +$('#p_yil').value;
        if (App.planlar.some(function (p) { return p.firmaId === firmaId && +p.yil === yil; })) {
          $('#p_err').textContent = 'Bu firma için ' + yil + ' yılı planı zaten var.'; return;
        }
        var p = yeniPlan(firmaId, yil);
        var fm = App.firmalar.find(function (x) { return x._id === firmaId; }) || {};
        if (fm.calisan) { p.calisanSayisi = fm.calisan; p.altmis = (+fm.calisan < 50) ? 'evet' : 'hayir'; }
        p.kurulUyeleri[0].ad = fm.isveren || '';
        p.kurulUyeleri[1].ad = fm.uzman || '';
        p.kurulUyeleri[2].ad = fm.hekim || '';
        p.kurulUyeleri[3].ad = fm.ik || '';
        p.kurulUyeleri[4].ad = fm.temsilci || '';

          p._id = p.id; App.planlar.push(p); kapat();
          git({ ad: 'plan', id: p.id });
        }).catch(function (e) { $('#p_err').textContent = 'Oluşturulamadı: ' + (e && e.message || e); });
      }

      if (!firmayaErisimVarMi(p.firmaId)) {
        App.plan = null;
        renderKabuk('<div class="card"><div class="empty"><h3>Bu plana erişiminiz yok</h3>' +
          '<p>Bu işyerini görüntülemek için bir yönetici tarafından atanmanız gerekiyor.</p>' +
          '<button class="btn btn-primary" data-goto="planlar">Planlara dön</button></div></div>');

    var idx = '<button id="hizliBtn" class="hizli-btn">' +
      '<span class="n">⚡</span><span>HIZLI ÖN İZLEME</span></button>' +

        return '<button data-bolum="' + i + '" class="' + (i === App.aktifBolum ? 'on' : '') + '">' +
          '<span class="n">' + g.no + '</span><span>' + esc(g.ad) + '</span></button>';
      }).join('');

    var html = '<div class="crumb"><button data-goto="firmalar">Firmalar</button> › ' +
      '<button data-goto="firma" data-id="' + esc(p.firmaId) + '">' + esc(f.unvan || 'Firma') + '</button> › ' + esc(p.yil) + ' planı</div>' +
      '<div class="phead"><div><h1>' + esc(p.yil) + ' Yıllık İSG Çalışma Planı</h1>' +
      '<p class="psub">' + esc(f.unvan || '') + ' · ' + esc(f.tehlike || '') + ' · İSG uzmanı: ' + esc(f.uzman || '—') + '</p></div></div>' +
      imzaliPlanKarti(p) +
      '<div class="plan"><div class="plan-idx">' + idx + '</div><div class="plan-body" id="planBody"></div></div>' +
      '<div class="savebar"><span class="sb-info" id="sbInfo">Tüm değişiklikler kaydedilmeye hazır</span>' +

      '<button class="btn btn-primary" id="btnExcel">Excel planını indir</button></div>';

    $('#btnExcel').addEventListener('click', function () { planKaydet(false).then(excelIndir); });
    $('#btnOnizle').addEventListener('click', onizle);
    bindImzaliPlanKarti(p);

  function kirlet() {

  function planKaydet(bildir) {
    var p = App.plan;
    p.guncelleme = new Date().toISOString();
    return Store.set('planlar/' + p.id, p).then(function () {
      var i = App.planlar.findIndex(function (x) { return x._id === p.id; });
      var kopya = JSON.parse(JSON.stringify(p)); kopya._id = p.id;
      if (i >= 0) App.planlar[i] = kopya; else App.planlar.push(kopya);
      App.kirli = false;
      var s = $('#sbInfo'); if (s) { s.textContent = 'Kaydedildi · ' + new Date().toLocaleTimeString('tr-TR').slice(0, 5); s.style.color = ''; }
      if (bildir) toast('Plan kaydedildi', 'ok');
    }).catch(function (e) { toast('Kaydedilemedi: ' + (e && e.message || e), 'err'); throw e; });

  /* ---- bölüm çizimi ---- */
  function bolumCiz() {
    var p = App.plan;
    var g = KATALOG[App.aktifBolum];
    var h = '<div class="sect"><div class="sect-h"><span class="sect-n">' + g.no + '</span><h3>' + esc(g.ad) + '</h3></div>';

    if (g.key === 'kurul') h += kurulHtml(p);

    h += g.faaliyetler.map(function (a) {
      if (a.tip === 'kurul_olusturma') return actWrap(a, kurulOlusturmaHtml(p));
      if (a.tip === 'kurul_egitim') return actWrap(a, kurulEgitimHtml(p));
      if (a.tip === 'kurul_toplanti') return actWrap(a, kurulToplantiHtml(p));
      if (a.tip === 'atama') return actWrap(a, atamaHtml(a, p));
      if (a.tip === 'mevzuat') return actWrap(a, mevzuatHtml(a, p));
      if (a.tip === 'secim') return actWrap(a, secimHtml(a, p));
      return actWrap(a, periyodikHtml(a, p));
    }).join('');

    h += '</div>';
    $('#planBody').innerHTML = h;
    bindBolum();
  }

  /* ==========================================================================
     HIZLI ÖN İZLEME — tüm plan tek sayfada, doğrudan tıklanabilir
     ========================================================================== */
  function hizliSatirBilgisi(a, p) {
    var st = p.faaliyetler[a.id];
    if (a.tip === 'kurul_olusturma') {
      if (p.altmis === 'evet') return { not: 'ÇALIŞAN SAYISI 50 KİŞİNİN ALTINDA OLDUĞUNDAN DOLAYI İSG KURULU OLUŞTURULMASINA GEREK BULUNMAMAKTADIR.', editable: false };
      if (p.kurulIlkKez === 'evet') {
        var s = bos48(); if (yilOf(p.kurulAtamaTarihi) === +p.yil) tarihIsaretle(s, p.kurulAtamaTarihi);
        return { secili: s, editable: false };
      }
      if (p.kurulIlkKez === 'hayir') {
        if (!p.faaliyetler.k_olusturma_manuel) p.faaliyetler.k_olusturma_manuel = { secili: bos48() };
        return { secili: p.faaliyetler.k_olusturma_manuel.secili, editable: true, id: 'k_olusturma_manuel' };
      }
      return { secili: bos48(), editable: false, uyari: true };
    }
    if (a.tip === 'kurul_egitim') {
      var se = bos48();
      if (p.altmis !== 'evet' && p.kurulEgitim === 'evet') se[(+p.kurulEgitimAy || 0) * 4 + ((+p.kurulEgitimHafta || 1) - 1)] = true;
      return { secili: se, editable: false };
    }
    if (a.tip === 'kurul_toplanti') return { secili: kurulToplantiSecili(p), editable: false };
    if (a.tip === 'atama') {
      if (st.buYil === 'evet') return { secili: st.secili || bos48(), editable: false };
      if (st.buYil === 'hayir' && st.disTarih) return { not: atamaNotMetni(a, st), editable: false };
      return { secili: bos48(), editable: false, uyari: !st.buYil };
    }
    if (a.tip === 'mevzuat' || a.tip === 'secim') {
      if (st.gecerli === 'evet' && st.tarih) return { not: (a.tip === 'mevzuat' ? mevzuatMetni(a, st) : secimMetni(a, st, p)), editable: false };
      return { secili: st.secili || bos48(), editable: false, uyari: !st.gecerli };
    }
    return { secili: st.secili || bos48(), editable: true, id: a.id };
  }

  function hizliTabloIcerik(p) {
    var ayBaslik = AY_KISA.map(function (a) { return '<th colspan="4" class="hz-ay ay-sinir">' + a + '</th>'; }).join('');
    var haftaBaslik = '';
    for (var m = 0; m < 12; m++) for (var w = 1; w <= 4; w++) haftaBaslik += '<th class="hz-hafta-h' + (w === 1 ? ' ay-sinir' : '') + '">' + w + '</th>';
    var haftaGenislik = (76 / 48).toFixed(3);
    var colgroup = '<colgroup><col style="width:9%"><col style="width:15%">' +
      Array(48).fill('<col style="width:' + haftaGenislik + '%">').join('') + '</colgroup>';

    var gövde = KATALOG.map(function (g, gi) {
      return g.faaliyetler.map(function (a, ai) {
        var bilgi = hizliSatirBilgisi(a, p);
        var grupHucre = ai === 0 ? '<td class="hz-grup" rowspan="' + g.faaliyetler.length + '">' + esc(g.ad) + '</td>' : '';
        var faaliyetHucre = '<td class="hz-faaliyet"><span class="hz-no">' + esc(a.no) + '</span> ' + esc(a.ad) +
          (bilgi.uyari ? ' <span class="tag tag-warn">yapılandırılmadı</span>' : '') +
          ' <button class="hz-git" data-git="' + gi + '" type="button">Bölüme git →</button></td>';
        var icerikHucre;
        if (bilgi.not) {
          icerikHucre = '<td colspan="48" class="hz-not">' + esc(bilgi.not) + '</td>';
        } else {
          var hucreler = '';
          for (var i = 0; i < 48; i++) {
            var on = bilgi.secili[i];
            hucreler += '<td class="hz-hafta' + (on ? ' on' : '') + (bilgi.editable ? ' ed' : ' ro') + (i % 4 === 0 ? ' ay-sinir' : '') + '"' +
              (bilgi.editable ? ' data-hz="' + esc(bilgi.id) + '" data-i="' + i + '"' : '') +
              ' title="' + AYLAR[Math.floor(i / 4)] + ' ' + ((i % 4) + 1) + '. hafta"></td>';
          }
          icerikHucre = hucreler;
        }
        return '<tr>' + grupHucre + faaliyetHucre + icerikHucre + '</tr>';
      }).join('');
    }).join('');

    return '<div class="hz-scroll"><table class="hz-tbl">' + colgroup +
      '<thead><tr><th class="hz-grup-h">Ana faaliyet</th><th class="hz-faaliyet-h">Faaliyet</th>' + ayBaslik + '</tr>' +
      '<tr><th></th><th></th>' + haftaBaslik + '</tr></thead>' +
      '<tbody>' + gövde + '</tbody></table></div>' +
      '<p class="hint" style="padding:10px 4px 0">Gri hücreler bu sayfadan düzenlenemez (kurul, atama ve mevzuat tarihleri gibi cevaba bağlı satırlar) — bunları değiştirmek için "Bölüme git" bağlantısını kullanın.</p>';
  }

  function bindHizli(kapsam) {
    var p = App.plan, boya = null;
    function guncelleGoster(td, on) {
      var id = td.getAttribute('data-hz'), i = +td.getAttribute('data-i');
      var st = p.faaliyetler[id]; if (!st) return;
      if (!st.secili || st.secili.length !== 48) st.secili = bos48();
      st.secili[i] = on;
      td.classList.toggle('on', on);
    }
    $$('.hz-hafta.ed', kapsam).forEach(function (td) {
      td.addEventListener('pointerdown', function (e) {
        e.preventDefault();
        boya = !td.classList.contains('on');
        guncelleGoster(td, boya);
        kirlet();
      });
      td.addEventListener('pointerover', function () {
        if (boya === null) return;
        guncelleGoster(td, boya);
      });
    });
    document.addEventListener('pointerup', function () { boya = null; }, { once: false });
    $$('[data-git]', kapsam).forEach(function (b) {
      b.addEventListener('click', function () {
        App.aktifBolum = +b.getAttribute('data-git');
        hizliTamEkranKapat();
        renderPlan();
      });
    });

  function tarih3Bagla(kutu) {

      var a = kutu.querySelector('[data-td="a"]').value;

      var iso = (g && a !== '' && y) ? (y + '-' + ('0' + (+a + 1)).slice(-2) + '-' + ('0' + g).slice(-2)) : '';

      hid.value = iso;

      // henüz seçilmemiş diğer kutular sıfırlanırdı (örn. yıl seçilmeden gün/ay kaybolurdu).
      if (iso !== '' || oncekiDoluMuydu) hid.dispatchEvent(new Event('change', { bubbles: true }));

  /* ---- bölüm olayları ---- */
  function bindBolum() {
    var p = App.plan, body = $('#planBody');

    // gün/ay/yıl tarih seçiciler
    $$('.tarih3', body).forEach(tarih3Bagla);

    // segment seçiciler
    $$('[data-seg]', body).forEach(function (seg) {
      seg.addEventListener('click', function (e) {
        var b = e.target.closest('button[data-v]'); if (!b) return;
        var name = seg.getAttribute('data-seg'), v = b.getAttribute('data-v');
        if (name.indexOf('f:') === 0) {
          var pr = name.split(':'), st = p.faaliyetler[pr[1]];
          st[pr[2]] = v;
          if (pr[2] === 'periyot') { periyotUygula(st); }
          if (pr[2] === 'buYil' && v === 'hayir') st.secili = bos48();
          if (pr[2] === 'buYil' && v === 'evet') { st.secili = bos48(); st.secili[(+st.ay || 0) * 4 + ((+st.hafta || 1) - 1)] = true; }
          if (pr[2] === 'gecerli') { st.secili = bos48(); }
        } else {
          p[name] = v;
          if (name === 'altmis' && v === 'evet') { p.kurulIlkKez = ''; p.kurulEgitim = ''; }
        }
        kirlet(); bolumCiz();
      });
    });

    // girişler
    $$('[data-inp]', body).forEach(function (el) {
      el.addEventListener('change', function () {
        var k = el.getAttribute('data-inp'), v = el.value;
        if (k.indexOf('f:') === 0) {
          var pr = k.split(':'), st = p.faaliyetler[pr[1]];
          st[pr[2]] = v;
          if (pr[2] === 'ay' || pr[2] === 'hafta') {
            if (st.buYil === 'evet') { st.secili = bos48(); st.secili[(+st.ay || 0) * 4 + ((+st.hafta || 1) - 1)] = true; }
          }
          if (pr[2] === 'tarih' && st.gecerli === undefined) {
            // yıllık periyodik: tarih girildiyse işaretle
            st.secili = bos48(); tarihIsaretle(st.secili, v);
          }
          if (pr[2] === 'planTarih') { st.secili = bos48(); if (yilOf(v) === +p.yil) tarihIsaretle(st.secili, v); }
        } else {
          p[k] = v;
        }
        kirlet(); bolumCiz();
      });
    });

    // ızgara
    $$('[data-grid]', body).forEach(function (g) {
      if (g.classList.contains('ro')) return;
      var id = g.getAttribute('data-grid'), boya = null;
      function setIdx(i, on) {
        var st = p.faaliyetler[id]; if (!st) { st = p.faaliyetler[id] = { secili: bos48() }; }
        st.secili[i] = on;
        var b = g.querySelector('[data-i="' + i + '"]'); if (b) b.setAttribute('aria-pressed', on ? 'true' : 'false');
        var c = g.parentNode.querySelector('.gcount'); if (c) c.textContent = sayacText(st.secili);
      }
      g.addEventListener('pointerdown', function (e) {
        var b = e.target.closest('button[data-i]'); if (!b) return;
        e.preventDefault();
        boya = b.getAttribute('aria-pressed') !== 'true';
        setIdx(+b.getAttribute('data-i'), boya); kirlet();
      });
      g.addEventListener('pointerover', function (e) {
        if (boya === null) return;
        var b = e.target.closest('button[data-i]'); if (!b) return;
        setIdx(+b.getAttribute('data-i'), boya);
      });
      document.addEventListener('pointerup', function () { boya = null; }, { once: false });
    });

    $$('[data-uygula]', body).forEach(function (b) {
      b.addEventListener('click', function () {
        var id = b.getAttribute('data-uygula'), st = p.faaliyetler[id];

  function planSatirlari(p) {
    var gruplar = [];
    KATALOG.forEach(function (g) {
      var fa = [];
      g.faaliyetler.forEach(function (a) {
        var st = p.faaliyetler[a.id] || {};
        if (a.tip === 'kurul_olusturma') {
          if (p.altmis === 'evet') {
            fa.push({ ad: a.ad, not: 'ÇALIŞAN SAYISI 50 KİŞİNİN ALTINDA OLDUĞUNDAN DOLAYI İSG KURULU OLUŞTURULMASINA GEREK BULUNMAMAKTADIR.' });
          } else if (p.kurulIlkKez === 'evet') {
            var s = bos48(); if (yilOf(p.kurulAtamaTarihi) === +p.yil) tarihIsaretle(s, p.kurulAtamaTarihi);
            fa.push({ ad: a.ad, hafta: s });
          } else {
            var mn = p.faaliyetler.k_olusturma_manuel;
            fa.push({ ad: a.ad, hafta: mn ? mn.secili : bos48() });
          }
        } else if (a.tip === 'kurul_egitim') {
          var se = bos48();
          if (p.altmis !== 'evet' && p.kurulEgitim === 'evet') se[(+p.kurulEgitimAy || 0) * 4 + ((+p.kurulEgitimHafta || 1) - 1)] = true;
          fa.push({ ad: a.ad, hafta: se });
        } else if (a.tip === 'kurul_toplanti') {
          fa.push({ ad: a.ad, hafta: kurulToplantiSecili(p) });
        } else if (a.tip === 'mevzuat' || a.tip === 'secim') {
          if (st.gecerli === 'evet' && st.tarih) fa.push({ ad: a.ad, not: (a.tip === 'mevzuat' ? mevzuatMetni(a, st) : secimMetni(a, st, p)) });
          else fa.push({ ad: a.ad, hafta: st.secili || bos48() });
        } else if (a.tip === 'atama') {
          if (st.buYil === 'hayir' && st.disTarih) fa.push({ ad: a.ad, not: atamaNotMetni(a, st) });
          else fa.push({ ad: a.ad, hafta: st.secili || bos48() });
        } else {
          fa.push({ ad: a.ad, hafta: st.secili || bos48() });
        }
      });
      gruplar.push({ ad: g.ad, faaliyetler: fa });
    });
    return gruplar;
  }

  function dosyaVer(ad, bytes) {
    var blob = new Blob([bytes], { type: 'application/octet-stream' });
    function yedek() {
      var url = URL.createObjectURL(blob), a = document.createElement('a');
      a.href = url; a.download = ad; document.body.appendChild(a); a.click();
      setTimeout(function () { URL.revokeObjectURL(url); a.remove(); }, 1500);
      return true;
    }
    if (App.downloads === undefined && window.claude && typeof window.claude.use === 'function') {
      return window.claude.use('downloads').then(function (d) {
        App.downloads = d || null;
        return App.downloads ? App.downloads.save({ filename: ad, data: blob }).then(function () { toast('Dosya indirildi', 'ok'); })
          .catch(function (e) { if (e && e.code === 'declined') return; yedek(); }) : yedek();
      }).catch(yedek);
    }
    if (App.downloads) {
      return App.downloads.save({ filename: ad, data: blob }).then(function () { toast('Dosya indirildi', 'ok'); })
        .catch(function (e) { if (!(e && e.code === 'declined')) yedek(); });
    }
    yedek(); return Promise.resolve();
  }

  /* ---- imzalı plan (taranmış PDF) yükleme/görüntüleme ---- */
  var PDF_MAX = 8 * 1024 * 1024; // 8 MB

  function dosyaB64Oku(dosya) {
    return new Promise(function (resolve, reject) {
      var r = new FileReader();
      r.onload = function () { resolve(String(r.result).split(',')[1] || ''); };
      r.onerror = function () { reject(new Error('Dosya okunamadı')); };
      r.readAsDataURL(dosya);
    });
  }

  function imzaliPlanYukle(planId, dosya, sonra) {
    if (dosya.type !== 'application/pdf' && !/\.pdf$/i.test(dosya.name)) {
      toast('Yalnızca PDF dosyası yükleyebilirsiniz', 'err'); return;
    }
    if (dosya.size > PDF_MAX) {
      toast('Dosya çok büyük (maks. 8 MB). Daha düşük çözünürlükte tarayın veya sıkıştırın.', 'err'); return;
    }
    toast('Yükleniyor…');
    dosyaB64Oku(dosya).then(function (b64) {
      return Store.set('planlar_pdf/' + planId, { veri: b64 }).then(function () {
        var bilgi = { ad: dosya.name, boyut: dosya.size, yuklenme: new Date().toISOString(), yukleyen: App.kullanici.adSoyad };
        var p = App.plan && App.plan.id === planId ? App.plan : null;
        if (p) { p.imzaliPlan = bilgi; return planKaydet(false).then(function () { return bilgi; }); }
        // plan editör dışında (firma/plan listesi) — planı ayrıca yükleyip kaydet
        return Store.get('planlar/' + planId).then(function (pl) {
          pl.imzaliPlan = bilgi;
          return Store.set('planlar/' + planId, pl).then(function () {
            var i = App.planlar.findIndex(function (x) { return x._id === planId; });
            var kopya = JSON.parse(JSON.stringify(pl)); kopya._id = planId;
            if (i >= 0) App.planlar[i] = kopya; else App.planlar.push(kopya);
            return bilgi;
          });
        });
      });
    }).then(function () {
      toast('İmzalı plan yüklendi', 'ok');
      if (sonra) sonra();
    }).catch(function (e) { toast('Yüklenemedi: ' + (e && e.message || e), 'err'); });
  }

  function imzaliPlanGoster(planId) {
    toast('Açılıyor…');
    Store.get('planlar_pdf/' + planId).then(function (d) {
      if (!d || !d.veri) { toast('Dosya bulunamadı', 'err'); return; }
      var bin = atob(d.veri), bytes = new Uint8Array(bin.length);
      for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
      var blob = new Blob([bytes], { type: 'application/pdf' });
      var url = URL.createObjectURL(blob);
      window.open(url, '_blank');
      setTimeout(function () { URL.revokeObjectURL(url); }, 60000);
    }).catch(function (e) { toast('Açılamadı: ' + (e && e.message || e), 'err'); });
  }

  function imzaliPlanKaldir(planId, sonra) {
    if (!confirm('Yüklenen imzalı plan silinsin mi?')) return;
    Store.del('planlar_pdf/' + planId).then(function () {
      var p = App.plan && App.plan.id === planId ? App.plan : null;
      if (p) { p.imzaliPlan = null; return planKaydet(false); }
      return Store.get('planlar/' + planId).then(function (pl) {
        pl.imzaliPlan = null;
        return Store.set('planlar/' + planId, pl).then(function () {
          var i = App.planlar.findIndex(function (x) { return x._id === planId; });
          if (i >= 0) { App.planlar[i].imzaliPlan = null; }
        });
      });
    }).then(function () {
      toast('İmzalı plan kaldırıldı', 'ok');
      if (sonra) sonra();
    }).catch(function (e) { toast('Silinemedi: ' + (e && e.message || e), 'err'); });
  }

            .catch(function (e) { $('#s_err').textContent = e.message === 'eski' ? 'Mevcut şifre hatalı.' : 'Değiştirilemedi.'; });
        }
      });
    });
    $('#yedekAl').addEventListener('click', function () {
      var veri = JSON.stringify({
        surum: 1, tarih: new Date().toISOString(),
        firmalar: App.firmalar, planlar: App.planlar,
        kullanicilar: App.kullanicilar.map(function (u) { return { kullanici: u.kullanici, adSoyad: u.adSoyad, rol: u.rol, aktif: u.aktif }; })
      }, null, 2);
      dosyaVer('karma_osgb_yedek_' + bugun() + '.json', new TextEncoder().encode(veri));
    });

    var bt = $('#baglantiTest');
    if (bt) bt.addEventListener('click', function () {
      bt.disabled = true; bt.textContent = 'Test ediliyor…';
      ghBaglantiTest(GH).then(function () { toast('Bağlantı çalışıyor', 'ok'); })
        .catch(function (e) { toast('Bağlantı testi başarısız: ' + (e && e.message || e), 'err'); })
        .then(function () { bt.disabled = false; bt.textContent = 'Bağlantıyı test et'; });
    });

    var bd = $('#baglantiDegis');
    if (bd) bd.addEventListener('click', function () {
      modal({
        baslik: 'GitHub deposuna bağlan',
        govde: '<div class="field"><label for="bd_owner">GitHub kullanıcı adı / organizasyon</label><input id="bd_owner" type="text" value="' + esc(GH ? GH.owner : '') + '"></div>' +
          '<div class="field"><label for="bd_repo">Depo adı</label><input id="bd_repo" type="text" value="' + esc(GH ? GH.repo : '') + '"></div>' +
          '<div class="field"><label for="bd_branch">Dal</label><input id="bd_branch" type="text" value="' + esc(GH ? GH.branch : 'main') + '"></div>' +
          '<div class="field"><label for="bd_token">Erişim anahtarı</label><input id="bd_token" type="password" placeholder="' + (Store.mode === 'github' ? 'Değiştirmemek için boş bırakın' : 'github_pat_…') + '"></div>' +
          '<div class="err-txt" id="bd_err"></div>',
        onay: 'Bağlan',
        kaydet: function (kapat) {
          var cfg = {
            owner: $('#bd_owner').value.trim(), repo: $('#bd_repo').value.trim(),
            branch: ($('#bd_branch').value.trim() || 'main'),
            token: $('#bd_token').value.trim() || (GH ? GH.token : '')
          };
          var e = $('#bd_err');
          if (!cfg.owner || !cfg.repo || !cfg.token) { e.textContent = 'Kullanıcı adı, depo adı ve erişim anahtarı gerekli.'; return; }
          e.textContent = 'Bağlantı test ediliyor…';
          ghBaglantiTest(cfg).then(function () {
            try { localStorage.setItem(GH_LS, JSON.stringify(cfg)); } catch (x) { }
            try { localStorage.removeItem(LOCAL_LS); } catch (x) { }
            GH = cfg; Store.mode = 'github';
            kapat(); toast('Bağlantı güncellendi', 'ok');
            yukleVeAc();
          }).catch(function (err) { e.textContent = (err && err.message) || 'Bağlanılamadı.'; });
        }
      });
    });

    var yb = $('#yedekYukleBtn'), yi = $('#yedekYukle');
    if (yb) yb.addEventListener('click', function () { yi.click(); });
    if (yi) yi.addEventListener('change', function () {
      var dosya = yi.files[0]; if (!dosya) return;
      var okuyucu = new FileReader();
      okuyucu.onload = function () {
        var veri; try { veri = JSON.parse(okuyucu.result); } catch (e) { toast('Geçersiz JSON dosyası', 'err'); return; }
        var firmalar = Array.isArray(veri.firmalar) ? veri.firmalar : [];
        var planlar = Array.isArray(veri.planlar) ? veri.planlar : [];
        if (!firmalar.length && !planlar.length) { toast('Dosyada içe aktarılacak firma veya plan bulunamadı', 'err'); return; }
        if (!confirm(firmalar.length + ' firma ve ' + planlar.length + ' plan içe aktarılacak. Aynı kimlikli kayıtların üzerine yazılır. Devam edilsin mi?')) return;
        toast('İçe aktarılıyor…');
        Promise.all(firmalar.map(function (f) {
          var id = f._id || uid('frm'), kopya = JSON.parse(JSON.stringify(f)); delete kopya._id;
          return Store.set('firmalar/' + id, kopya).then(function () { kopya._id = id; return kopya; });
        })).then(function (yeniFirmalar) {
          return Promise.all(planlar.map(function (p) {
            var id = p._id || p.id || uid('plan'), kopya = JSON.parse(JSON.stringify(p)); delete kopya._id;
            return Store.set('planlar/' + id, kopya).then(function () { kopya._id = id; return kopya; });
          })).then(function (yeniPlanlar) { return { yeniFirmalar: yeniFirmalar, yeniPlanlar: yeniPlanlar }; });
        }).then(function (r) {
          toast(r.yeniFirmalar.length + ' firma, ' + r.yeniPlanlar.length + ' plan içe aktarıldı', 'ok');
          yukleVeAc();
        }).catch(function (e) { toast('İçe aktarma sırasında hata: ' + (e && e.message || e), 'err'); });
      };
      okuyucu.readAsText(dosya, 'utf-8');
      yi.value = '';
    });
  }

  /* ==========================================================================
     MODAL
     ========================================================================== */
  function modal(o) {
    var m = document.createElement('div');
    m.className = 'mask';
    m.innerHTML = '<div class="modal' + (o.wide ? ' wide' : '') + '">' +
      '<div class="modal-h"><h2>' + esc(o.baslik) + '</h2><button class="btn btn-quiet x" data-kapat>✕</button></div>' +
      '<div class="modal-b">' + o.govde + '</div>' +
      '<div class="modal-f"><button class="btn btn-ghost" data-kapat>' + esc(o.iptal || 'Vazgeç') + '</button>' +
      (o.onay ? '<button class="btn btn-primary" data-onay>' + esc(o.onay) + '</button>' : '') + '</div></div>';
    document.body.appendChild(m);
    function kapat() { m.remove(); }
    $$('[data-kapat]', m).forEach(function (b) { b.addEventListener('click', kapat); });
    m.addEventListener('mousedown', function (e) { if (e.target === m) kapat(); });
    document.addEventListener('keydown', function esc2(e) {
      if (e.key === 'Escape') { kapat(); document.removeEventListener('keydown', esc2); }
    });
    var ok = $('[data-onay]', m);
    if (ok) ok.addEventListener('click', function () { o.kaydet(kapat); });
    return kapat;
  }

  /* ==========================================================================
     GLOBAL OLAYLAR
     ========================================================================== */
  document.addEventListener('click', function (e) {
    var t = e.target.closest('[data-goto]');
    if (t) {
      e.preventDefault();
      var ad = t.getAttribute('data-goto');
      if (App.kirli && !confirm('Kaydedilmemiş değişiklikler var. Ayrılmak istiyor musunuz?')) return;
      App.kirli = false; App.plan = null;
      git(ad === 'firma' ? { ad: 'firma', id: t.getAttribute('data-id') } : { ad: ad });
      return;
    }
    var f = e.target.closest('[data-firma]');
    if (f) { git({ ad: 'firma', id: f.getAttribute('data-firma') }); return; }
    var pg = e.target.closest('[data-pdfgor]');
    if (pg) { imzaliPlanGoster(pg.getAttribute('data-pdfgor')); return; }
    var pl = e.target.closest('[data-plan]');
    if (pl) { App.plan = null; git({ ad: 'plan', id: pl.getAttribute('data-plan') }); return; }
    var ps = e.target.closest('[data-plansil]');
    if (ps) {
      var id = ps.getAttribute('data-plansil');
      if (!confirm('Bu plan silinsin mi? Geri alınamaz.')) return;
      Store.del('planlar/' + id).then(function () {
        App.planlar = App.planlar.filter(function (x) { return x._id !== id; });
        render(); toast('Plan silindi', 'ok');
      });
      return;
    }
    var yf = e.target.closest('#yeniFirma,#yeniFirma2');
    if (yf) { firmaModal(null); }
  });

  window.addEventListener('beforeunload', function (e) {
    if (App.kirli) { e.preventDefault(); e.returnValue = ''; }
  });

  /* ==========================================================================
     AÇILIŞ
     ========================================================================== */
  function yukleVeAc() {
    document.body.innerHTML = '<div class="boot"><div class="spin" style="border-color:rgba(0,0,0,.15);border-top-color:var(--red)"></div><span>Kayıtlar yükleniyor…</span></div>';
    Promise.all([Store.list('firmalar'), Store.list('planlar'), Store.list('users')])
      .then(function (r) {
        App.firmalar = r[0]; App.planlar = r[1].map(planTamamla); App.kullanicilar = r[2];
        App.route = { ad: 'firmalar' };
        render();
      })
      .catch(function (e) { document.body.innerHTML = '<div class="boot">Kayıtlar yüklenemedi: ' + esc(e && e.message || e) + '</div>'; });
  }

  function boot() {
    document.body.innerHTML = '<div class="boot"><div class="spin" style="border-color:rgba(0,0,0,.15);border-top-color:var(--red)"></div><span>Başlatılıyor…</span></div>';
    Store.init().then(function () {
      if (Store.mode === 'setup_needed') { renderDepolamaKurulum(); return Promise.reject({ _dur: true }); }
      return Store.get('app/config');
    }).then(function (cfg) {
      if (!cfg || !cfg.kurulmus) return Store.list('users').then(function (us) {
        if (!us.length) { renderKurulum(); return null; }
        return true;
      });
      return true;
    }).then(function (ok) {
      if (ok === null) return;
      var kayitli = null;
      try { kayitli = sessionStorage.getItem('karma_osgb_oturum'); } catch (e) { }
      if (kayitli) {
        return Store.get('users/' + kayitli).then(function (u) {
          if (u && u.aktif !== false) { App.kullanici = u; yukleVeAc(); } else renderGiris();
        });
      }
      renderGiris();
    }).catch(function (e) {
      if (e && e._dur) return; // depolama kurulum ekranı zaten gösterildi
      document.body.innerHTML = '<div class="boot">Uygulama başlatılamadı: ' + esc(e && e.message || e) + '</div>';
    });
  }

  /* ---------------- depolama bağlantısı kurulumu (GitHub) ---------------- */
  function renderDepolamaKurulum(mevcutHata) {
    document.body.innerHTML =
      '<div class="gate"><div class="gate-card" style="max-width:440px">' +
      '<img class="gate-logo" src="' + LOGO + '" alt="KARMA İş Sağlığı Güvenliği">' +
      '<h1>Depolama bağlantısı</h1>' +
      '<p class="sub">Kayıtların tutulacağı GitHub deposunu bağlayın. Bu bilgiler yalnızca bu cihazda saklanır.</p>' +
      '<div class="field"><label for="d_owner">GitHub kullanıcı adı / organizasyon</label><input id="d_owner" type="text" placeholder="ör. karma-osgb"></div>' +
      '<div class="field"><label for="d_repo">Depo adı</label><input id="d_repo" type="text" placeholder="ör. osgb-veri"></div>' +
      '<div class="field"><label for="d_branch">Dal</label><input id="d_branch" type="text" value="main"></div>' +
      '<div class="field"><label for="d_token">Erişim anahtarı (fine-grained token)</label><input id="d_token" type="password" placeholder="github_pat_…"></div>' +
      '<div class="err-txt" id="d_err">' + esc(mevcutHata || '') + '</div>' +
      '<button class="btn btn-primary btn-block" id="d_go">Bağlan ve devam et</button>' +
      '<p class="foot">Bu depo yalnızca veri için kullanılan, <strong>private</strong> ayrı bir depo olmalı — sitenizi yayınlayan depodan farklı.<br>' +
      '<a href="#" id="d_yerel" style="color:inherit;text-decoration:underline">Bunun yerine bu cihazda yerel olarak dene</a></p>' +
      '</div></div><div id="toast"></div>';

    function go() {
      var cfg = {
        owner: $('#d_owner').value.trim(), repo: $('#d_repo').value.trim(),
        branch: ($('#d_branch').value.trim() || 'main'), token: $('#d_token').value.trim()
      };
      var e = $('#d_err');
      if (!cfg.owner || !cfg.repo || !cfg.token) { e.textContent = 'Kullanıcı adı, depo adı ve erişim anahtarı gerekli.'; return; }
      e.textContent = 'Bağlantı test ediliyor…';
      $('#d_go').disabled = true;
      ghBaglantiTest(cfg).then(function () {
        try { localStorage.setItem(GH_LS, JSON.stringify(cfg)); } catch (x) { }
        GH = cfg; Store.mode = 'github';
        toast('GitHub deposuna bağlandı', 'ok');
        boot();
      }).catch(function (err) {
        $('#d_go').disabled = false;
        e.textContent = (err && err.message) || 'Bağlanılamadı.';
      });
    }
    $('#d_go').addEventListener('click', go);
    $('.gate-card').addEventListener('keydown', function (ev) { if (ev.key === 'Enter') go(); });
    $('#d_yerel').addEventListener('click', function (ev) {
      ev.preventDefault();
      try { localStorage.setItem(LOCAL_LS, '1'); } catch (x) { }
      Store.mode = 'local';
      boot();
    });
    $('#d_owner').focus();
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();

</script>
</body>
</html>
