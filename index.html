<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>KARMA OSGB Personel Yönetim Sistemi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{
  --red:#BD1F2E; --red-d:#8E1421; --red-l:#F7DDE0;
  --ink:#16181D; --ink-3:#3A3F4A; --paper:#FFFFFF; --surface:#F4F5F7; --surface-2:#EAECF0;
  --line:#DBDFE6; --line-s:#EDEFF3; --muted:#6B7280; --muted-2:#8A909B;
  --ok:#1C7A46; --ok-bg:#E6F4EC; --warn:#9A5B00; --warn-bg:#FCF2E2; --bad:#B3261E; --bad-bg:#FBE5E3;
  --radius:7px; --shadow:0 12px 34px rgba(16,18,24,.16);
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--surface);color:var(--ink);font-family:'Archivo','Segoe UI',system-ui,sans-serif;font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--red);text-decoration:none}
h1,h2,h3{margin:0;font-weight:600;letter-spacing:-.011em}
:focus-visible{outline:2px solid var(--red);outline-offset:2px;border-radius:3px}

.gate{min-height:100%;display:flex;align-items:center;justify-content:center;padding:32px 18px;background:radial-gradient(1100px 520px at 50% -15%,#23262E 0%,#16181D 62%,#101216 100%)}
.gate-card{width:100%;max-width:420px;background:var(--paper);border-radius:10px;padding:30px;box-shadow:0 26px 70px rgba(0,0,0,.42)}
.gate-card.wide{max-width:560px}
.gate-logo{display:block;width:170px;margin:0 auto 18px}
.gate h1{font-size:17px;text-align:center;margin-bottom:4px}
.gate .sub{text-align:center;color:var(--muted);font-size:12.5px;margin:0 0 20px}
.gate .foot{margin-top:16px;text-align:center;font-size:11.5px;color:var(--muted-2);line-height:1.6}

.field{display:block;margin-bottom:12px}
.field>label,.lbl{display:block;font-size:12px;font-weight:600;color:var(--ink-3);margin-bottom:5px}
.hint{font-size:12px;color:var(--muted);margin-top:4px;line-height:1.5}
input[type=text],input[type=password],input[type=date],select,textarea{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:var(--radius);background:#fff;min-height:36px}
textarea{resize:vertical}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.err-txt{color:var(--bad);font-size:12.5px;min-height:18px;margin-bottom:8px}
fieldset{border:1px solid var(--line);border-radius:var(--radius);padding:10px 12px 4px;margin:0 0 14px}
legend{font-size:12px;font-weight:700;padding:0 6px;color:var(--ink-3)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid transparent;border-radius:var(--radius);padding:8px 14px;font-weight:600;min-height:36px;white-space:nowrap}
.btn-primary{background:var(--red);color:#fff}.btn-primary:hover{background:var(--red-d)}
.btn-ghost{background:#fff;border-color:var(--line);color:var(--ink)}.btn-ghost:hover{background:var(--surface)}
.btn-quiet{background:transparent;color:var(--muted)}.btn-quiet:hover{color:var(--ink)}
.btn-danger{background:#fff;border-color:#E9B4B0;color:var(--bad)}.btn-danger:hover{background:var(--bad-bg)}
.btn-sm{padding:4px 10px;min-height:28px;font-size:12.5px}
.btn-block{display:flex;width:100%}
.btn:disabled{opacity:.55;cursor:default}

.top{background:var(--ink);color:#fff;display:flex;align-items:center;gap:14px;padding:10px 20px;position:sticky;top:0;z-index:20}
.top img{height:30px;background:#fff;border-radius:4px;padding:2px 6px}
.top .ttl{font-weight:600;font-size:14.5px}
.top .sp{flex:1}
.top .who{font-size:12.5px;color:#C9CDD6}
.top a.btn{text-decoration:none;display:inline-flex;align-items:center}
.top .btn{background:transparent;border-color:#474C58;color:#fff}.top .btn:hover{background:#262A32}
main{max-width:1180px;margin:0 auto;padding:22px 18px 60px}
.phead{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.phead h1{font-size:21px}.psub{color:var(--muted);margin:2px 0 0;font-size:13px}
.pact{display:flex;gap:8px;flex-wrap:wrap}
.crumb{font-size:12.5px;margin-bottom:8px}

.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);margin-bottom:16px}
.card-h{padding:12px 16px;border-bottom:1px solid var(--line-s);display:flex;justify-content:space-between;align-items:center;gap:10px}
.card-h h2{font-size:14.5px}
.card-b{padding:14px 16px}.card-b.tight{padding:0;overflow-x:auto}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.03em;color:var(--muted);font-weight:600;padding:9px 12px;border-bottom:1px solid var(--line);background:#FAFAFB;white-space:nowrap}
.tbl td{padding:9px 12px;border-bottom:1px solid var(--line-s);vertical-align:middle}
.tbl tr.clk{cursor:pointer}.tbl tr.clk:hover td{background:#FAFAFB}
.tbl tr:last-child td{border-bottom:0}
.empty{padding:30px 16px;text-align:center;color:var(--muted)}

.firms{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.firm{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:16px;cursor:pointer;text-align:left;display:block;width:100%}
.firm:hover{border-color:var(--red);box-shadow:0 4px 14px rgba(16,18,24,.08)}
.firm h3{font-size:14.5px;margin-bottom:4px}
.firm .m{color:var(--muted);font-size:12.5px}
.firm .row{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}

.tag{display:inline-block;padding:1px 8px;border-radius:99px;font-size:11.5px;font-weight:600;background:var(--surface-2);color:var(--ink-3);white-space:nowrap}
.tag.ok{background:var(--ok-bg);color:var(--ok)}.tag.warn{background:var(--warn-bg);color:var(--warn)}.tag.bad{background:var(--bad-bg);color:var(--bad)}.tag.red{background:var(--red-l);color:var(--red-d)}
.tag+.tag{margin-left:4px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.stat{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px}
.stat b{display:block;font-size:22px}.stat span{font-size:12px;color:var(--muted)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:16px;overflow-x:auto}
.tab{background:none;border:0;border-bottom:2px solid transparent;padding:9px 14px;font-weight:600;color:var(--muted);white-space:nowrap}
.tab.on{color:var(--red);border-bottom-color:var(--red)}
.search{max-width:320px}
.small{font-size:12px;color:var(--muted)}
.list-line{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line-s)}
.list-line:last-child{border-bottom:0}
.chk{display:flex;align-items:center;gap:8px;margin:0 0 8px;font-weight:500}
.chk input{width:auto;min-height:0}
.note{background:var(--warn-bg);color:var(--warn);border-radius:var(--radius);padding:9px 12px;font-size:12.5px;margin-bottom:14px}

.ov{position:fixed;inset:0;background:rgba(16,18,24,.55);display:flex;align-items:flex-start;justify-content:center;padding:30px 14px;overflow:auto;z-index:50}
.md{background:#fff;border-radius:10px;width:100%;max-width:560px;box-shadow:var(--shadow)}
.md.wide{max-width:860px}
.md-h{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
.md-h h2{font-size:16px}
.md-b{padding:16px 18px}
.md-f{padding:12px 18px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px}
.x{background:none;border:0;font-size:22px;line-height:1;color:var(--muted);padding:0 4px}
#toast{position:fixed;right:16px;bottom:16px;display:flex;flex-direction:column;gap:8px;z-index:90}
.toast{background:var(--ink);color:#fff;padding:10px 14px;border-radius:var(--radius);font-size:13px;max-width:360px;box-shadow:var(--shadow)}
.toast.ok{background:var(--ok)}.toast.err{background:var(--bad)}
.boot{display:flex;align-items:center;justify-content:center;gap:10px;height:100%;color:var(--muted)}
.spin{width:16px;height:16px;border:2px solid rgba(0,0,0,.15);border-top-color:var(--red);border-radius:50%;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}@media (max-width:640px){.tiles{grid-template-columns:repeat(2,1fr)}}
.tile{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:12px;text-align:left;cursor:pointer;display:block;width:100%;font:inherit}
.tile:hover{border-color:var(--red);box-shadow:0 4px 14px rgba(16,18,24,.08)}
.tile b{display:block;font-size:13.5px;margin-bottom:4px}.tile .n{display:block;font-size:22px;font-weight:700;line-height:1.2}.tile .s{display:block;font-size:12px;color:var(--muted);margin-top:4px}
.pback{margin:0 0 12px;display:flex;align-items:center;gap:10px}.pback h3{font-size:15px}
.nav{display:flex;gap:4px;margin-left:8px}.nav button{background:transparent;border:0;color:#C9CDD6;padding:6px 12px;border-radius:6px;font-weight:600;cursor:pointer;font:inherit}.nav button.on{background:#262A32;color:#fff}
.stat.clk{cursor:pointer;text-align:left;width:100%;font:inherit}.stat.clk:hover{border-color:var(--red)}
@media (max-width:640px){.grid2{grid-template-columns:1fr}.top .who{display:none}}
</style>
</head>

<script>

  function bugun() { var d = new Date(); return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2); }
  function trT(iso) { var p = String(iso || '').split('-'); return p.length === 3 ? p[2] + '.' + p[1] + '.' + p[0] : (iso || ''); }

  /* ---- personel oluştur / düzenle ---- */
  function kmpBelgeBolum(p) {
    var var_ = {}; (p.belgeler || []).forEach(function (b) { var_[b.tur] = (var_[b.tur] || 0) + 1; });
    var h = '<div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px">' + KMP_BELGELER.map(function (t) { return '<span class="tag ' + (var_[t] ? 'ok' : 'bad') + '">' + (var_[t] ? '✔ ' : '✖ ') + esc(t) + '</span>'; }).join('') + '</div>';
    var l = (p.belgeler || []).slice().sort(function (a, b) { return KMP_BELGELER.indexOf(a.tur) - KMP_BELGELER.indexOf(b.tur) || String(b.tarih || '').localeCompare(String(a.tarih || '')); });
    h += l.length ? l.map(function (b) {
      return '<div class="list-line"><span><strong>' + esc(b.tur) + '</strong>' + (b.tarih ? ' · ' + trT(b.tarih) : '') + ' <span class="small">' + esc(b.dosya && b.dosya.ad || '') + (b.aciklama ? ' · ' + esc(b.aciklama) : '') + '</span></span><span>' +

    }).join('') : '<p class="small" style="margin-top:0">Henüz evrak yüklenmedi.</p>';

      '<div class="field"><label>Belge tarihi</label><input type="date" id="kb_t"></div></div>' +
      '<div class="field"><label>Açıklama (isteğe bağlı)</label><input type="text" id="kb_a" placeholder="Ör. Lisans diploması"></div>' +
      '<div class="field"><label>Dosya (PDF / görsel / Word, en fazla 8 MB) *</label><input type="file" id="kb_f" accept=".pdf,image/*,.doc,.docx"></div><button class="btn btn-ghost btn-sm" id="kb_ekle" style="margin-bottom:10px">Evrakı yükle</button>';

  function kmpDosyaYukle(pid, file) {

  function kmpDosyaKontrol(file) {

  }

      '<fieldset><legend>Acil durumda ilk ulaşılacak kişi</legend><div class="field"><label>Adı soyadı</label><input type="text" id="k_aad" value="' + esc(a.ad || '') + '"></div>' +

      kapandi: function () { if (App.ana === 'kmp' && !App.firma) viewKmp(); },

        if (!v.ad || !v.soyad) return hataGoster(ov, 'Ad ve soyad girin.');
        if (!v.gorev) return hataGoster(ov, 'Görevini girin.');
        if (!/^\d{11}$/.test(v.tc)) return hataGoster(ov, 'TC kimlik no 11 haneli rakamlardan oluşmalıdır.');

  /* OSGB'den okunan kayıtların bu firmayla ve personel listesiyle nasıl eşleştiğini gösterir */
  function osgbKisileri(f) {
    var S = App.src, harita = {}, sirali = [];
    function kayit(ad, gorev) { var k = adTokenAnahtar(ad); if (!k) return null; if (!harita[k]) { harita[k] = { ad: String(ad).trim().replace(/\s+/g, ' '), gorev: gorev || '', eg: 0, sg: 0 }; sirali.push(harita[k]); } if (!harita[k].gorev && gorev) harita[k].gorev = String(gorev).trim(); return harita[k]; }
    var say = { oturum: 0, gecmis: 0, saglik: 0 };
    S.oturum.forEach(function (o) { if (!firmaEsit(f, o.firmaId, o.digerFirmaAdi)) return; say.oturum++; (o.katilimcilar || []).forEach(function (k) { var r = kayit(k.adSoyad, k.gorev); if (r) r.eg++; }); });
    S.gecmis.forEach(function (b) { (b.satirlar || []).forEach(function (s) { if (!firmaEsit(f, s.firmaId, s.firmaAdi)) return; say.gecmis++; var r = kayit(s.adSoyad, s.gorev); if (r) r.eg++; }); });
    S.saglik.forEach(function (x) { if (!firmaEsit(f, x.firmaId, x.firmaAdi)) return; say.saglik++; var r = kayit(x.c && x.c.adSoyad, ''); if (r) r.sg++; });
    sirali.sort(function (a, b) { return a.ad.localeCompare(b.ad, 'tr'); });
    return { sirali: sirali, say: say };
  }

      ((opt && opt.ayrilacak) || []).forEach(function (a) { var q = doc.personel.filter(function (x) { return x.id === a.id; })[0]; if (q && !q.ayrildi) { q.ayrildi = true; q.ayrilmaTarihi = bugun(); q.ayrilmaNedeni = 'Güncel personel listesinde yok'; } });
      doc.guncelleme = new Date().toISOString(); return doc;
    }, 'Personel Yönetimi: toplu personel yüklemesi').then(function (doc) { App.personel[fid] = doc; return doc; });
  }

  /* ================= başlangıç ================= */
  function baslat() {
    CFG = CFG || cfgOku();
    if (!cfgGecerli(CFG)) { ekranKurulum(); return; }
    SRC = CFG.src; DST = CFG.dst;
    var ku = null; try { ku = sessionStorage.getItem('karma_pys:oturum'); } catch (e) { }
    if (!ku) { ekranGiris(); return; }
    yukleniyor('Oturum açılıyor…');
    srcDoc('users/' + ku).then(function (u) {
      if (u && u.aktif !== false) { App.kullanici = { kullanici: u.kullanici || ku, adSoyad: u.adSoyad, rol: u.rol }; veriYukle(); } else ekranGiris();
    }).catch(function (e) { ekranGiris('Bağlantı hatası: ' + e.message); });
  }
  baslat();
})();
</script>
