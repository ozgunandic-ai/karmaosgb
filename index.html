    $('#kEkle').addEventListener('click', function () { o.katilimcilar.push({ adSoyad: '', gorev: '' }); kirlet(); yeniden(); });

    $('#oKaydet').addEventListener('click', function () { oturumKaydet(true); });
    $('#oTutanak').addEventListener('click', function () { oturumTutanakIndir(); });
    var ob = $('#oBelge'); if (ob) ob.addEventListener('click', function () { oturumBelgeIndir(); });
  }

  /* ---- belge üretimi ---- */
  function oturumDogrula(o, belge) {
    var temel = o.egitimTuru === 'temel';
    if (!oturumFirmaUnvan(o)) { toast('Önce firmayı seçin (veya firma adını girin)', 'err'); return false; }
    if (!o.tarih1) { toast('Eğitim tarihini seçin', 'err'); return false; }
    if (!o.katilimcilar.some(function (k) { return k.adSoyad && k.adSoyad.trim(); })) { toast('En az bir katılımcı girin', 'err'); return false; }
    if (temel) {
      var th = oturumTehlike(o), hedef = OZGU_HEDEF_DK[th], top = oturumOzguToplam(o);
      if (top !== hedef && !confirm('4. bölümdeki konuların toplam süresi ' + top + ' dk; ' + th + ' sınıf için ' + hedef + ' dk olmalıdır. Yine de devam edilsin mi?')) return false;
    }
    return true;
  }

  function oturumKatilimcilari(o) {
    var sirket = oturumFirmaKisa(o);
    return o.katilimcilar.filter(function (k) { return k.adSoyad && k.adSoyad.trim(); })
      .map(function (k) { return { adSoyad: k.adSoyad.trim(), gorev: (k.gorev || '').trim(), sirket: sirket }; });
  }

  function oturumKonuCikti(o) {
    var k = o.konular;
    function ayni(l) { return l.map(function (x) { return { ad: x.ad, dk: x.dk, tikli: !!x.tikli }; }); }
    function secili(l) { return l.filter(function (x) { return x.tikli && x.ad && x.ad.trim(); }).map(function (x) { return { ad: x.ad.trim(), dk: x.dk, tikli: true }; }); }
    return { genel: ayni(k.genel), saglik: ayni(k.saglik), teknik: ayni(k.teknik), ozguA: secili(k.ozguA), ozguB: secili(k.ozguB) };
  }

  function oturumDosyaAdi(o, tur) {
    return slug(oturumFirmaKisa(o) || 'egitim') + '_' + tur + '_' + (o.tarih1 || bugun()) + '.docx';
  }

  function oturumTutanakIndir() {
    var o = App.oturum; if (!oturumDogrula(o)) return;
    var temel = o.egitimTuru === 'temel';
    var bytes = window.KarmaGen.buildKatilimTutanagiDocx({
      firmaUnvan: oturumFirmaUnvan(o), tehlikeSinifi: oturumTehlike(o),
      uzmanAdi: o.uzmanAdi, uzmanUnvan: o.uzmanUnvan, hekimAdi: o.hekimAdi, hekimUnvan: o.hekimUnvan,
      egitimYeri: o.egitimYeri, egitimTarihMetni: oturumTarihMetni(o), egitimSuresi: o.egitimSuresi,
      egitimTuru: o.egitimTuru, digerEgitimAdi: o.digerEgitimAdi,
      konular: temel ? oturumKonuCikti(o) : null, katilimcilar: oturumKatilimcilari(o)
    }, LOGO_BYTES);
    dosyaVer(oturumDosyaAdi(o, 'Egitim_Katilim_Tutanagi'), bytes);
    oturumKaydet(false).catch(function () { });
  }

  function oturumBelgeIndir(tekIndex) {
    var o = App.oturum; if (!oturumDogrula(o, true)) return;
    var th = oturumTehlike(o), f = oturumFirma(o);
    var hepsi = oturumKatilimcilari(o).map(function (k) { return { adSoyad: k.adSoyad, gorev: k.gorev }; });
    var secilen = hepsi;
    if (tekIndex !== undefined) {
      var kisi = o.katilimcilar[tekIndex];
      if (!kisi || !kisi.adSoyad || !kisi.adSoyad.trim()) { toast('Bu satırda ad soyad yok', 'err'); return; }
      secilen = [{ adSoyad: kisi.adSoyad.trim(), gorev: (kisi.gorev || '').trim() }];
    }
    var belgeler;
    try {
      belgeler = window.KarmaGen.buildTemelBelgeler({
        firmaUnvanTam: oturumFirmaUnvan(o),
        uzmanAdi: o.uzmanAdi, uzmanUnvan: o.uzmanUnvan, hekimAdi: o.hekimAdi, hekimUnvan: o.hekimUnvan,
        isverenAdi: (!oturumDiger(o) && f && f.isveren) ? f.isveren : '',
        egitimTarihleriCümle: oturumTarihCumlesi(o),
        belgeTarihi: o.belgeTarihi ? o.belgeTarihi.split('-').reverse().join('/') : '',
        egitimSuresiSaat: BELGE_SURE_SAAT[th] + ' saat',
        egitimTuru: o.turu, sekli: o.sekli,
        konular: oturumKonuCikti(o), katilimcilar: secilen
      });
    } catch (e) { toast('Belge hazırlanamadı: ' + (e && e.message || e), 'err'); return; }

    if (belgeler.length === 1) {
      dosyaVer(slug(belgeler[0].ad || 'belge') + '_Temel_Egitim_Belgesi.docx', belgeler[0].bytes);
    } else {
      var kullanilan = {};
      var dosyalar = belgeler.map(function (b, i) {
        var ad = slug(b.ad || ('kisi_' + (i + 1)));
        kullanilan[ad] = (kullanilan[ad] || 0) + 1;
        var sira = ('0' + (i + 1)).slice(-2);
        return { name: sira + '_' + ad + (kullanilan[ad] > 1 ? '_' + kullanilan[ad] : '') + '_Temel_Egitim_Belgesi.docx', data: b.bytes };
      });
      dosyaVer(slug(oturumFirmaKisa(o) || 'egitim') + '_Temel_Egitim_Belgeleri_' + (o.tarih1 || bugun()) + '.zip', window.KarmaGen.buildZip(dosyalar));
    }
    oturumKaydet(false).catch(function () { });
  }

  /* ==========================================================================
     PLAN EDİTÖRÜ
     ========================================================================== */
  function renderPlan() {
    var p = App.plan;
    if (!p || p.id !== App.route.id) {
      p = App.planlar.find(function (x) { return x._id === App.route.id; });
      if (!p) { git({ ad: 'planlar' }); return; }
      if (!firmayaErisimVarMi(p.firmaId)) {
        App.plan = null;
        renderKabuk('<div class="card"><div class="empty"><h3>Bu plana erişiminiz yok</h3>' +
          '<p>Bu işyerini görüntülemek için bir yönetici tarafından atanmanız gerekiyor.</p>' +
          '<button class="btn btn-primary" data-goto="planlar">Planlara dön</button></div></div>');
        return;
      }
      App.plan = p = planTamamla(JSON.parse(JSON.stringify(p)));
      App.aktifBolum = 0; App.kirli = false;
    }
    App.planFirma = App.firmalar.find(function (x) { return x._id === p.firmaId; }) || {};
    var f = App.planFirma;

    var idx = '<button id="hizliBtn" class="hizli-btn">' +
      '<span class="n">⚡</span><span>HIZLI ÖN İZLEME</span></button>' +
      KATALOG.map(function (g, i) {
        return '<button data-bolum="' + i + '" class="' + (i === App.aktifBolum ? 'on' : '') + '">' +
          '<span class="n">' + g.no + '</span><span>' + esc(g.ad) + '</span></button>';
      }).join('');

    var html = '<div class="crumb"><button data-goto="firmalar">Firmalar</button> › ' +
      '<button data-goto="firma" data-id="' + esc(p.firmaId) + '">' + esc(f.unvan || 'Firma') + '</button> › ' + esc(p.yil) + ' planı</div>' +
      '<div class="phead"><div><h1>' + esc(p.yil) + ' Yıllık İSG Çalışma Planı</h1>' +
      '<p class="psub">' + esc(f.unvan || '') + ' · ' + esc(f.tehlike || '') + ' · İSG uzmanı: ' + esc(f.uzman || '—') + '</p></div></div>' +
      imzaliPlanKarti(p) +
      '<div class="plan"><div class="plan-idx">' + idx + '</div><div class="plan-body" id="planBody"></div></div>' +
      '<div class="savebar"><span class="sb-info" id="sbInfo">Tüm değişiklikler kaydedilmeye hazır</span>' +
      '<span class="sb-space"></span>' +
      '<button class="btn btn-ghost" id="btnOnizle">Önizle</button>' +
      '<button class="btn btn-dark" id="btnKaydet">Kaydet</button>' +
      '<button class="btn btn-primary" id="btnExcel">Excel planını indir</button></div>';

    renderKabuk(html);
    bolumCiz();

    $$('[data-bolum]').forEach(function (b) {
      b.addEventListener('click', function () { App.aktifBolum = +b.getAttribute('data-bolum'); renderPlan(); });
    });
    $('#hizliBtn').addEventListener('click', hizliTamEkranAc);
    $('#btnKaydet').addEventListener('click', function () { planKaydet(true); });
    $('#btnExcel').addEventListener('click', function () {
      // Excel dosyası her zaman anında, mevcut ekran verisinden üretilir —
      // arka plandaki GitHub kaydı yavaş veya geçici olarak başarısız olsa
      // bile indirme bundan etkilenmez. Kayıt ayrıca, bağımsız olarak denenir.
      excelIndir();
      planKaydet(false).catch(function () { /* hata zaten toast ile gösterildi */ });
    });
    $('#btnOnizle').addEventListener('click', onizle);
    bindImzaliPlanKarti(p);
  }

  function imzaliPlanKarti(p) {
    var ip = p.imzaliPlan;
    return '<div class="card"><div class="card-h"><h2>İmzalı Yıllık İSG Planı</h2>' +
      '<span class="ch-sub">Excel planını yazdırıp ilgili kişilere imzalattıktan sonra taranmış PDF’i buraya yükleyin</span></div>' +
      '<div class="card-b" style="display:flex;align-items:center;gap:14px;flex-wrap:wrap">' +
      (ip ?
        '<div style="flex:1;min-width:220px"><span class="tag tag-ok">Yüklendi</span> ' +
        '<strong style="margin-left:6px">' + esc(ip.ad) + '</strong>' +
        '<div class="hint" style="margin-top:4px">' + Math.round((ip.boyut || 0) / 1024) + ' KB · ' + esc(ip.yukleyen || '') + ' tarafından ' + esc(trTarih((ip.yuklenme || '').slice(0, 10))) + ' tarihinde yüklendi</div></div>' +
        '<button class="btn btn-ghost btn-sm" data-pdfgor="' + esc(p.id) + '">Görüntüle</button>' +
        '<label class="btn btn-ghost btn-sm" style="cursor:pointer">Değiştir<input type="file" accept="application/pdf" style="display:none" id="ipDegistir"></label>' +
        '<button class="btn btn-danger btn-sm" id="ipKaldir">Kaldır</button>'
        :
        '<div style="flex:1;min-width:220px"><span class="tag">Henüz yüklenmedi</span>' +
        '<div class="hint" style="margin-top:4px">Yalnızca PDF, en fazla 8 MB.</div></div>' +
        '<label class="btn btn-dark btn-sm" style="cursor:pointer">İmzalı PDF yükle<input type="file" accept="application/pdf" style="display:none" id="ipYukle"></label>'
      ) +
      '</div></div>';
  }

  function bindImzaliPlanKarti(p) {
    var yu = $('#ipYukle'), de = $('#ipDegistir'), ka = $('#ipKaldir');
    function yukleOlay(inp) {
      inp.addEventListener('change', function () {
        var dosya = inp.files[0]; if (!dosya) return;
        imzaliPlanYukle(p.id, dosya, function () { renderPlan(); });
      });
    }
    if (yu) yukleOlay(yu);
    if (de) yukleOlay(de);
    if (ka) ka.addEventListener('click', function () { imzaliPlanKaldir(p.id, function () { renderPlan(); }); });
  }

  function kirlet() {
    App.kirli = true;
    ['#sbInfo', '#eSbInfo', '#oSbInfo'].forEach(function (sel) {
      var s = $(sel); if (s) { s.textContent = 'Kaydedilmemiş değişiklikler var'; s.style.color = 'var(--red)'; }
    });
  }

  var kaydetSirasi = Promise.resolve();
  function planKaydet(bildir) {
    // Art arda gelen kayıt istekleri (ör. "Kaydet"e basıp hemen ardından
    // "Excel indir"e basmak) aynı anda GitHub'a gidip "sha" çakışmasına yol
    // açmasın diye tek bir kuyrukta sırayla işlenir.
    var sonuc = kaydetSirasi.then(function () { return planKaydetGercek(bildir); });
    kaydetSirasi = sonuc.catch(function () { }); // bir kayıt başarısız olsa da kuyruk tıkanmasın
    return sonuc;
  }

  function planKaydetGercek(bildir) {
    var p = App.plan;
    p.guncelleme = new Date().toISOString();
    kaydediliyorGoster(true);
    return Store.set('planlar/' + p.id, p).then(function () {
      var i = App.planlar.findIndex(function (x) { return x._id === p.id; });
      var kopya = JSON.parse(JSON.stringify(p)); kopya._id = p.id;
      if (i >= 0) App.planlar[i] = kopya; else App.planlar.push(kopya);
      App.kirli = false;
      var s = $('#sbInfo'); if (s) { s.textContent = 'Kaydedildi · ' + new Date().toLocaleTimeString('tr-TR').slice(0, 5); s.style.color = ''; }
      if (bildir) toast('Plan kaydedildi', 'ok');
    }).catch(function (e) {
      toast('Kaydedilemedi (verileriniz ekranda duruyor, kaybolmadı): ' + (e && e.message || e), 'err', {
        etiket: 'Tekrar dene',
        tikla: function () { planKaydet(bildir); }
      });
      throw e;
    }).then(function (v) { kaydediliyorGoster(false); return v; }, function (e) { kaydediliyorGoster(false); throw e; });
  }

  function kaydediliyorGoster(basladi) {
    ['#btnKaydet', '#btnExcel'].forEach(function (sel) {
      var b = $(sel); if (b) b.disabled = basladi;
    });
    var s = $('#sbInfo');
    if (s && basladi) { s.textContent = 'Kaydediliyor…'; s.style.color = ''; }
  }

  /* ---- bölüm çizimi ---- */
  function bolumCiz() {
    var p = App.plan;
    var g = KATALOG[App.aktifBolum];
    var h = '<div class="sect"><div class="sect-h"><span class="sect-n">' + g.no + '</span><h3>' + esc(g.ad) + '</h3></div>';

    if (g.key === 'kurul') h += kurulHtml(p);

    h += g.faaliyetler.map(function (a) {
      if (a.tip === 'kurul_olusturma') return actWrap(a, kurulOlusturmaHtml(p));
      if (a.tip === 'kurul_egitim') return actWrap(a, kurulEgitimHtml(p));
      if (a.tip === 'kurul_toplanti') return actWrap(a, kurulToplantiHtml(p));
      if (a.tip === 'atama') return actWrap(a, atamaHtml(a, p));
      if (a.tip === 'mevzuat') return actWrap(a, mevzuatHtml(a, p));
      if (a.tip === 'secim') return actWrap(a, secimHtml(a, p));
      return actWrap(a, periyodikHtml(a, p));
    }).join('');

    h += '</div>';
    $('#planBody').innerHTML = h;
    bindBolum();
  }

  /* ==========================================================================
     HIZLI ÖN İZLEME — tüm plan tek sayfada, doğrudan tıklanabilir
     ========================================================================== */
  function hizliSatirBilgisi(a, p) {
    var st = p.faaliyetler[a.id];
    if (a.tip === 'kurul_olusturma') {
      if (p.altmis === 'evet') return { not: 'ÇALIŞAN SAYISI 50 KİŞİNİN ALTINDA OLDUĞUNDAN DOLAYI İSG KURULU OLUŞTURULMASINA GEREK BULUNMAMAKTADIR.', editable: false };
      if (p.kurulIlkKez === 'evet') {
        var s = bos48(); if (yilOf(p.kurulAtamaTarihi) === +p.yil) tarihIsaretle(s, p.kurulAtamaTarihi);
        return { secili: s, editable: false };
      }
      if (p.kurulIlkKez === 'hayir') {
        if (!p.faaliyetler.k_olusturma_manuel) p.faaliyetler.k_olusturma_manuel = { secili: bos48() };
        return { secili: p.faaliyetler.k_olusturma_manuel.secili, editable: true, id: 'k_olusturma_manuel' };
      }
      return { secili: bos48(), editable: false, uyari: true };
    }
    if (a.tip === 'kurul_egitim') {
      var se = bos48();
      if (p.altmis !== 'evet' && p.kurulEgitim === 'evet') se[(+p.kurulEgitimAy || 0) * 4 + ((+p.kurulEgitimHafta || 1) - 1)] = true;
      return { secili: se, editable: false };
    }
    if (a.tip === 'kurul_toplanti') return { secili: kurulToplantiSecili(p), editable: false };
    if (a.tip === 'atama') {
      if (st.buYil === 'evet') return { secili: st.secili || bos48(), editable: false };
      if (st.buYil === 'hayir' && st.disTarih) return { not: atamaNotMetni(a, st), editable: false };
      return { secili: bos48(), editable: false, uyari: !st.buYil };
    }
    if (a.tip === 'mevzuat' || a.tip === 'secim') {
      if (st.gecerli === 'evet' && st.tarih) return { not: (a.tip === 'mevzuat' ? mevzuatMetni(a, st) : secimMetni(a, st, p)), editable: false };
      return { secili: st.secili || bos48(), editable: false, uyari: !st.gecerli };
    }
    return { secili: st.secili || bos48(), editable: true, id: a.id };
  }

  function bindHizli(kapsam) {
    var p = App.plan, boya = null;

      var id = td.getAttribute('data-hz'), i = +td.getAttribute('data-i');
      var st = p.faaliyetler[id]; if (!st) return;
      if (!st.secili || st.secili.length !== 48) st.secili = bos48();

      td.classList.toggle('on', on);

    $$('.hz-hafta.ed', kapsam).forEach(function (td) {

      });
      td.addEventListener('pointerover', function () {
        if (boya === null) return;
        guncelleGoster(td, boya);
      });
    });
    document.addEventListener('pointerup', function () { boya = null; }, { once: false });
    $$('[data-git]', kapsam).forEach(function (b) {

      '<div class="hz-ovb">' + hizliTabloIcerik(p) + '</div>';

      ov.remove();

      planKaydet(false);

  function tarih3Bagla(kutu) {

      var iso = (g && a !== '' && y) ? (y + '-' + ('0' + (+a + 1)).slice(-2) + '-' + ('0' + g).slice(-2)) : '';
      var oncekiDoluMuydu = !!hid.value;
      hid.value = iso;

      if (iso !== '' || oncekiDoluMuydu) hid.dispatchEvent(new Event('change', { bubbles: true }));

          }
          if (pr[2] === 'tarih' && st.gecerli === undefined) {
            // yıllık periyodik: tarih girildiyse işaretle
            st.secili = bos48(); tarihIsaretle(st.secili, v);
          }
          if (pr[2] === 'planTarih') { st.secili = bos48(); if (yilOf(v) === +p.yil) tarihIsaretle(st.secili, v); }

          p[k] = v;

    // ızgara
    $$('[data-grid]', body).forEach(function (g) {
      if (g.classList.contains('ro')) return;

        var st = p.faaliyetler[id]; if (!st) { st = p.faaliyetler[id] = { secili: bos48() }; }

        setIdx(+b.getAttribute('data-i'), boya); kirlet();

      g.addEventListener('pointerover', function (e) {
        if (boya === null) return;
        var b = e.target.closest('button[data-i]'); if (!b) return;
        setIdx(+b.getAttribute('data-i'), boya);

    var kw = $('#btnKurulWord', body);
    if (kw) kw.addEventListener('click', kurulWordIndir);

  /* ==========================================================================
     ÇIKTI ÜRETİMİ
     ========================================================================== */
  function planSatirlari(p) {
    var gruplar = [];
    KATALOG.forEach(function (g) {
      var fa = [];
      g.faaliyetler.forEach(function (a) {
        var st = p.faaliyetler[a.id] || {};
        if (a.tip === 'kurul_olusturma') {
          if (p.altmis === 'evet') {
            fa.push({ ad: a.ad, not: 'ÇALIŞAN SAYISI 50 KİŞİNİN ALTINDA OLDUĞUNDAN DOLAYI İSG KURULU OLUŞTURULMASINA GEREK BULUNMAMAKTADIR.' });
          } else if (p.kurulIlkKez === 'evet') {
            var s = bos48(); if (yilOf(p.kurulAtamaTarihi) === +p.yil) tarihIsaretle(s, p.kurulAtamaTarihi);
            fa.push({ ad: a.ad, hafta: s });
          } else {
            var mn = p.faaliyetler.k_olusturma_manuel;
            fa.push({ ad: a.ad, hafta: mn ? mn.secili : bos48() });
          }
        } else if (a.tip === 'kurul_egitim') {
          var se = bos48();
          if (p.altmis !== 'evet' && p.kurulEgitim === 'evet') se[(+p.kurulEgitimAy || 0) * 4 + ((+p.kurulEgitimHafta || 1) - 1)] = true;
          fa.push({ ad: a.ad, hafta: se });
        } else if (a.tip === 'kurul_toplanti') {
          fa.push({ ad: a.ad, hafta: kurulToplantiSecili(p) });
        } else if (a.tip === 'mevzuat' || a.tip === 'secim') {
          if (st.gecerli === 'evet' && st.tarih) fa.push({ ad: a.ad, not: (a.tip === 'mevzuat' ? mevzuatMetni(a, st) : secimMetni(a, st, p)) });
          else fa.push({ ad: a.ad, hafta: st.secili || bos48() });
        } else if (a.tip === 'atama') {
          if (st.buYil === 'hayir' && st.disTarih) fa.push({ ad: a.ad, not: atamaNotMetni(a, st) });
          else fa.push({ ad: a.ad, hafta: st.secili || bos48() });
        } else {
          fa.push({ ad: a.ad, hafta: st.secili || bos48() });
        }
      });
      gruplar.push({ ad: g.ad, faaliyetler: fa });
    });
    return gruplar;
  }

  function dosyaVer(ad, bytes) {
    var blob = new Blob([bytes], { type: 'application/octet-stream' });
    function yedek() {
      var url = URL.createObjectURL(blob), a = document.createElement('a');
      a.href = url; a.download = ad; document.body.appendChild(a); a.click();
      setTimeout(function () { URL.revokeObjectURL(url); a.remove(); }, 1500);
      return true;
    }
    if (App.downloads === undefined && window.claude && typeof window.claude.use === 'function') {
      return window.claude.use('downloads').then(function (d) {
        App.downloads = d || null;
        return App.downloads ? App.downloads.save({ filename: ad, data: blob }).then(function () { toast('Dosya indirildi', 'ok'); })
          .catch(function (e) { if (e && e.code === 'declined') return; yedek(); }) : yedek();
      }).catch(yedek);
    }
    if (App.downloads) {
      return App.downloads.save({ filename: ad, data: blob }).then(function () { toast('Dosya indirildi', 'ok'); })
        .catch(function (e) { if (!(e && e.code === 'declined')) yedek(); });
    }
    yedek(); return Promise.resolve();
  }

  /* ---- imzalı plan (taranmış PDF) yükleme/görüntüleme ---- */
  var PDF_MAX = 8 * 1024 * 1024; // 8 MB

  function dosyaB64Oku(dosya) {
    return new Promise(function (resolve, reject) {
      var r = new FileReader();
      r.onload = function () { resolve(String(r.result).split(',')[1] || ''); };
      r.onerror = function () { reject(new Error('Dosya okunamadı')); };
      r.readAsDataURL(dosya);
    });
  }

  function imzaliPlanYukle(planId, dosya, sonra) {
    if (dosya.type !== 'application/pdf' && !/\.pdf$/i.test(dosya.name)) {
      toast('Yalnızca PDF dosyası yükleyebilirsiniz', 'err'); return;
    }
    if (dosya.size > PDF_MAX) {
      toast('Dosya çok büyük (maks. 8 MB). Daha düşük çözünürlükte tarayın veya sıkıştırın.', 'err'); return;
    }
    toast('Yükleniyor…');
    dosyaB64Oku(dosya).then(function (b64) {
      return Store.set('planlar_pdf/' + planId, { veri: b64 }).then(function () {
        var bilgi = { ad: dosya.name, boyut: dosya.size, yuklenme: new Date().toISOString(), yukleyen: App.kullanici.adSoyad };
        var p = App.plan && App.plan.id === planId ? App.plan : null;
        if (p) { p.imzaliPlan = bilgi; return planKaydet(false).then(function () { return bilgi; }); }
        // plan editör dışında (firma/plan listesi) — planı ayrıca yükleyip kaydet
        return Store.get('planlar/' + planId).then(function (pl) {
          pl.imzaliPlan = bilgi;
          return Store.set('planlar/' + planId, pl).then(function () {
            var i = App.planlar.findIndex(function (x) { return x._id === planId; });
            var kopya = JSON.parse(JSON.stringify(pl)); kopya._id = planId;
            if (i >= 0) App.planlar[i] = kopya; else App.planlar.push(kopya);
            return bilgi;
          });
        });
      });
    }).then(function () {
      toast('İmzalı plan yüklendi', 'ok');
      if (sonra) sonra();
    }).catch(function (e) { toast('Yüklenemedi: ' + (e && e.message || e), 'err'); });
  }

  function imzaliPlanGoster(planId) {
    toast('Açılıyor…');
    Store.get('planlar_pdf/' + planId).then(function (d) {
      if (!d || !d.veri) { toast('Dosya bulunamadı', 'err'); return; }
      var bin = atob(d.veri), bytes = new Uint8Array(bin.length);
      for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
      var blob = new Blob([bytes], { type: 'application/pdf' });
      var url = URL.createObjectURL(blob);
      window.open(url, '_blank');
      setTimeout(function () { URL.revokeObjectURL(url); }, 60000);
    }).catch(function (e) { toast('Açılamadı: ' + (e && e.message || e), 'err'); });
  }

  function imzaliPlanKaldir(planId, sonra) {
    if (!confirm('Yüklenen imzalı plan silinsin mi?')) return;
    Store.del('planlar_pdf/' + planId).then(function () {
      var p = App.plan && App.plan.id === planId ? App.plan : null;
      if (p) { p.imzaliPlan = null; return planKaydet(false); }
      return Store.get('planlar/' + planId).then(function (pl) {
        pl.imzaliPlan = null;
        return Store.set('planlar/' + planId, pl).then(function () {
          var i = App.planlar.findIndex(function (x) { return x._id === planId; });
          if (i >= 0) { App.planlar[i].imzaliPlan = null; }
        });
      });
    }).then(function () {
      toast('İmzalı plan kaldırıldı', 'ok');
      if (sonra) sonra();
    }).catch(function (e) { toast('Silinemedi: ' + (e && e.message || e), 'err'); });
  }

  /* ==========================================================================
     FİRMA ZİYARET TAKİBİ
     ========================================================================== */
  var GUN_KISA = ['Pzt', 'Sal', 'Çar', 'Per', 'Cum', 'Cmt', 'Paz'];
  var ZAMAN_DILIMLERI = [
    { v: 'sabah', l: 'Öğleden önce' },
    { v: 'ogleden_sonra', l: 'Öğleden sonra' },
    { v: 'tam_gun', l: 'Tüm gün' }
  ];
  var ZIYARET_TEKRAR = [
    { v: '', l: 'Tek seferlik' },
    { v: 'gunluk', l: 'Günlük (her iş günü)' },
    { v: 'haftalik', l: 'Haftalık' },
    { v: 'iki_haftalik', l: '2 haftalık' },
    { v: 'aylik', l: 'Aylık' },
    { v: '2aylik', l: '2 aylık' },
    { v: '3aylik', l: '3 aylık' },
    { v: '6aylik', l: '6 aylık' }
  ];
  function ziyaretTekrarAdi(v) { for (var i = 0; i < ZIYARET_TEKRAR.length; i++) if (ZIYARET_TEKRAR[i].v === v) return ZIYARET_TEKRAR[i].l; return 'Tek seferlik'; }

  function isoTarih(d) { return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2); }
  function haftaIciMi(d) { var g = d.getDay(); return g !== 0 && g !== 6; }
  function ayinHaftaGunu(yil, ayIndex, haftaNo, gun) {
    var ilkGun = new Date(yil, ayIndex, 1), ilkGunHaftasi = ilkGun.getDay();
    var ilkHedef = 1 + ((gun - ilkGunHaftasi + 7) % 7);
    var hedefGun = ilkHedef + (haftaNo - 1) * 7;
    var ayinSonGunu = new Date(yil, ayIndex + 1, 0).getDate();
    if (hedefGun > ayinSonGunu) hedefGun -= 7;
    return new Date(yil, ayIndex, hedefGun);
  }

  /* başlangıç tarihinden itibaren, seçilen tekrar sıklığına göre yıl sonuna kadar
     olan (yalnızca hafta içi) tarihleri üretir */
  function ziyaretTekrarTarihleri(baslangicISO, tekrar, yil) {
    var b = new Date(baslangicISO + 'T00:00:00');
    var sonuc = [];
    if (!tekrar) return [baslangicISO];
    if (tekrar === 'gunluk') {
      var d = new Date(b);
      while (d.getFullYear() === yil) { if (haftaIciMi(d)) sonuc.push(isoTarih(d)); d.setDate(d.getDate() + 1); }
      return sonuc;
    }
    if (tekrar === 'haftalik' || tekrar === 'iki_haftalik') {
      var adim = tekrar === 'haftalik' ? 7 : 14, d2 = new Date(b);
      while (d2.getFullYear() === yil) { if (haftaIciMi(d2)) sonuc.push(isoTarih(d2)); d2.setDate(d2.getDate() + adim); }
      return sonuc;
    }
    var adimAy = { aylik: 1, '2aylik': 2, '3aylik': 3, '6aylik': 6 }[tekrar];
    if (adimAy) {
      var haftaNo = Math.min(4, Math.ceil(b.getDate() / 7)), gun = b.getDay(), ay = b.getMonth();
      while (ay <= 11) {
        var hedef = ayinHaftaGunu(yil, ay, haftaNo, gun);
        if (hedef >= b && haftaIciMi(hedef)) sonuc.push(isoTarih(hedef));
        ay += adimAy;
      }
      return sonuc;
    }
    return [baslangicISO];
  }

  function ziyaretYolu(yil, kullanici) { return 'ziyaret/' + (kullanici || App.kullanici.kullanici) + '/' + yil; }

  /* Yönetici kendine ziyaret planı yapmaz; yalnızca seçtiği kullanıcının planını
     salt okunur görüntüler. Diğer kullanıcılar her zaman kendi takvimini düzenler. */
  function ziyaretDuzenlenebilirMi() { return !yonetimiMi(); }

  function ziyaretKullaniciAdaylari() {
    return App.kullanicilar.filter(function (u) { return u.rol !== 'yonetici'; })
      .sort(function (a, b) { return (a.adSoyad || '').localeCompare(b.adSoyad || '', 'tr'); });
  }

  function ziyaretHedefKullanici() {
    if (!yonetimiMi()) return App.kullanici.kullanici;
    var adaylar = ziyaretKullaniciAdaylari();
    if (App.ziyaretSeciliKullanici && adaylar.some(function (u) { return u.kullanici === App.ziyaretSeciliKullanici; })) return App.ziyaretSeciliKullanici;
    return adaylar.length ? adaylar[0].kullanici : null;
  }

  function kullaniciFirmalari(ku) {
    return App.firmalar.filter(function (f) { return f.uzmanKullanici === ku || f.hekimKullanici === ku; });
  }

  function ziyaretYukle(yil, kullanici) {
    if (App.ziyaretYil === yil && App.ziyaretKullanici === kullanici && App.ziyaret) return Promise.resolve(App.ziyaret);
    return Store.get(ziyaretYolu(yil, kullanici)).then(function (v) {
      App.ziyaret = v || { yil: yil, gunler: {} };
      if (!App.ziyaret.gunler) App.ziyaret.gunler = {};
      App.ziyaretYil = yil;
      App.ziyaretKullanici = kullanici;
      return App.ziyaret;
    });
  }

  function ziyaretKaydet() {
    if (!ziyaretDuzenlenebilirMi()) return Promise.reject(new Error('Bu görünüm yalnızca görüntüleme içindir.'));
    return Store.set(ziyaretYolu(App.ziyaretYil, App.ziyaretKullanici), App.ziyaret);
  }

  function ziyaretGunu(tarihISO) {
    var g = App.ziyaret.gunler;
    if (!g[tarihISO]) g[tarihISO] = { sabah: [], ogleden_sonra: [], tam_gun: [] };
    return g[tarihISO];
  }

  function ziyaretEkle(firmaId, tarihler, zaman, tekrar) {
    var tekrarId = uid('tkr');
    tarihler.forEach(function (t) {
      var gun = ziyaretGunu(t);
      gun[zaman].push({ id: uid('zy'), firmaId: firmaId, tekrar: tekrar, tekrarId: tekrarId, durum: '', olusturan: App.kullanici.kullanici, guncelleme: new Date().toISOString() });
    });
  }

  function ziyaretSil(tarihISO, zaman, girisId) {
    var gun = App.ziyaret.gunler[tarihISO];
    if (!gun) return;
    gun[zaman] = gun[zaman].filter(function (x) { return x.id !== girisId; });
  }

  function ziyaretDurumDegistir(tarihISO, zaman, girisId, yeniDurum) {
    var gun = App.ziyaret.gunler[tarihISO];
    if (!gun) return;
    var giris = gun[zaman].find(function (x) { return x.id === girisId; });
    if (giris) { giris.durum = yeniDurum; giris.guncelleme = new Date().toISOString(); }
  }

  /* ---- ana sayfa ---- */
  function renderZiyaret() {
    var simdi = new Date();
    if (!App.ziyaretAy && App.ziyaretAy !== 0) App.ziyaretAy = simdi.getMonth();
    if (!App.ziyaretYilSec) App.ziyaretYilSec = simdi.getFullYear();
    var hedef = ziyaretHedefKullanici();
    var yuklenenYil = App.ziyaretYilSec;
    if (!hedef) { // yönetici ve henüz görüntülenecek kullanıcı yok
      renderKabuk(viewZiyaret());
      bindZiyaret();
      return;
    }
    ziyaretYukle(yuklenenYil, hedef).then(function () {
      // Yükleme sürerken kullanıcı başka bir sayfaya geçmiş, başka bir yıl ya da
      // (yönetici için) başka bir kullanıcı seçmiş olabilir; bu durumda geç gelen
      // sonucu ekrana uygulamayız.
      if (App.route.ad !== 'ziyaret' || App.ziyaretYilSec !== yuklenenYil || ziyaretHedefKullanici() !== hedef) return;
      renderKabuk(viewZiyaret());
      bindZiyaret();
    });
    renderKabuk('<div class="boot" style="min-height:200px"><div class="spin" style="border-color:rgba(0,0,0,.15);border-top-color:var(--red)"></div><span>Takvim yükleniyor…</span></div>');
  }

  function viewZiyaret() {
    var ay = App.ziyaretAy, yil = App.ziyaretYilSec;
    var yon = yonetimiMi(), duzenlenebilir = ziyaretDuzenlenebilirMi();
    var hedef = ziyaretHedefKullanici();
    var firmalar = hedef ? kullaniciFirmalari(hedef) : [];
    var hedefUye = App.kullanicilar.find(function (u) { return u.kullanici === hedef; });
    var simdikiYil = new Date().getFullYear();
    var yilOpts = ''; for (var yy = simdikiYil - 2; yy <= simdikiYil + 2; yy++) yilOpts += '<option value="' + yy + '"' + (yy === yil ? ' selected' : '') + '>' + yy + '</option>';
    var ayOpts = AYLAR.map(function (a, i) { return '<option value="' + i + '"' + (i === ay ? ' selected' : '') + '>' + a + '</option>'; }).join('');

    var kullaniciSec = '';
    if (yon) {
      kullaniciSec = '<select id="zKul" aria-label="Kullanıcı">' + ziyaretKullaniciAdaylari().map(function (u) {
        return '<option value="' + esc(u.kullanici) + '"' + (u.kullanici === hedef ? ' selected' : '') + '>' + esc(u.adSoyad) + (u.aktif === false ? ' (devre dışı)' : '') + '</option>';
      }).join('') + '</select>';
    }

    var altBaslik = yon
      ? (hedef ? ((hedefUye ? hedefUye.adSoyad : hedef) + ' · ' + firmalar.length + ' atanmış firma · salt okunur görünüm') : 'Görüntülenecek kullanıcı yok')
      : ((firmalar.length ? firmalar.length + ' firma için ziyaret planınız' : 'Size atanmış firma yok') + ' · takvime tıklayarak ziyaret ekleyin.');

    var h = '<div class="phead"><div><h1>Firma Ziyaret Takibi</h1>' +
      '<p class="psub">' + esc(altBaslik) + '</p></div>' +
      '<div class="pact">' + kullaniciSec + '<select id="zAy">' + ayOpts + '</select><select id="zYil">' + yilOpts + '</select></div></div>';

    if (yon && !hedef) {
      return h + '<div class="card"><div class="empty"><h3>Görüntülenecek kullanıcı yok</h3>' +
        '<p>Önce Kullanıcılar sayfasından bir kullanıcı oluşturun ve Firmalar sayfasında onu bir firmaya İş Güvenliği Uzmanı veya İşyeri Hekimi olarak atayın. Ziyaret planlarını kullanıcılar kendi hesaplarından yapar; siz buradan görüntülersiniz.</p></div></div>';
    }

    var veriVar = Object.keys(App.ziyaret.gunler).length > 0;
    if (!firmalar.length && !veriVar) {
      return h + '<div class="card"><div class="empty"><h3>' + (yon ? 'Bu kullanıcıya atanmış firma yok' : 'Ziyaret planlanacak firma yok') + '</h3>' +
        '<p>' + (yon ? 'Kullanıcıyı Firmalar sayfasında bir firmaya İş Güvenliği Uzmanı veya İşyeri Hekimi olarak atayın.' : 'Bir yöneticinin sizi bir firmaya İş Güvenliği Uzmanı veya İşyeri Hekimi olarak ataması gerekiyor.') + '</p></div></div>';
    }

    h += ziyaretOzetHtml(yil) + ziyaretTakvimHtml(ay, yil, firmalar, duzenlenebilir);
    return h;
  }

  function ziyaretOzetHtml(yil) {
    var toplam = 0, gerc = 0, gercDegil = 0, bekliyor = 0;
    Object.keys(App.ziyaret.gunler).forEach(function (t) {
      var gun = App.ziyaret.gunler[t];
      ['sabah', 'ogleden_sonra', 'tam_gun'].forEach(function (z) {
        gun[z].forEach(function (giris) {
          toplam++;
          if (giris.durum === 'gerçekleşti') gerc++;
          else if (giris.durum === 'gerçekleşmedi') gercDegil++;
          else bekliyor++;
        });
      });
    });
    return '<div class="grid3" style="margin-bottom:16px">' +
      '<div class="card"><div class="card-b" style="text-align:center"><div style="font-size:22px;font-weight:700">' + toplam + '</div><div class="hint">' + yil + ' toplam planlı ziyaret</div></div></div>' +
      '<div class="card"><div class="card-b" style="text-align:center"><div style="font-size:22px;font-weight:700;color:var(--ok)">' + gerc + '</div><div class="hint">Gerçekleşti</div></div></div>' +
      '<div class="card"><div class="card-b" style="text-align:center"><div style="font-size:22px;font-weight:700;color:var(--red)">' + gercDegil + '</div><div class="hint">Gerçekleşmedi · bekleyen: ' + bekliyor + '</div></div></div>' +
      '</div>';
  }

  function ziyaretTakvimHtml(ayIndex, yil, firmalarim, duzenlenebilir) {
    var ilkGun = new Date(yil, ayIndex, 1);
    var ilkGunHaftaIndex = (ilkGun.getDay() + 6) % 7; // Pazartesi=0
    var ayinSonGunu = new Date(yil, ayIndex + 1, 0).getDate();
    var bugunISO = isoTarih(new Date());

    var hucreler = [];
    for (var i = 0; i < ilkGunHaftaIndex; i++) hucreler.push(null);
    for (var g = 1; g <= ayinSonGunu; g++) hucreler.push(g);
    while (hucreler.length % 7 !== 0) hucreler.push(null);

    var basliklar = GUN_KISA.map(function (g) { return '<div class="zv-baslik">' + g + '</div>'; }).join('');

    var gunler = hucreler.map(function (gun) {
      if (!gun) return '<div class="zv-hucre zv-bos"></div>';
      var tarih = new Date(yil, ayIndex, gun), tarihISO = isoTarih(tarih);
      var haftaSonu = !haftaIciMi(tarih);
      var bugunMu = tarihISO === bugunISO;
      var kayit = App.ziyaret.gunler[tarihISO];

      var icerik = ZAMAN_DILIMLERI.map(function (z) {
        var girisler = (kayit && kayit[z.v]) || [];
        var cipler = girisler.map(function (giris) {
          var f = App.firmalar.find(function (x) { return x._id === giris.firmaId; });
          var ad = f ? f.unvan : '(silinmiş firma)';
          var durumSinif = giris.durum === 'gerçekleşti' ? 'zv-ok' : giris.durum === 'gerçekleşmedi' ? 'zv-kotu' : 'zv-bekliyor';
          var eylemler = duzenlenebilir
            ? '<span class="zv-cip-eylem">' +
              '<button type="button" data-zdurum="' + tarihISO + ':' + z.v + ':' + giris.id + ':gerçekleşti" title="Gerçekleşti">✓</button>' +
              '<button type="button" data-zdurum="' + tarihISO + ':' + z.v + ':' + giris.id + ':gerçekleşmedi" title="Gerçekleşmedi">✕</button>' +
              '<button type="button" data-zsil="' + tarihISO + ':' + z.v + ':' + giris.id + '" title="Kaldır">🗑</button>' +
              '</span>'
            : '<span class="zv-cip-durum" title="' + (giris.durum === 'gerçekleşti' ? 'Gerçekleşti' : giris.durum === 'gerçekleşmedi' ? 'Gerçekleşmedi' : 'Bekliyor') + '">' +
              (giris.durum === 'gerçekleşti' ? '✓' : giris.durum === 'gerçekleşmedi' ? '✕' : '…') + '</span>';
          return '<div class="zv-cip ' + durumSinif + '" title="' + esc(ad) + (giris.tekrar ? ' · ' + ziyaretTekrarAdi(giris.tekrar) : '') + '">' +
            '<span class="zv-cip-ad">' + esc(ad) + '</span>' + eylemler + '</div>';
        }).join('');
        return '<div class="zv-zaman"><div class="zv-zaman-l">' + z.l + '</div>' + cipler +
          (haftaSonu || !duzenlenebilir ? '' : '<button type="button" class="zv-ekle" data-zekle="' + tarihISO + ':' + z.v + '">+ Firma ekle</button>') + '</div>';
      }).join('');

      return '<div class="zv-hucre' + (haftaSonu ? ' zv-haftasonu' : '') + (bugunMu ? ' zv-bugun' : '') + '">' +
        '<div class="zv-gun-no">' + gun + '</div>' + icerik + '</div>';
    }).join('');

    return '<div class="card"><div class="card-b tight"><div class="zv-takvim">' +
      '<div class="zv-baslikSatir">' + basliklar + '</div>' +
      '<div class="zv-govde">' + gunler + '</div>' +
      '</div></div></div>';
  }

  function ziyaretFirmaEkleModal(tarihISO, zaman) {
    if (!ziyaretDuzenlenebilirMi()) return;
    var firmalarim = kullaniciFirmalari(App.kullanici.kullanici);
    var ayAdi = AYLAR[+tarihISO.split('-')[1] - 1];
    modal({
      baslik: trTarih(tarihISO) + ' — firma ekle',
      govde: '<div class="field"><label for="ze_firma">Firma</label><select id="ze_firma">' +
        firmalarim.map(function (f) { return '<option value="' + esc(f._id) + '">' + esc(f.unvan) + '</option>'; }).join('') + '</select></div>' +
        '<div class="field"><label>Zaman dilimi</label><div>' + ZAMAN_DILIMLERI.map(function (z) { return z.v === zaman ? '<strong>' + z.l + '</strong>' : z.l; }).join(' · ') + '</div></div>' +
        '<div class="field"><label class="lbl">Ziyaret sıklığı</label>' +
        segHtml('ze_tekrar', ZIYARET_TEKRAR, '', true) + '<p class="hint" id="ze_hint">Yalnızca bu gün için tek bir ziyaret eklenecek.</p></div>' +
        '<div class="err-txt" id="ze_err"></div>',
      onay: 'Ekle',
      kaydet: function (kapat) {
        var firmaId = $('#ze_firma').value, tekrar = App._zeTekrar || '';
        if (!firmaId) { $('#ze_err').textContent = 'Firma seçin.'; return; }
        var tarihler = ziyaretTekrarTarihleri(tarihISO, tekrar, App.ziyaretYilSec);
        ziyaretEkle(firmaId, tarihler, zaman, tekrar);
        ziyaretKaydet().then(function () {
          kapat(); toast(tarihler.length > 1 ? tarihler.length + ' tarihe ziyaret eklendi' : 'Ziyaret eklendi', 'ok');
          renderZiyaret();
        }).catch(function (e) { $('#ze_err').textContent = 'Kaydedilemedi: ' + (e && e.message || e); });
      }
    });
    App._zeTekrar = '';
    var seg = $('[data-seg="ze_tekrar"]');
    seg.addEventListener('click', function (e) {
      var b = e.target.closest('button[data-v]'); if (!b) return;
      App._zeTekrar = b.getAttribute('data-v');
      $$('button[data-v]', seg).forEach(function (btn) { btn.setAttribute('aria-pressed', btn === b ? 'true' : 'false'); });
      $('#ze_hint').textContent = App._zeTekrar ? ('Bu tarihten itibaren ' + ayAdi + ' dahil ' + yil_str(App.ziyaretYilSec) + ' sonuna kadar, aynı gün ' + ziyaretTekrarAdi(App._zeTekrar).toLocaleLowerCase('tr') + ' olarak tekrar eden kayıtlar otomatik oluşturulacak. Sonradan her günü ayrı ayrı değiştirebilirsiniz.') : 'Yalnızca bu gün için tek bir ziyaret eklenecek.';
    });
    function yil_str(y) { return y + ' yılı'; }
  }

  function bindZiyaret() {
    var zKul = $('#zKul');
    if (zKul) zKul.addEventListener('change', function () {
      App.ziyaretSeciliKullanici = zKul.value; App.ziyaret = null; renderZiyaret();
    });
    $('#zAy').addEventListener('change', function () { App.ziyaretAy = +$('#zAy').value; renderZiyaret(); });
    $('#zYil').addEventListener('change', function () {
      App.ziyaretYilSec = +$('#zYil').value; App.ziyaret = null; renderZiyaret();
    });
    if (!ziyaretDuzenlenebilirMi()) return; // salt okunur görünümde düzenleme olayı bağlanmaz
    $$('[data-zekle]').forEach(function (b) {
      b.addEventListener('click', function () {
        var parca = b.getAttribute('data-zekle').split(':');
        ziyaretFirmaEkleModal(parca[0], parca[1]);
      });
    });
    $$('[data-zdurum]').forEach(function (b) {
      b.addEventListener('click', function () {
        var parca = b.getAttribute('data-zdurum').split(':');
        var mevcutDurum = App.ziyaret.gunler[parca[0]][parca[1]].find(function (x) { return x.id === parca[2]; }).durum;
        var yeni = mevcutDurum === parca[3] ? '' : parca[3]; // aynı butona tekrar basınca geri al
        ziyaretDurumDegistir(parca[0], parca[1], parca[2], yeni);
        ziyaretKaydet().then(function () { renderZiyaret(); })
          .catch(function (e) { toast('Kaydedilemedi: ' + (e && e.message || e), 'err'); });
      });
    });
    $$('[data-zsil]').forEach(function (b) {
      b.addEventListener('click', function () {
        var parca = b.getAttribute('data-zsil').split(':');
        if (!confirm('Bu ziyaret kaldırılsın mı?')) return;
        ziyaretSil(parca[0], parca[1], parca[2]);
        ziyaretKaydet().then(function () { renderZiyaret(); })
          .catch(function (e) { toast('Kaydedilemedi: ' + (e && e.message || e), 'err'); });
      });
    });
  }

  /* ==========================================================================
     MODAL
     ========================================================================== */
  function modal(o) {
    var m = document.createElement('div');
    m.className = 'mask';
    m.innerHTML = '<div class="modal' + (o.wide ? ' wide' : '') + '">' +
      '<div class="modal-h"><h2>' + esc(o.baslik) + '</h2><button class="btn btn-quiet x" data-kapat>✕</button></div>' +
      '<div class="modal-b">' + o.govde + '</div>' +
      '<div class="modal-f"><button class="btn btn-ghost" data-kapat>' + esc(o.iptal || 'Vazgeç') + '</button>' +
      (o.onay ? '<button class="btn btn-primary" data-onay>' + esc(o.onay) + '</button>' : '') + '</div></div>';
    document.body.appendChild(m);
    function kapat() { m.remove(); }
    $$('[data-kapat]', m).forEach(function (b) { b.addEventListener('click', kapat); });
    m.addEventListener('mousedown', function (e) { if (e.target === m) kapat(); });
    document.addEventListener('keydown', function esc2(e) {
      if (e.key === 'Escape') { kapat(); document.removeEventListener('keydown', esc2); }
    });
    var ok = $('[data-onay]', m);
    if (ok) ok.addEventListener('click', function () { o.kaydet(kapat); });
    return kapat;
  }

  /* ==========================================================================
     GLOBAL OLAYLAR
     ========================================================================== */
  document.addEventListener('click', function (e) {
    var t = e.target.closest('[data-goto]');
    if (t) {
      e.preventDefault();
      var ad = t.getAttribute('data-goto');
      if (App.kirli && !confirm('Kaydedilmemiş değişiklikler var. Ayrılmak istiyor musunuz?')) return;
      App.kirli = false; App.plan = null; App.egitim = null; App.oturum = null;
      git(ad === 'firma' ? { ad: 'firma', id: t.getAttribute('data-id') } : { ad: ad });
      return;
    }
    var f = e.target.closest('[data-firma]');
    if (f) { git({ ad: 'firma', id: f.getAttribute('data-firma') }); return; }
    var pg = e.target.closest('[data-pdfgor]');
    if (pg) { imzaliPlanGoster(pg.getAttribute('data-pdfgor')); return; }
    var pl = e.target.closest('[data-plan]');
    if (pl) { App.plan = null; git({ ad: 'plan', id: pl.getAttribute('data-plan') }); return; }
    var ps = e.target.closest('[data-plansil]');
    if (ps) {
      var id = ps.getAttribute('data-plansil');
      if (!confirm('Bu plan silinsin mi? Geri alınamaz.')) return;
      Store.del('planlar/' + id).then(function () {
        App.planlar = App.planlar.filter(function (x) { return x._id !== id; });
        render(); toast('Plan silindi', 'ok');
      });
      return;
    }
    var eg = e.target.closest('[data-egitim]');
    if (eg) { App.egitim = null; git({ ad: 'egitim', id: eg.getAttribute('data-egitim') }); return; }
    var es = e.target.closest('[data-egitimsil]');
    if (es) {
      var eid = es.getAttribute('data-egitimsil');
      if (!confirm('Bu eğitim planı silinsin mi? Geri alınamaz.')) return;
      Store.del('egitimplani/' + eid).then(function () {
        App.egitimPlanlari = App.egitimPlanlari.filter(function (x) { return x._id !== eid; });
        render(); toast('Eğitim planı silindi', 'ok');
      });
      return;
    }
    var oy = e.target.closest('#oturumYeni');
    if (oy) { App.oturum = yeniOturum(); git({ ad: 'oturum', id: App.oturum.id }); return; }
    var oa = e.target.closest('[data-oturum]');
    if (oa) { App.oturum = null; git({ ad: 'oturum', id: oa.getAttribute('data-oturum') }); return; }
    var os = e.target.closest('[data-oturumsil]');
    if (os) {
      var oid = os.getAttribute('data-oturumsil');
      if (!confirm('Bu eğitim kaydı silinsin mi? Geri alınamaz.')) return;
      Store.del('egitimoturum/' + oid).then(function () {
        App.oturumlar = App.oturumlar.filter(function (x) { return x._id !== oid; });
        render(); toast('Eğitim kaydı silindi', 'ok');
      });
      return;
    }
    var yf = e.target.closest('#yeniFirma,#yeniFirma2');
    if (yf) { firmaModal(null); }
  });

  window.addEventListener('beforeunload', function (e) {
    if (App.kirli) { e.preventDefault(); e.returnValue = ''; }
  });

  /* ==========================================================================
     AÇILIŞ
     ========================================================================== */
  function yukleVeAc() {
    // Bir önceki oturumdan kalan ziyaret takvimi önbelleğini temizle — aksi halde
    // farklı bir kullanıcı giriş yaptığında bir öncekinin ziyaret verileri görünebilir.
    App.ziyaret = null; App.ziyaretYil = null; App.ziyaretAy = null; App.ziyaretYilSec = null;
    App.plan = null; App.egitim = null; App.oturum = null;
    App.ziyaretKullanici = null; App.ziyaretSeciliKullanici = null;
    document.body.innerHTML = '<div class="boot"><div class="spin" style="border-color:rgba(0,0,0,.15);border-top-color:var(--red)"></div><span>Kayıtlar yükleniyor…</span></div>';
    Promise.all([Store.list('firmalar'), Store.list('planlar'), Store.list('users'), Store.list('egitimplani'), Store.list('egitimoturum')])
      .then(function (r) {
        App.firmalar = r[0]; App.planlar = r[1].map(planTamamla); App.kullanicilar = r[2];
        App.egitimPlanlari = r[3].map(egitimPlaniTamamla);
        App.oturumlar = r[4];
        App.route = { ad: 'ziyaret' };
        render();
      })
      .catch(function (e) {
        if (Store.mode === 'github' && ghKimlikHatasiMi(e)) {
          renderDepolamaKurulum('Bağlantı artık çalışmıyor (' + e.message + '). Erişim anahtarını güncelleyip tekrar bağlanın.', GH);
          return;
        }
        document.body.innerHTML = '<div class="boot">Kayıtlar yüklenemedi: ' + esc(e && e.message || e) + '</div>';
      });
  }

  function boot() {
    document.body.innerHTML = '<div class="boot"><div class="spin" style="border-color:rgba(0,0,0,.15);border-top-color:var(--red)"></div><span>Başlatılıyor…</span></div>';
    Store.init().then(function () {
      if (Store.mode === 'setup_needed') { renderDepolamaKurulum(); return Promise.reject({ _dur: true }); }
      return Store.get('app/config');
    }).then(function (cfg) {
      if (!cfg || !cfg.kurulmus) return Store.list('users').then(function (us) {
        if (!us.length) { renderKurulum(); return null; }
        return true;
      });
      return true;
    }).then(function (ok) {
      if (ok === null) return;
      var kayitli = null;
      try { kayitli = sessionStorage.getItem('karma_osgb_oturum'); } catch (e) { }
      if (kayitli) {
        return Store.get('users/' + kayitli).then(function (u) {
          if (u && u.aktif !== false) { App.kullanici = u; yukleVeAc(); } else renderGiris();
        });
      }
      renderGiris();
    }).catch(function (e) {
      if (e && e._dur) return; // depolama kurulum ekranı zaten gösterildi
      if (Store.mode === 'github' && ghKimlikHatasiMi(e)) {
        renderDepolamaKurulum('Bağlantı artık çalışmıyor (' + e.message + '). Erişim anahtarını güncelleyip tekrar bağlanın.', GH);
        return;
      }
      document.body.innerHTML = '<div class="boot">Uygulama başlatılamadı: ' + esc(e && e.message || e) + '</div>';
    });
  }

  /* ---------------- depolama bağlantısı kurulumu (GitHub) ---------------- */
  function ghKimlikHatasiMi(e) {
    return !!(e && (e.status === 401 || /erişim anahtarı|kimlik doğrulama|depo veya dosya bulunamadı/i.test(e.message || '')));
  }

  function renderDepolamaKurulum(mevcutHata, oncekiCfg) {
    var d = oncekiCfg || {};
    document.body.innerHTML =
      '<div class="gate"><div class="gate-card" style="max-width:440px">' +
      '<img class="gate-logo" src="' + LOGO + '" alt="KARMA İş Sağlığı Güvenliği">' +
      '<h1>Depolama bağlantısı</h1>' +
      '<p class="sub">Kayıtların tutulacağı GitHub deposunu bağlayın. Bu bilgiler yalnızca bu cihazda saklanır.</p>' +
      '<div class="field"><label for="d_owner">GitHub kullanıcı adı / organizasyon</label><input id="d_owner" type="text" placeholder="ör. karma-osgb" value="' + esc(d.owner || '') + '"></div>' +
      '<div class="field"><label for="d_repo">Depo adı</label><input id="d_repo" type="text" placeholder="ör. osgb-veri" value="' + esc(d.repo || '') + '"></div>' +
      '<div class="field"><label for="d_branch">Dal</label><input id="d_branch" type="text" value="' + esc(d.branch || 'main') + '"></div>' +
      '<div class="field"><label for="d_token">Erişim anahtarı (fine-grained token)</label><input id="d_token" type="password" placeholder="github_pat_…"></div>' +
      '<div class="err-txt" id="d_err">' + esc(mevcutHata || '') + '</div>' +
      '<button class="btn btn-primary btn-block" id="d_go">Bağlan ve devam et</button>' +
      '<p class="foot">Bu depo yalnızca veri için kullanılan, <strong>private</strong> ayrı bir depo olmalı — sitenizi yayınlayan depodan farklı.<br>' +
      '<a href="#" id="d_yerel" style="color:inherit;text-decoration:underline">Bunun yerine bu cihazda yerel olarak dene</a></p>' +
      '</div></div><div id="toast"></div>';

    function go() {
      var cfg = {
        owner: $('#d_owner').value.trim(), repo: $('#d_repo').value.trim(),
        branch: ($('#d_branch').value.trim() || 'main'), token: $('#d_token').value.trim()
      };
      var e = $('#d_err');
      if (!cfg.owner || !cfg.repo || !cfg.token) { e.textContent = 'Kullanıcı adı, depo adı ve erişim anahtarı gerekli.'; return; }
      e.textContent = 'Bağlantı test ediliyor…';
      $('#d_go').disabled = true;
      ghBaglantiTest(cfg).then(function () {
        try { localStorage.setItem(GH_LS, JSON.stringify(cfg)); } catch (x) { }
        GH = cfg; Store.mode = 'github';
        toast('GitHub deposuna bağlandı', 'ok');
        boot();
      }).catch(function (err) {
        $('#d_go').disabled = false;
        e.textContent = (err && err.message) || 'Bağlanılamadı.';
      });
    }
    $('#d_go').addEventListener('click', go);
    $('.gate-card').addEventListener('keydown', function (ev) { if (ev.key === 'Enter') go(); });
    $('#d_yerel').addEventListener('click', function (ev) {
      ev.preventDefault();
      try { localStorage.setItem(LOCAL_LS, '1'); } catch (x) { }
      Store.mode = 'local';
      boot();
    });
    $('#d_owner').focus();
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();


</script>
</body>
</html>
