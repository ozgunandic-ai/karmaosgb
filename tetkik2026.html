<title>2026 YILI SAĞLIK TETKİKLERİ ÜCRETİ</title>
<style>
:root{--red:#b8202f;--ink:#222;--line:#e3e3e3;--bg:#f6f6f6;--hl:#ffe58a}
*{box-sizing:border-box}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font-family:Segoe UI,Arial,sans-serif;color:var(--ink);background:var(--bg)}
.wrap{max-width:960px;margin:0 auto;padding:16px}
header{text-align:center;background:#fff;border-radius:12px;padding:16px;margin-bottom:14px}
header img{max-width:220px;width:60%;height:auto}
h1{font-size:1.4rem;margin:8px 0 0;color:var(--red);letter-spacing:.5px}
.search{position:sticky;top:0;z-index:5;background:var(--bg);padding:6px 0}
.search input{width:100%;font-size:1.05rem;padding:12px 14px;border:2px solid var(--line);border-radius:10px;outline:none}
.search input:focus{border-color:var(--red)}
#warn{display:none;margin-top:8px;background:#fdecea;color:#a1161f;border:1px solid #f5b5b9;padding:10px 14px;border-radius:8px;font-weight:600}
.card{background:#fff;border-radius:12px;padding:14px;margin-bottom:14px}
h2{font-size:1.05rem;margin:0 0 10px}
#list{columns:2 300px;column-gap:12px}
.item{display:flex;align-items:center;gap:10px;padding:8px 10px;border-bottom:1px solid var(--line);cursor:pointer;break-inside:avoid;border-radius:6px}
.item input{width:20px;height:20px;accent-color:var(--red);flex:none}
.item .nm{flex:1}.item .pr{color:#666;white-space:nowrap}
.item.hl{background:var(--hl);outline:2px solid #e0a800}
.item.checked .nm{font-weight:600}
table{width:100%;border-collapse:collapse}
th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--line)}
th{background:#fafafa}
td.r,th.r{text-align:right}
td button{border:0;background:none;color:var(--red);font-size:1.1rem;cursor:pointer}
tfoot td{font-weight:800;font-size:1.3rem;border-top:2px solid var(--ink);border-bottom:0}
.empty{color:#888;text-align:center;padding:14px}
.clear{float:right;font-size:.85rem;background:none;border:1px solid var(--line);border-radius:6px;padding:4px 10px;cursor:pointer}
</style>
